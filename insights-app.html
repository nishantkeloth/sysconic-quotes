<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>QTcal Insights</title>
<meta name="theme-color" content="#1a3c6e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Insights">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/insights-icon-192.png">
<link rel="icon" type="image/png" href="/icons/insights-icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#1a3c6e;--navy-dark:#0f2544;--navy-light:#dde8f7;
  --green:#047857;--amber:#b45309;--red:#b91c1c;
  --gray-100:#f1f3f6;--gray-200:#e3e7ee;--gray-500:#5a6475;--gray-900:#0f172a;
  --white:#fff;--radius:12px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gray-100);color:var(--gray-900);-webkit-font-smoothing:antialiased}
.screen{min-height:100vh;display:flex;flex-direction:column}

/* ── Login ─────────────────────────────────────────────────────────── */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + var(--safe-top))}
.login-card{width:100%;max-width:360px;background:var(--white);border-radius:16px;padding:28px 24px;box-shadow:0 8px 30px rgba(15,23,42,.08)}
.login-logo{width:56px;height:56px;border-radius:14px;margin:0 auto 16px;display:block}
.login-title{font-size:20px;font-weight:800;text-align:center;color:var(--navy-dark);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--gray-500);text-align:center;margin-bottom:22px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.fld input{width:100%;padding:13px 14px;font-size:16px;border:1.5px solid var(--gray-200);border-radius:10px;font-family:inherit}
.fld input:focus{outline:none;border-color:var(--navy)}
.btn{width:100%;padding:14px;font-size:15px;font-weight:700;border:none;border-radius:10px;background:var(--navy);color:#fff;cursor:pointer}
.btn:active{background:var(--navy-dark)}
.btn:disabled{opacity:.6}
.err-msg{background:#fee2e2;color:var(--red);font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:14px}

/* ── Dashboard chrome ──────────────────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:calc(14px + var(--safe-top)) 16px 14px;display:flex;justify-content:space-between;align-items:center}
.topbar-title{font-size:17px;font-weight:800}
.topbar-sub{font-size:13px;opacity:.75;margin-top:2px}
.topbar-actions{display:flex;gap:10px;align-items:center}
.icon-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:44px;height:44px;border-radius:11px;font-size:15px;display:flex;align-items:center;justify-content:center}
.content{flex:1;padding:14px 14px calc(78px + var(--safe-bottom))}

/* ── Bottom nav (Overview / Sales / Finance / Projects / Service) ────── */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--white);border-top:1px solid var(--gray-200);display:flex;padding-bottom:var(--safe-bottom);box-shadow:0 -2px 10px rgba(15,23,42,.06)}
.bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 4px 7px;background:none;border:none;font-family:inherit;color:var(--gray-500);min-height:52px}
.bottom-nav-item .nav-icon{font-size:19px;line-height:1}
.bottom-nav-item .nav-label{font-size:10px;font-weight:700}
.bottom-nav-item.active{color:var(--navy)}

/* ── Needs Attention (Overview tab) ───────────────────────────────────── */
.attn-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--gray-100);cursor:pointer}
.attn-item:first-child{border-top:none}
.attn-badge{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.attn-badge.red{background:#fee2e2;color:var(--red)}
.attn-badge.amber{background:#fef3c7;color:var(--amber)}
.attn-badge.green{background:#d1fae5;color:var(--green)}
.sec{margin-bottom:22px}
.sec-title{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.range-sel{font-size:13px;padding:6px 10px;min-height:44px;border:1.5px solid var(--gray-200);border-radius:8px;font-family:inherit;background:var(--white)}

/* ── Cards ─────────────────────────────────────────────────────────── */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.card{background:var(--white);border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.card-label{font-size:11.5px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.card-val{font-size:19px;font-weight:800;line-height:1.15}
.card-val.navy{color:var(--navy)}.card-val.green{color:var(--green)}.card-val.amber{color:var(--amber)}
.card-sub{font-size:13px;color:var(--gray-500);margin-top:3px}
.chart-card{background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px}
.chart-card .card-label{margin-bottom:8px}
.chart-box{position:relative;height:190px}

/* ── Lists ─────────────────────────────────────────────────────────── */
.list{background:var(--white);border-radius:12px;overflow:hidden}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--gray-100)}
.list-row:first-child{border-top:none}
.list-row-name{font-size:13.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row-meta{font-size:13px;color:var(--gray-500);text-align:right}
.list-row-val{font-size:13.5px;font-weight:800;color:var(--navy);text-align:right;white-space:nowrap}

/* ── Loading / empty ───────────────────────────────────────────────── */
.center-msg{text-align:center;color:var(--gray-500);font-size:13px;padding:40px 20px}
.spinner{width:26px;height:26px;border:3px solid var(--gray-200);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Invoice sheet ─────────────────────────────────────────────────── */
.sheet-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:flex;align-items:flex-end}
.sheet{background:var(--white);width:100%;max-height:82vh;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + var(--safe-bottom));overflow-y:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-title{font-size:16px;font-weight:800;color:var(--gray-900)}
.sheet-close{background:var(--gray-100);border:none;width:44px;height:44px;border-radius:50%;font-size:16px;color:var(--gray-500)}
.inv-row{padding:10px 0;border-top:1px solid var(--gray-100);font-size:13px}
.inv-row:first-child{border-top:none}
.inv-row-top{display:flex;justify-content:space-between;font-weight:700}
.inv-row-bottom{display:flex;justify-content:space-between;color:var(--gray-500);margin-top:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── State ────────────────────────────────────────────────────────────────
const API='';
const S={
  token:localStorage.getItem('qtcal_mobile_token')||null,
  user:JSON.parse(localStorage.getItem('qtcal_mobile_user')||'null'),
  company:JSON.parse(localStorage.getItem('qtcal_mobile_company')||'null'),
  // A "?share=<token>" URL (from an admin-generated public link, see
  // Company Profile > Public Insights Link) skips login entirely and pulls
  // data from the unauthenticated /api/insights/public endpoint instead --
  // see loadInsightsPublic() below. Read once at boot: the link is meant to
  // be opened directly (a home-screen shortcut), not switched to mid-session.
  shareToken:new URLSearchParams(location.search).get('share')||null,
  data:null, loading:false, error:null, loginError:null, loggingIn:false,
  // Period/filter selections -- remembered across app opens (see
  // setFilter() below) so re-opening the PWA doesn't silently reset back
  // to "All time"/"YTD" if the user had drilled into a specific period.
  zohoRange:localStorage.getItem('qtcal_mobile_zohoRange')||'all',
  salesRange:localStorage.getItem('qtcal_mobile_salesRange')||'all',
  sheet:null, // generic bottom sheet: {title, invoices, subtitle} | null -- see openSheet()/closeSheet()
  bizPeriod:localStorage.getItem('qtcal_mobile_bizPeriod')||'ytd',
  bizYear:localStorage.getItem('qtcal_mobile_bizYear')?parseInt(localStorage.getItem('qtcal_mobile_bizYear')):null,
  bankReconYear:localStorage.getItem('qtcal_mobile_bankReconYear')?parseInt(localStorage.getItem('qtcal_mobile_bankReconYear')):undefined,
  quotes:null,
  // Bottom-nav tab: overview|sales|finance|projects|service. Remembered
  // across app opens (same spirit as the token/user/company persistence
  // above) so re-opening the PWA lands wherever the user last was, not
  // always back at Overview.
  tab:localStorage.getItem('qtcal_mobile_tab')||'overview',
};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt=n=>isNaN(n)?'0.00':(+n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

function saveAuth(r){
  S.token=r.token;S.user=r.user;S.company=r.company;
  localStorage.setItem('qtcal_mobile_token',r.token);
  localStorage.setItem('qtcal_mobile_user',JSON.stringify(r.user));
  localStorage.setItem('qtcal_mobile_company',JSON.stringify(r.company));
}
function clearAuth(){
  S.token=null;S.user=null;S.company=null;S.data=null;
  localStorage.removeItem('qtcal_mobile_token');
  localStorage.removeItem('qtcal_mobile_user');
  localStorage.removeItem('qtcal_mobile_company');
}

// Mirrors index.html's api() helper: short-lived access token, silent
// refresh-and-retry once on 401 via the httpOnly refresh cookie set by
// /api/auth/login on this same origin.
async function api(method,path,body,_retried){
  const o={method,headers:{'Content-Type':'application/json'},credentials:'same-origin'};
  if(S.token)o.headers['Authorization']='Bearer '+S.token;
  if(body)o.body=JSON.stringify(body);
  let r;
  try{ r=await fetch(API+path,o); }
  catch(e){ return {error:'Network error — could not reach the server.'}; }
  if(r.status===401&&!_retried&&path!=='/api/auth/refresh'&&path!=='/api/auth/login'){
    const ref=await api('POST','/api/auth/refresh');
    if(ref&&ref.token){ saveAuth(ref); return api(method,path,body,true); }
    clearAuth(); render();
    return {error:'Session expired. Please sign in again.'};
  }
  let text=''; try{ text=await r.text(); }catch(e){ return {error:'Server error ('+r.status+')'}; }
  if(!text)return {};
  try{ return JSON.parse(text); }
  catch(e){ return {error:'Server error ('+r.status+'): '+text.slice(0,150)}; }
}

async function doLogin(email,password){
  S.loggingIn=true; S.loginError=null; render();
  const r=await api('POST','/api/auth/login',{email,password});
  S.loggingIn=false;
  if(r.error){ S.loginError=r.error; render(); return; }
  saveAuth(r); render();
  loadInsights();
  loadMobileQuotes(); loadBizMatches();
}
async function doLogout(){
  await api('POST','/api/auth/logout');
  clearAuth(); render();
}
async function loadInsights(force){
  if(!force&&S.data&&!S.loading)return;
  S.loading=true; S.error=null; render();
  const r=await api('GET','/api/insights/summary');
  S.loading=false;
  if(r.error){ S.error=r.error; } else { S.data=r; }
  render();
}
// Shared-link variant: no Authorization header, no login required. Kept
// separate from loadInsights() so a mistyped/expired share link fails with
// a clear message instead of tripping the token-refresh-and-retry logic in
// api(), which assumes a logged-in session.
async function loadInsightsPublic(force){
  if(!force&&S.data&&!S.loading)return;
  S.loading=true; S.error=null; render();
  const r=await fetch(API+'/api/insights/public?token='+encodeURIComponent(S.shareToken))
    .then(res=>res.json()).catch(()=>({error:'Network error — could not reach the server.'}));
  S.loading=false;
  if(r.error){ S.error=r.error; } else { S.data=r; }
  render();
}
let ZOHO_SYNCING=false;
async function syncZohoSales(){
  if(ZOHO_SYNCING)return;
  ZOHO_SYNCING=true; render();
  const r=await api('POST','/api/integrations/sync-sales',{});
  ZOHO_SYNCING=false;
  if(r.error){ alert('Sync failed: '+r.error); render(); return; }
  await loadInsights(true);
}

// ── Zoho Sales range filtering (same logic as the desktop app) ─────────────
function rangeBounds(range){
  const now=new Date(); const y=now.getFullYear(), m=now.getMonth();
  const q=Math.floor(m/3);
  if(range==='this_month')return[new Date(y,m,1), new Date(y,m+1,1)];
  if(range==='last_month')return[new Date(y,m-1,1), new Date(y,m,1)];
  if(range==='this_quarter')return[new Date(y,q*3,1), new Date(y,q*3+3,1)];
  if(range==='last_quarter')return[new Date(y,q*3-3,1), new Date(y,q*3,1)];
  if(range==='this_year')return[new Date(y,0,1), new Date(y+1,0,1)];
  if(range==='last_year')return[new Date(y-1,0,1), new Date(y,0,1)];
  return null;
}
function salesFiltered(sRaw,rangeOverride){
  if(!sRaw)return null;
  const bounds=rangeBounds(rangeOverride!==undefined?rangeOverride:S.salesRange);
  const quotes=(sRaw.quotes||[]).filter(q=>{
    if(!bounds)return true;
    if(!q.created_at)return false;
    const d=new Date(q.created_at);
    return d>=bounds[0]&&d<bounds[1];
  });
  const awarded=quotes.filter(q=>q.status==='awarded');
  const lost=quotes.filter(q=>q.status==='lost');
  const draftQ=quotes.filter(q=>q.status==='draft');
  const pendingQ=quotes.filter(q=>q.status==='sent');
  const closedCount=awarded.length+lost.length;
  const awardedValue=awarded.reduce((s,q)=>s+(q.total_sell||0),0);
  const awardedGp=awarded.reduce((s,q)=>s+(q.total_gp||0),0);
  return {
    total_quotes:quotes.length,
    awarded_count:awarded.length,
    awarded_value:awardedValue,
    pending_value:pendingQ.reduce((s,q)=>s+(q.total_sell||0),0),
    pending_count:pendingQ.length,
    draft_value:draftQ.reduce((s,q)=>s+(q.total_sell||0),0),
    draft_count:draftQ.length,
    win_rate_pct:closedCount?Math.round(awarded.length/closedCount*100):0,
    closed_count:closedCount,
    avg_margin_pct:awardedValue?Math.round(awardedGp/awardedValue*1000)/10:0,
  };
}
function zohoFiltered(zRaw,rangeOverride){
  if(!zRaw)return null;
  const bounds=rangeBounds(rangeOverride!==undefined?rangeOverride:S.zohoRange);
  const invoices=(zRaw.invoices||[]).filter(i=>{
    if(!bounds)return true;
    if(!i.invoice_date)return false;
    const d=new Date(i.invoice_date);
    return d>=bounds[0]&&d<bounds[1];
  });
  const byCust={}; let ti=0, tc=0;
  invoices.forEach(i=>{
    const name=i.customer_name||'Unknown customer';
    const c=byCust[name]||(byCust[name]={customer:name,invoiced:0,collected:0,count:0});
    const t=i.total||0, b=i.balance||0;
    c.invoiced+=t; c.collected+=(t-b); c.count+=1; ti+=t; tc+=(t-b);
  });
  const customers=Object.values(byCust).sort((a,b)=>b.invoiced-a.invoiced);
  return {invoices, customers, total_invoiced:ti, total_collected:tc, invoice_count:invoices.length, last_synced_at:zRaw.last_synced_at};
}

// Generic bottom sheet -- shows any invoice list with a title/subtitle.
// openInvoiceSheet() kept as the customer-row entry point (filters the
// current Zoho-range-filtered invoice set by customer); everything in the
// new Business Performance section below calls openSheet() directly with
// its own pre-filtered invoice array (a year, a month, an ageing bucket).
function openSheet(title,invoices,subtitle){ S.sheet={title,invoices:invoices||[],subtitle}; render(); }
function closeSheet(){ S.sheet=null; render(); }

// ── Bottom nav ──────────────────────────────────────────────────────────
// A tab is only offered once the company actually has that data -- mirrors
// the same `if(d.xxx)` presence checks the old single-scroll dashboard used
// (the key is only ever present in the payload when the backend's
// _has_feature() check for that module passed -- see api/quotes.py). Sales
// and Overview always show: every company has quotes, and Overview itself
// degrades gracefully with fewer cards when other modules are absent.
function _tabsAvailable(d){
  return {
    overview:true,
    sales:true,
    finance:!!(d.loans||d.payables||d.bank_recon),
    projects:!!d.financial,
    service:!!d.fsm,
  };
}
function goTab(t){
  S.tab=t; localStorage.setItem('qtcal_mobile_tab',t);
  render();
  window.scrollTo(0,0);
}

// ── Filter persistence ──────────────────────────────────────────────────
// Every period/range/year picker (Sales range, Zoho range, Business
// Performance period+year, Bank Reconciliation year) goes through this so
// the choice survives closing and reopening the app, same as the active
// tab above. isNum covers the two year pickers, which store as numbers.
function setFilter(key,val,isNum){
  S[key]=isNum?parseInt(val):val;
  localStorage.setItem('qtcal_mobile_'+key,String(S[key]));
  render();
}
function openInvoiceSheet(customerName){
  const z=zohoFiltered(S.data&&S.data.zoho_sales)||{invoices:[]};
  openSheet(customerName, z.invoices.filter(i=>(i.customer_name||'Unknown customer')===customerName));
}

// ── Business Performance (year-based Zoho financial view) ──────────────────
// Mirrors the desktop index.html implementation (same helper names/logic,
// same honesty caveats: "invoiced" is gross incl. VAT, "collected" is the
// proxy invoiced-minus-balance, both labeled as such -- see that file's
// comment block above _bizYearRows for the full rationale). No fiscal-year
// start-month picker here either (matches desktop): defaults to calendar
// year until a future slice adds that as a real, persisted company setting.
function _bizFyLabel(d){ return d.getFullYear(); }
function _bizFyBounds(y){ return [new Date(y,0,1), new Date(y+1,0,1)]; }
function _bizAllInvoices(){ const z=S.data&&S.data.zoho_sales; return (z&&z.invoices)||[]; }
function _bizNonDraft(inv){ return (inv.status||'').toLowerCase()!=='draft'; }
function _bizInRange(dateStr,from,to){
  if(!dateStr)return false;
  const d=new Date(dateStr);
  if(from&&d<from)return false;
  if(to&&d>=to)return false;
  return true;
}
function _bizYearRows(){
  const invoices=_bizAllInvoices().filter(_bizNonDraft);
  const byYear={};
  invoices.forEach(inv=>{
    if(!inv.invoice_date)return;
    const y=new Date(inv.invoice_date).getFullYear();
    const row=byYear[y]||(byYear[y]={year:y,invoiced:0,collected:0,unpaid:0,count:0});
    const total=inv.total||0, balance=inv.balance||0;
    row.invoiced+=total; row.collected+=(total-balance); row.unpaid+=balance; row.count+=1;
  });
  const years=Object.keys(byYear).map(Number).sort((a,b)=>b-a);
  const nowY=new Date().getFullYear();
  return years.map(y=>{
    const row=byYear[y], prev=byYear[y-1];
    const yoy=(prev&&prev.invoiced>0)?Math.round((row.invoiced-prev.invoiced)/Math.abs(prev.invoiced)*1000)/10:null;
    return {...row, yoy_pct:yoy, is_current:y===nowY};
  });
}
function _bizPeriodBounds(){
  const mode=S.bizPeriod||'ytd';
  const now=new Date();
  const y=S.bizYear||now.getFullYear();
  if(mode==='all')return {from:null,to:null,label:'All time',compareFrom:null,compareTo:null,compareLabel:null};
  if(mode==='year'){
    const [from,to]=_bizFyBounds(y), [cf,ct]=_bizFyBounds(y-1);
    return {from,to,label:'FY'+y,compareFrom:cf,compareTo:ct,compareLabel:'FY'+(y-1)};
  }
  if(mode==='prev_year'){
    const [from,to]=_bizFyBounds(y-1), [cf,ct]=_bizFyBounds(y-2);
    return {from,to,label:'FY'+(y-1),compareFrom:cf,compareTo:ct,compareLabel:'FY'+(y-2)};
  }
  const [fyStart]=_bizFyBounds(y);
  const from=fyStart, to=new Date(now.getTime()+1);
  const daysElapsed=Math.floor((now-fyStart)/86400000);
  const [pfyStart]=_bizFyBounds(y-1);
  return {from,to,label:'FY'+y+' YTD',compareFrom:pfyStart,compareTo:new Date(pfyStart.getTime()+(daysElapsed+1)*86400000),compareLabel:'FY'+(y-1)+' YTD'};
}
function _bizPeriodTotals(bounds){
  const invoices=_bizAllInvoices().filter(_bizNonDraft);
  const sum=(from,to)=>{
    let invoiced=0,collected=0,count=0;
    invoices.forEach(inv=>{
      if(!_bizInRange(inv.invoice_date,from,to))return;
      invoiced+=(inv.total||0); collected+=((inv.total||0)-(inv.balance||0)); count+=1;
    });
    return {invoiced,collected,count};
  };
  const cur=sum(bounds.from,bounds.to);
  let yoy=null;
  if(bounds.compareFrom){
    const prev=sum(bounds.compareFrom,bounds.compareTo);
    yoy=prev.invoiced>0?Math.round((cur.invoiced-prev.invoiced)/Math.abs(prev.invoiced)*1000)/10:null;
  }
  return {...cur, yoy_pct:yoy};
}
function _bizAsOfNow(){
  const invoices=_bizAllInvoices().filter(_bizNonDraft);
  const now=new Date();
  let outstanding=0, overdue=0;
  const buckets={not_due:0,b1_30:0,b31_60:0,b61_90:0,b90_plus:0};
  invoices.forEach(inv=>{
    const bal=inv.balance||0; if(bal<=0)return;
    outstanding+=bal;
    if(!inv.due_date){buckets.not_due+=bal;return;}
    const daysOver=Math.floor((now-new Date(inv.due_date))/86400000);
    if(daysOver<=0)buckets.not_due+=bal;
    else{
      overdue+=bal;
      if(daysOver<=30)buckets.b1_30+=bal;
      else if(daysOver<=60)buckets.b31_60+=bal;
      else if(daysOver<=90)buckets.b61_90+=bal;
      else buckets.b90_plus+=bal;
    }
  });
  return {outstanding,overdue,buckets,as_of:now};
}
function _bizMonthlySeries(y){
  const invoices=_bizAllInvoices().filter(_bizNonDraft);
  const months=[];
  for(let i=0;i<12;i++){
    months.push({key:y+'-'+i,label:new Date(y,i,1).toLocaleDateString('en-US',{month:'short'}),invoiced:0,collected:0});
  }
  const byKey={};months.forEach(m=>byKey[m.key]=m);
  invoices.forEach(inv=>{
    if(!inv.invoice_date)return;
    const dt=new Date(inv.invoice_date);
    const key=dt.getFullYear()+'-'+dt.getMonth();
    if(byKey[key]){byKey[key].invoiced+=(inv.total||0); byKey[key].collected+=((inv.total||0)-(inv.balance||0));}
  });
  return months;
}
function bizDrillYear(y){
  const invoices=_bizAllInvoices().filter(_bizNonDraft).filter(inv=>new Date(inv.invoice_date).getFullYear()===y);
  openSheet('FY'+y+' invoices',invoices,'By invoice date · gross incl. VAT');
}
function bizDrillMonth(y,idx){
  const from=new Date(y,idx,1), to=new Date(y,idx+1,1);
  const invoices=_bizAllInvoices().filter(_bizNonDraft).filter(inv=>_bizInRange(inv.invoice_date,from,to));
  openSheet(from.toLocaleDateString('en-US',{month:'long',year:'numeric'}),invoices);
}
function bizDrillAging(bucket){
  const now=new Date();
  const labels={not_due:'Not yet due',b1_30:'1–30 days overdue',b31_60:'31–60 days overdue',b61_90:'61–90 days overdue',b90_plus:'90+ days overdue'};
  const invoices=_bizAllInvoices().filter(_bizNonDraft).filter(inv=>{
    const bal=inv.balance||0; if(bal<=0)return false;
    if(!inv.due_date)return bucket==='not_due';
    const daysOver=Math.floor((now-new Date(inv.due_date))/86400000);
    if(bucket==='not_due')return daysOver<=0;
    if(bucket==='b1_30')return daysOver>0&&daysOver<=30;
    if(bucket==='b31_60')return daysOver>30&&daysOver<=60;
    if(bucket==='b61_90')return daysOver>60&&daysOver<=90;
    return daysOver>90;
  });
  openSheet(labels[bucket],invoices,'Current unpaid balance, aged by due date');
}
function bizDrillOutstanding(){
  const invoices=_bizAllInvoices().filter(_bizNonDraft).filter(inv=>(inv.balance||0)>0);
  openSheet('Current outstanding',invoices,'As of '+new Date().toLocaleString());
}
function bizDrillOverdue(){
  const now=new Date();
  const invoices=_bizAllInvoices().filter(_bizNonDraft).filter(inv=>{
    const bal=inv.balance||0; if(bal<=0||!inv.due_date)return false;
    return Math.floor((now-new Date(inv.due_date))/86400000)>0;
  });
  openSheet('Overdue invoices',invoices,'All ageing buckets, as of '+now.toLocaleString());
}
function downloadCsv(filename,rows){
  const escCsv=v=>{ const s=(v==null?'':String(v)); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const csv=rows.map(r=>r.map(escCsv).join(',')).join('\r\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  URL.revokeObjectURL(a.href);
}
function exportBizYearCsv(){
  const rows=_bizYearRows();
  const head=['Year','Invoiced (incl. VAT, AED)','Collected (proxy, AED)','Unpaid on this year\'s invoices (AED)','Invoice count','YoY growth %'];
  downloadCsv('business-performance-by-year.csv',[head,...rows.map(r=>[r.year,r.invoiced.toFixed(2),r.collected.toFixed(2),r.unpaid.toFixed(2),r.count,r.yoy_pct==null?'N/A':r.yoy_pct])]);
}

// Not available in shared-link (no-login) mode -- the matches endpoint
// requires an authenticated session, and this app never shows a number it
// can't source (see the "Unlinked — mapping required" rule in the spec).
let BIZ_MATCHES={loading:false,error:null,data:null};
async function loadBizMatches(force){
  if(S.shareToken)return;
  if(!force&&BIZ_MATCHES.data)return;
  BIZ_MATCHES={loading:true,error:null,data:BIZ_MATCHES.data}; render();
  const r=await api('GET','/api/insights/quote-invoice-matches');
  BIZ_MATCHES=r.error?{loading:false,error:r.error,data:null}:{loading:false,error:null,data:r.matches||[]};
  render();
}
let BIZ_GENERATING=false;
async function generateBizMatches(){
  if(BIZ_GENERATING)return;
  BIZ_GENERATING=true; render();
  const r=await api('POST','/api/insights/quote-invoice-matches/generate',{});
  BIZ_GENERATING=false;
  if(r.error){ alert('Could not generate matches: '+r.error); render(); return; }
  await loadBizMatches(true);
}
async function bizConfirmMatch(id){ const r=await api('POST','/api/insights/quote-invoice-matches/'+id+'/confirm',{}); if(r.error){alert(r.error);return;} await loadBizMatches(true); }
async function bizRejectMatch(id){ const r=await api('POST','/api/insights/quote-invoice-matches/'+id+'/reject',{}); if(r.error){alert(r.error);return;} await loadBizMatches(true); }
async function loadMobileQuotes(){
  if(S.shareToken||S.quotes!=null)return;
  const r=await api('GET','/api/quotes');
  S.quotes=r.quotes||[]; render();
}
function _bizQuoteReconciliation(){
  const awarded=(S.quotes||[]).filter(q=>q.status==='awarded');
  const matches=BIZ_MATCHES.data||[];
  return awarded.map(q=>{
    const own=matches.filter(m=>m.quote&&m.quote.id===q.id);
    const confirmed=own.filter(m=>m.status==='confirmed');
    const suggested=own.filter(m=>m.status==='suggested');
    const invoicedAmt=confirmed.reduce((s,m)=>s+((m.invoice&&m.invoice.total)||0),0);
    const remaining=Math.max(0,(q.total_sell||0)-invoicedAmt);
    let bucket;
    if(confirmed.length===0&&suggested.length===0)bucket='unlinked';
    else if(confirmed.length===0)bucket='suggested';
    else if(remaining<=0.01)bucket='full';
    else bucket='partial';
    return {quote:q, suggested, remaining, bucket};
  });
}

// Loan transaction drill-down -- fetched live from Zoho on tap, same
// generic bottom sheet used for invoice drill-downs elsewhere in this app,
// just with its own row template (borrowed/repaid instead of invoice total).
let LOAN_TXN_SHEET=null; // {title, transactions} | null
async function openLoanTxnSheet(loanAccountId, accountName){
  LOAN_TXN_SHEET={title:accountName, loading:true, transactions:[]};
  render();
  const r=await api('GET','/api/integrations/loan-accounts/'+loanAccountId+'/transactions');
  if(!LOAN_TXN_SHEET)return; // closed before the fetch finished
  if(r.error){ LOAN_TXN_SHEET={title:accountName, loading:false, error:r.error, transactions:[]}; render(); return; }
  LOAN_TXN_SHEET={title:accountName, loading:false, transactions:r.transactions||[], currentBalance:r.current_balance};
  render();
}
function closeLoanTxnSheet(){ LOAN_TXN_SHEET=null; render(); }

// Drills any Financial Health (Projects tab) KPI card down to the specific
// projects behind it, using the full per-project rows the backend now
// includes in d.financial.projects (see api/quotes.py).
function drillProjects(kind){
  const d=S.data||{}; const k=d.financial;
  if(!k||!k.projects)return;
  let rows=k.projects.slice(), title='Projects', subtitle='Tracked projects only';
  if(kind==='active'){
    rows=rows.filter(p=>p.status==='active'); title='Active projects';
  }else if(kind==='receivables'){
    rows=rows.filter(p=>(p.invoiced_value-p.collected_value)>0.01).sort((a,b)=>(b.invoiced_value-b.collected_value)-(a.invoiced_value-a.collected_value));
    title='Outstanding receivables';
  }else if(kind==='unbilled'){
    rows=rows.filter(p=>(p.revenue_forecast-p.invoiced_value)>0.01).sort((a,b)=>(b.revenue_forecast-b.invoiced_value)-(a.revenue_forecast-a.invoiced_value));
    title='Unbilled value';
  }else if(kind==='cash'){
    rows=rows.filter(p=>p.net_cash_position<0).sort((a,b)=>a.net_cash_position-b.net_cash_position);
    title='Cash exposure'; subtitle='Negative net cash position, tracked projects only';
  }else if(kind==='risk'){
    rows=rows.filter(p=>p.health_status==='at_risk'||p.health_status==='critical').sort((a,b)=>(a.health_status==='critical'?0:1)-(b.health_status==='critical'?0:1));
    title='At risk / Critical projects';
  }
  openRecordSheet(title,rows,p=>`<div class="inv-row">
    <div class="inv-row-top"><span>${esc(p.name||'')}</span><span>AED ${fmt(p.revenue_forecast)}</span></div>
    <div class="inv-row-bottom">
      <span>${esc(p.customer||'')}</span>
      <span>${kind==='receivables'?'AED '+fmt(p.invoiced_value-p.collected_value)+' due':kind==='unbilled'?'AED '+fmt(p.revenue_forecast-p.invoiced_value)+' unbilled':kind==='cash'?'AED '+fmt(p.net_cash_position):kind==='risk'?(p.health_status==='critical'?'Critical':'At risk'):fmt(p.forecast_gp_pct)+'% GP'}</span>
    </div>
  </div>`,subtitle);
}

function bankReconSectionHTML(BR){
  const monthsSet=[...new Set(BR.months.map(m=>m.month))].sort();
  if(!monthsSet.length) return '';
  const byAccountMonth={};BR.months.forEach(m=>byAccountMonth[m.zoho_account_id+'|'+m.month]=m);
  const totalUncategorized=BR.accounts.reduce((s,a)=>s+(a.uncategorized_transactions||0),0);
  const reconciledCount=BR.months.filter(m=>m.is_reconciled).length;
  const earliestLabel=new Date(monthsSet[0]+'T00:00:00').toLocaleDateString('en-US',{month:'short',year:'numeric'});
  const latestLabel=new Date(monthsSet[monthsSet.length-1]+'T00:00:00').toLocaleDateString('en-US',{month:'short',year:'numeric'});

  // Full history can span many years -- Zoho's own reconciliation records go
  // back as far as the account does -- so mobile gets a year picker (same
  // pattern as the Business Performance FY selector above) instead of trying
  // to cram every month onto a narrow screen.
  const monthsByYear={};
  monthsSet.forEach(m=>{const y=new Date(m+'T00:00:00').getFullYear();(monthsByYear[y]=monthsByYear[y]||[]).push(m);});
  const years=Object.keys(monthsByYear).map(Number).sort((a,b)=>b-a);
  const selYear=years.includes(S.bankReconYear)?S.bankReconYear:years[0];
  const yMonths=monthsByYear[selYear]||[];

  return `<div class="sec">
    <div class="sec-title">
      <span>📒 Bank Reconciliation</span>
      <select class="range-sel" onchange="setFilter('bankReconYear',this.value,true)">
        ${years.map(y=>`<option value="${y}" ${selYear===y?'selected':''}>${y}</option>`).join('')}
      </select>
    </div>
    <div style="font-size:11.5px;color:var(--gray-500);margin:-6px 0 10px">${earliestLabel} – ${latestLabel} · all accounts</div>
    <div class="cards">
      <div class="card"><div class="card-label">Reconciled</div><div class="card-val ${reconciledCount===BR.months.length?'green':'amber'}">${reconciledCount}/${BR.months.length}</div><div class="card-sub">all history, all accounts</div></div>
      <div class="card"><div class="card-label">Uncategorized</div><div class="card-val ${totalUncategorized>0?'amber':'green'}">${totalUncategorized}</div><div class="card-sub">as of now</div></div>
    </div>
    <div class="card-label" style="margin:4px 2px 8px">${selYear} by account</div>
    <div class="list">
      ${BR.accounts.map(a=>{
        const yReconciled=yMonths.filter(m=>{const c=byAccountMonth[a.zoho_account_id+'|'+m];return c&&c.is_reconciled;}).length;
        return `<div class="list-row" style="flex-direction:column;align-items:stretch;gap:4px">
          <div style="display:flex;justify-content:space-between"><span class="list-row-name">${esc(a.account_name)}</span><span class="list-row-val">AED ${fmt(a.balance)}</span></div>
          <div style="font-size:13px;color:var(--gray-500)">${yReconciled}/${yMonths.length} reconciled in ${selYear} · ${yMonths.map(m=>{const c=byAccountMonth[a.zoho_account_id+'|'+m];const ok=c&&c.is_reconciled;return `<span title="${esc(new Date(m+'T00:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'}))}">${ok?'✅':'⚠️'}</span>`;}).join(' ')}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

// ── Overview tab ─────────────────────────────────────────────────────────
// Curated cross-module snapshot -- always all-time figures (independent of
// whatever period filter is selected on the Sales tab), plus a single
// "Needs attention" feed pulling the highest-signal item out of each module
// that already tracks one (overdue payables, at-risk projects, overdue
// invoices, SLA breaches, expiring contracts) so a manager can see what
// needs action without visiting every tab.
function overviewSectionHTML(d){
  const sAll=d.sales?salesFiltered(d.sales,'all'):null;
  const asOf=d.zoho_sales?_bizAsOfNow():null;
  const k=d.financial, P=(d.payables&&d.payables.items&&d.payables.items.length)?d.payables:null, f=d.fsm;

  const kpis=[];
  if(sAll)kpis.push(['Awarded value','AED '+fmt(sAll.awarded_value),'navy',"goTab('sales')"]);
  if(sAll)kpis.push(['Win rate',sAll.win_rate_pct+'%','amber',"goTab('sales')"]);
  if(asOf)kpis.push(['Outstanding (all invoices)','AED '+fmt(asOf.outstanding),'amber','bizDrillOutstanding()']);
  if(P)kpis.push(['Payables outstanding','AED '+fmt(P.total_outstanding),'amber',"goTab('finance')"]);
  if(k)kpis.push(['Projects at risk / critical',k.projects_at_risk+' / '+k.critical_projects,k.critical_projects>0?'amber':'navy',"drillProjects('risk')"]);
  if(f)kpis.push(['SLA breaches',f.sla_breaches,f.sla_breaches>0?'amber':'green',f.sla_breaches?'drillSlaBreaches()':"goTab('service')"]);

  const today=new Date();today.setHours(0,0,0,0);
  const attn=[];
  if(P){
    P.items.filter(it=>it.status!=='paid'&&it.date&&new Date(it.date)<today).slice(0,4).forEach(it=>{
      attn.push({label:it.vendor,sub:(it.quote_title||'')+' · due '+new Date(it.date).toLocaleDateString(),val:'AED '+fmt(it.amount),badge:'Overdue',cls:'red',onclick:"goTab('finance')"});
    });
  }
  if(k&&k.at_risk_projects&&k.at_risk_projects.length){
    k.at_risk_projects.slice(0,4).forEach(p=>{
      attn.push({label:p.name||'',sub:p.customer||'',val:'',badge:p.health_status==='critical'?'Critical':'At risk',cls:p.health_status==='critical'?'red':'amber',onclick:"drillProjects('risk')"});
    });
  }
  if(asOf&&asOf.overdue>0){
    attn.push({label:'Overdue invoices',sub:'Across all customers, all time',val:'AED '+fmt(asOf.overdue),badge:'Overdue',cls:'red',onclick:'bizDrillOverdue()'});
  }
  if(f&&f.sla_breaches>0){
    attn.push({label:'SLA breaches',sub:'Open field-service tickets',val:String(f.sla_breaches),badge:'Action needed',cls:'red',onclick:'drillSlaBreaches()'});
  }
  if(f&&f.contracts_expiring_90d>0){
    attn.push({label:'Contracts expiring',sub:'Within 90 days',val:String(f.contracts_expiring_90d),badge:'Upcoming',cls:'amber',onclick:'drillContracts()'});
  }

  return `<div class="sec">
    <div class="sec-title"><span>👋 Overview</span></div>
    ${kpis.length?`<div class="cards">
      ${kpis.map(([label,val,cls,onclick])=>`<div class="card" style="cursor:pointer" onclick="${onclick}"><div class="card-label">${esc(label)}</div><div class="card-val ${cls}">${esc(String(val))}</div></div>`).join('')}
    </div>`:'<div class="center-msg">No data available yet.</div>'}
    ${attn.length?`<div class="card-label" style="margin:16px 2px 8px">Needs attention</div>
    <div class="list">
      ${attn.map(a=>`<div class="attn-item" onclick="${a.onclick}">
        <div style="min-width:0"><div class="list-row-name">${esc(a.label)}</div>${a.sub?`<div style="font-size:13px;color:var(--gray-500)">${esc(a.sub)}</div>`:''}</div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
          ${a.val?`<span class="list-row-val">${esc(a.val)}</span>`:''}
          <span class="attn-badge ${a.cls}">${esc(a.badge)}</span>
        </div>
      </div>`).join('')}
    </div>`:kpis.length?'<div class="center-msg" style="padding:20px">Nothing needs attention right now.</div>':''}
  </div>`;
}

function tabBodyHTML(tab,d){
  if(tab==='overview')return overviewSectionHTML(d);
  if(tab==='sales'){
    let b='';
    if(d.sales)b+=salesSectionHTML(d.sales,d.deals);
    if(d.zoho_sales)b+=zohoSectionHTML(d.zoho_sales);
    if(d.zoho_sales)b+=bizSectionHTML();
    if(!b)b='<div class="center-msg">No sales data available yet.</div>';
    return b;
  }
  if(tab==='finance'){
    let b='';
    if(d.payables&&d.payables.items&&d.payables.items.length)b+=payablesSectionHTML(d.payables);
    if(d.loans&&d.loans.accounts&&d.loans.accounts.length)b+=loansSectionHTML(d.loans);
    if(d.bank_recon&&d.bank_recon.accounts&&d.bank_recon.accounts.length)b+=bankReconSectionHTML(d.bank_recon);
    if(!b)b='<div class="center-msg">No finance data available yet.</div>';
    return b;
  }
  if(tab==='projects')return d.financial?financialSectionHTML(d.financial):'<div class="center-msg">No project data available yet.</div>';
  if(tab==='service')return d.fsm?fsmSectionHTML(d.fsm):'<div class="center-msg">No field-service data available yet.</div>';
  return '';
}

    body=`<div class="center-msg"><div class="spinner"></div>Loading Insights…</div>`;
  }else{
    if(S.error)body+=`<div class="err-msg">${esc(S.error)}</div>`;
    const avail=_tabsAvailable(d);
    const tab=avail[S.tab]?S.tab:'overview';
    if(S.tab!==tab){S.tab=tab;}
    if(!d.sales&&!d.zoho_sales&&!d.financial&&!d.fsm&&!S.error){
      body='<div class="center-msg">No data available yet.</div>';
    }else{
      body+=tabBodyHTML(tab,d);
    }
  }
  const companyName=d.company_name||(S.company&&S.company.name)||'';
  return `<div class="screen">
    <div class="topbar">
      <div>
        <div class="topbar-title">Insights</div>
        <div class="topbar-sub">${esc(companyName)}${S.shareToken?' · Shared view (read-only'+(d.finance_hidden?', finance hidden':'')+')':d.finance_hidden?' · Finance hidden for your role':''}</div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" title="Refresh" onclick="${S.shareToken?'loadInsightsPublic(true)':'loadInsights(true)'}">${S.loading?'⏳':'🔄'}</button>
        ${S.shareToken?'':'<button class="icon-btn" title="Sign out" onclick="doLogout()">⎋</button>'}
      </div>
    </div>
    <div class="content">${body}</div>
    ${(!S.loading||S.data)?bottomNavHTML(d):''}
  </div>
  ${invoiceSheetHTML()}
  ${loanTxnSheetHTML()}
  ${recordSheetHTML()}`;
}

function render(){
  const signedIn=S.token||S.shareToken;
  document.getElementById('app').innerHTML=signedIn?dashboardHTML():loginHTML();
  if(signedIn)setTimeout(initCharts,40);
}

// ── Charts ───────────────────────────────────────────────────────────────
let CHARTS={};
function destroyCharts(){ Object.values(CHARTS).forEach(c=>{try{c.destroy();}catch(e){}}); CHARTS={}; }
function initCharts(){
  if(typeof Chart==='undefined')return;
  destroyCharts();
  const d=S.data||{};

  const pipeEl=document.getElementById('mPipelineChart');
  if(pipeEl&&d.sales){
    const s=salesFiltered(d.sales);
    CHARTS.pipeline=new Chart(pipeEl,{
      type:'doughnut',
      data:{labels:['Awarded','Pending','Draft'],datasets:[{data:[s.awarded_value||0,s.pending_value||0,s.draft_value||0],backgroundColor:['#047857','#b45309','#1a3c6e'],borderWidth:0}]},
      options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10},padding:10}}}}
    });
  }

  const trendEl=document.getElementById('mTrendChart');
  if(trendEl&&d.zoho_sales){
    const now=new Date(); const months=[];
    for(let i=11;i>=0;i--){
      const dt=new Date(now.getFullYear(),now.getMonth()-i,1);
      months.push({key:dt.getFullYear()+'-'+dt.getMonth(),label:dt.toLocaleDateString('en-US',{month:'short'}),total:0});
    }
    const byKey={};months.forEach(m=>byKey[m.key]=m);
    (d.zoho_sales.invoices||[]).forEach(inv=>{
      if(!inv.invoice_date)return;
      const dt=new Date(inv.invoice_date);
      const key=dt.getFullYear()+'-'+dt.getMonth();
      if(byKey[key])byKey[key].total+=(inv.total||0);
    });
    CHARTS.trend=new Chart(trendEl,{
      type:'line',
      data:{labels:months.map(m=>m.label),datasets:[{data:months.map(m=>m.total),borderColor:'#1a3c6e',backgroundColor:'rgba(26,60,110,.08)',fill:true,tension:.35,pointRadius:2}]},
      options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{font:{size:9},callback:v=>fmt(v)}},x:{grid:{display:false},ticks:{font:{size:9}}}}}
    });
  }

  const custEl=document.getElementById('mCustChart');
  if(custEl&&d.zoho_sales){
    const z=zohoFiltered(d.zoho_sales);
    const top=(z.customers||[]).slice(0,8);
    CHARTS.customers=new Chart(custEl,{
      type:'bar',
      data:{labels:top.map(c=>c.customer.length>16?c.customer.slice(0,14)+'…':c.customer),datasets:[{data:top.map(c=>c.invoiced),backgroundColor:'#1a3c6e',borderRadius:4,maxBarThickness:16}]},
      options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{font:{size:9},callback:v=>fmt(v)}},y:{grid:{display:false},ticks:{font:{size:9}}}}}
    });
  }

  const bizMonthEl=document.getElementById('mBizMonthChart');
  if(bizMonthEl&&d.zoho_sales){
    const y=S.bizYear||new Date().getFullYear();
    const months=_bizMonthlySeries(y);
    CHARTS.bizMonth=new Chart(bizMonthEl,{
      type:'line',
      data:{labels:months.map(m=>m.label),datasets:[
        {label:'Invoiced',data:months.map(m=>m.invoiced),borderColor:'#1a3c6e',backgroundColor:'rgba(26,60,110,.08)',fill:true,tension:.3,pointRadius:2},
        {label:'Collected',data:months.map(m=>m.collected),borderColor:'#047857',backgroundColor:'rgba(4,120,87,.08)',fill:true,tension:.3,pointRadius:2},
      ]},
      options:{maintainAspectRatio:false,onClick:(evt,els)=>{if(els&&els.length)bizDrillMonth(y,els[0].index);},plugins:{legend:{position:'bottom',labels:{boxWidth:9,font:{size:9},padding:8}}},scales:{y:{beginAtZero:true,ticks:{font:{size:9},callback:v=>fmt(v)}},x:{grid:{display:false},ticks:{font:{size:9}}}}}
    });
  }
}

// ── Boot ─────────────────────────────────────────────────────────────────
render();
if(S.shareToken)loadInsightsPublic();
else if(S.token){ loadInsights(); loadMobileQuotes(); loadBizMatches(); }
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('/insights-sw.js').catch(()=>{}));
}
</script>
</body>
</html>
