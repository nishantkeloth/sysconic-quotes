// Two-step flow: draft the AI content first (no PDF yet) so it can be reviewed
// and edited, then generate Technical / Commercial / Combined independently.
let PROP={busy:false,file:null,step:'input',content:null,brief:'',which:'all',model:'gemini-3.5-flash',briefAuto:true};

// Drafts a plain-language project-scope sentence straight from the quote's own
// BOM (sections/brands/models/qty) so the "Describe the project" box in the
// proposal modal isn't a blank field the user has to fill in by hand every
// time -- it's pre-populated from real quote data, and they can still edit or
// add context (use case, floors, timeline) on top of it before drafting.
function propAutoBriefFromBOM(which){
  const allOpts=opts();
  if(!allOpts.length)return '';
  let selected;
  if(which==='all'){ selected=allOpts; }
  else { const idx=parseInt(which,10); selected=allOpts[idx]?[allOpts[idx]]:allOpts.slice(0,1); }
  const sectionNames=[]; const brandCounts={}; let totalQty=0; const itemLines=[];
  selected.forEach(o=>{
    (o.sections||[]).forEach(s=>{
      if(s.name)sectionNames.push(s.name);
      (s.items||[]).forEach(it=>{
        const qty=Number(it.qty)||0; totalQty+=qty;
        const b=(it.brand||'').trim(); if(b)brandCounts[b]=(brandCounts[b]||0)+1;
        const label=[it.brand,it.model].filter(Boolean).join(' ').trim();
        if(label)itemLines.push(`${qty>0?qty+'x ':''}${label}`.trim());
      });
    });
  });
  if(!itemLines.length && !sectionNames.length) return '';
  const uniqSections=[...new Set(sectionNames)];
  const brands=Object.keys(brandCounts).sort((a,b)=>brandCounts[b]-brandCounts[a]);
  const parts=['Supply, installation, and commissioning of an AV/IT solution'];
  if(uniqSections.length){
    parts.push(`covering ${uniqSections.length} area${uniqSections.length>1?'s':''} (${uniqSections.slice(0,6).join(', ')}${uniqSections.length>6?', and more':''})`);
  }
  if(brands.length){
    parts.push(`primarily using ${brands.slice(0,4).join(', ')}${brands.length>4?' and other':''} equipment`);
  }
  if(totalQty>0){
    parts.push(`totaling ${totalQty} unit${totalQty===1?'':'s'} across the bill of materials`);
  }
  let brief=parts.join(', ')+'.';
  if(itemLines.length){
    const top=itemLines.slice(0,6);
    brief+=` Key equipment includes: ${top.join(', ')}${itemLines.length>6?', and additional supporting items':''}.`;
  }
  return brief;
}
function propRegenBriefFromBOM(){
  PROP.brief=propAutoBriefFromBOM(PROP.which);
  PROP.briefAuto=true;
  renderProposalModal();
}

async function draftProposal(){
  if(PROP.busy)return;
  const brief=(document.getElementById('propBrief')?.value ?? PROP.brief ?? '').trim();
  if(!brief&&!PROP.file){alert('Describe the project or attach a reference document first.');return;}
  PROP.brief=brief;
  const wasReview=PROP.step==='review';
  const btn=document.getElementById(wasReview?'propRedraftBtn':'propGenBtn');
  if(btn){btn.disabled=true;btn.textContent=wasReview?'Redrafting…':'Drafting…';}
  PROP.busy=true;
  const body=wasReview?null:document.getElementById('propBody');
  if(body)body.innerHTML='<div style="text-align:center;padding:26px;color:var(--gray-500)">⏳ Drafting proposal content… this can take up to a minute</div>';
  let r;
  try{
    r=await api('POST','/api/proposal/draft',{quote_id:A.activeQuote.id,brief,which:PROP.which,attachment:PROP.file,model:PROP.model});
  }catch(e){
    PROP.busy=false;
    if(wasReview){alert('Could not reach the proposal service. Please try again.');if(btn){btn.disabled=false;btn.textContent='🔄 Redraft with AI';}}
    else{if(body)body.innerHTML='<div class="auth-err">Could not reach the proposal service. Please try again.</div>';if(btn){btn.disabled=false;btn.textContent='Draft with AI ✨';}}
    return;
  }
  PROP.busy=false;
  if(r.error){
    if(wasReview){alert('Redraft failed: '+r.error);if(btn){btn.disabled=false;btn.textContent='🔄 Redraft with AI';}}
    else{if(body)body.innerHTML=`<div class="auth-err">${esc(r.error)}</div>`;if(btn){btn.disabled=false;btn.textContent='Draft with AI ✨';}}
    return;
  }
  PROP.content=r.content;
  PROP.step='review';
  renderProposalModal();
}

async function renderProposalKind(kind){
  if(PROP.busy)return;
  const idMap={technical:'propGenTech',commercial:'propGenComm',combined:'propGenComb'};
  const labelMap={technical:'📘 Technical (no pricing)',commercial:'💰 Commercial (priced)',combined:'📗 Combined (priced)'};
  PROP.busy=true;
  const btn=document.getElementById(idMap[kind]);if(btn){btn.disabled=true;btn.textContent='Generating…';}
  // System Schematic section: render the saved Mermaid diagram to PNG client-side
  // (ReportLab can't run Mermaid) and ship it inside the content payload.
  if(kind!=='commercial'&&hasFeature('diagrams')&&(PROP.content.sections_enabled||{}).schematic!==false){
    try{
      const os_=opts();
      let dcode=null;
      if(PROP.which!=='all'&&os_[+PROP.which]?.diagram?.code)dcode=os_[+PROP.which].diagram.code;
      else dcode=(os_.find(o=>o.diagram&&o.diagram.code)||{}).diagram?.code||null;
      PROP.content.schematic_png=dcode?await diagCodeToPng(dcode):null;
    }catch(e){PROP.content.schematic_png=null;}
  }else{
    PROP.content.schematic_png=null;
  }
  let r;
  try{
    r=await api('POST','/api/proposal/render',{quote_id:A.activeQuote.id,which:PROP.which,kind,content:PROP.content});
  }catch(e){
    PROP.busy=false;if(btn){btn.disabled=false;btn.textContent=labelMap[kind];}
    alert('Could not reach the proposal service. Please try again.');return;
  }
  PROP.busy=false;if(btn){btn.disabled=false;btn.textContent=labelMap[kind];}
  const results=document.getElementById('propResults');
  if(r.error){if(results)results.insertAdjacentHTML('beforeend',`<div class="auth-err" style="margin-top:8px">${esc(r.error)}</div>`);return;}
  if(results)results.insertAdjacentHTML('beforeend',`<div style="margin-top:8px"><a href="${r.file.url}" target="_blank" class="btn btn-navy" style="display:inline-block;text-decoration:none">⬇ ${esc(r.file.name)}</a></div>`);
}

  ws['!cols']=[{wch:18},{wch:22},{wch:24},{wch:16},{wch:26},{wch:14}];

function importCustomers(event){
  const file=event.target.files[0];if(!file)return;event.target.value='';
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      let hi=-1;
      for(let i=0;i<Math.min(rows.length,10);i++){const r=rows[i].map(x=>String(x).toUpperCase());if(r.some(x=>x.includes('NAME'))){hi=i;break;}}
      if(hi===-1){alert('Could not find a NAME column header in that file.');return;}
      const H=rows[hi].map(x=>String(x).toUpperCase().trim());
      const col={name:H.findIndex(h=>h.includes('NAME')&&!h.includes('COMPANY')),company:H.findIndex(h=>h.includes('COMPANY')),email:H.findIndex(h=>h.includes('EMAIL')),phone:H.findIndex(h=>h.includes('PHONE')),address:H.findIndex(h=>h.includes('ADDRESS')),trn:H.findIndex(h=>h.includes('TRN'))};
      const customers=[];
      for(let i=hi+1;i<rows.length;i++){
        const row=rows[i];if(!row||row.every(x=>x===''||x===null))continue;
        const g=x=>x>=0?String(row[x]??'').trim():'';
        customers.push({name:g(col.name),company_name:g(col.company),email:g(col.email),phone:g(col.phone),address:g(col.address),trn:g(col.trn)});
      }
      if(!customers.length){alert('No customer rows found below the header.');return;}
      if(customers.length>1000){alert('Maximum 1000 rows per import — please split the file.');return;}
      if(!confirm(`Import ${customers.length} customers?`))return;
      const r=await api('POST','/api/customers/bulk',{customers});
      if(r.error){alert(r.error);return;}
      alert(`Imported ${r.imported} customers${r.skipped?`, skipped ${r.skipped} rows without a name`:''}.`);
      loadCustomersPage();
    }catch(err){alert('Could not read that Excel file.');}
  };
  reader.readAsBinaryString(file);
}

async function saveDealModal(dealId){
  const body={
    title:(document.getElementById('dfTitle')?.value||'').trim(),
    customer_name:document.getElementById('dfCustomer')?.value||'',
    value:Number(document.getElementById('dfValue')?.value)||0,
    expected_close_date:document.getElementById('dfClose')?.value||null,
    notes:document.getElementById('dfNotes')?.value||'',
  };
  if(!body.title){alert('Deal title is required.');return;}
  if(dealId){
    const stageSel=document.getElementById('dfStage');
    if(stageSel)body.stage_id=stageSel.value;
    const r=await api('PUT','/api/deals/'+dealId,body);
    if(r.error){alert(r.error);return;}
  }else{
    const r=await api('POST','/api/deals',body);
    if(r.error){alert(r.error);return;}
    // Best-effort, non-blocking: replicate this deal's customer into the
    // Customer Master (and from there, into Zoho Books if connected) the
    // moment the deal is created — never lets a Zoho hiccup stop the deal
    // itself from being created.
    if(body.customer_name && body.customer_name.trim()){
      try{ await syncDealCustomerToZoho(body.customer_name.trim(), r.deal.id); }catch(e){}
    }
  }
  closeDealModal();loadDealsPage();
}

// Finds or creates a Customer Master row matching this deal's typed customer
// name, pushes it to Zoho Books (POST /api/integrations/zoho/push-customer —
// a no-op if Zoho isn't connected for this company), then links the deal to
// that customer record. Every step is best-effort: this must never block or
// break deal creation, which has already succeeded by the time this runs.
async function syncDealCustomerToZoho(name, dealId){
  const found=await api('GET','/api/customers?limit=5&search='+encodeURIComponent(name));
  let customer=(found.customers||[]).find(c=>(c.name||'').trim().toLowerCase()===name.toLowerCase());
  if(!customer){
    const created=await api('POST','/api/customers',{name});
    if(created.error||!created.customer)return;
    customer=created.customer;
  }
  if(!customer.external_contact_id){
    await api('POST','/api/integrations/zoho/push-customer',{customer_id:customer.id});
  }
  await api('PUT','/api/deals/'+dealId,{customer_id:customer.id});
}

async function addDealNote(dealId){

  const r=await api('POST',`/api/deals/${dealId}/notes`,{body});

async function markDeal(dealId,status){

// Converts a deal into a real Quote using the exact same creation call
// "New Quote" uses (mkOption/DEFAULT_TERMS), then links the deal to it —
// deliberately not duplicated server-side quote-creation logic.
async function convertDealToQuote(dealId){
  const deal=DEALS.list.find(d=>d.id===dealId) || (await api('GET','/api/deals/'+dealId)).deal;
  if(!deal)return;
  const r=await api('POST','/api/quotes',{title:deal.title,customer:deal.customer_name||'',quote_data:[mkOption('Option 1')],terms_data:[...DEFAULT_TERMS],vendor_data:[],currency:deal.currency||'AED',exchange_rate:1});
  if(r.error){alert(r.error);return;}
  await api('PUT','/api/deals/'+dealId,{converted_quote_id:r.quote.id});
  closeDealModal();
  A.quotes.unshift(r.quote);openQuote(r.quote);
}
function openConvertedQuote(quoteId){
  closeDealModal();
  const q=A.quotes.find(x=>x.id===quoteId)||{id:quoteId};
  openQuote(q);
}

async function moveDealStage(id,dir){

  [DEALS.stages[i],DEALS.stages[j]]=[DEALS.stages[j],DEALS.stages[i]];
  await Promise.all(DEALS.stages.map((s,idx)=>api('PUT','/api/deals/stages/'+s.id,{sort_order:idx})));

function importVendorsMaster(event){
  const file=event.target.files[0];if(!file)return;event.target.value='';
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      let hi=-1;
      for(let i=0;i<Math.min(rows.length,10);i++){const r=rows[i].map(x=>String(x).toUpperCase());if(r.some(x=>x.includes('NAME'))){hi=i;break;}}
      if(hi===-1){alert('Could not find a NAME column header in that file.');return;}
      const H=rows[hi].map(x=>String(x).toUpperCase().trim());
      const col={name:H.findIndex(h=>h.includes('NAME')),category:H.findIndex(h=>h.includes('CATEGORY')),contact:H.findIndex(h=>h.includes('CONTACT')),email:H.findIndex(h=>h.includes('EMAIL')),phone:H.findIndex(h=>h.includes('PHONE')),address:H.findIndex(h=>h.includes('ADDRESS'))};
      const vendors=[];
      for(let i=hi+1;i<rows.length;i++){
        const row=rows[i];if(!row||row.every(x=>x===''||x===null))continue;
        const g=x=>x>=0?String(row[x]??'').trim():'';
        vendors.push({name:g(col.name),category:g(col.category),contact_person:g(col.contact),email:g(col.email),phone:g(col.phone),address:g(col.address)});
      }
      if(!vendors.length){alert('No vendor rows found below the header.');return;}
      if(vendors.length>1000){alert('Maximum 1000 rows per import — please split the file.');return;}
      if(!confirm(`Import ${vendors.length} vendors?`))return;
      const r=await api('POST','/api/vendors/bulk',{vendors});
      if(r.error){alert(r.error);return;}
      alert(`Imported ${r.imported} vendors${r.skipped?`, skipped ${r.skipped} rows without a name`:''}.`);
      loadVendorsMaster();
    }catch(err){alert('Could not read that Excel file.');}
  };
  reader.readAsBinaryString(file);
}

async function toggleRolePermission(roleId,pageKey,checked){
  // Send the FULL permissions set (not just the toggled key) -- the backend
  // replaces the whole permissions object on update rather than merging, so
  // sending only one key would silently wipe every other permission this
  // role had.
  const role=RBAC_ROLES_CACHE.find(rr=>rr.id===roleId);
  if(!role)return;
  const perms={...(role.permissions||{}),[pageKey]:checked};
  const r=await api('PUT',`/api/auth/roles/${roleId}`,{permissions:perms});
  if(r.error){alert('❌ '+r.error);loadRolesPermissions();return;}
  role.permissions=perms;
}

async function deleteRole(roleId,name){
  if(!confirm(`Delete role "${name}"? Anyone currently assigned this role will lose access to its pages (falling back to no restriction).`))return;
  const r=await api('DELETE',`/api/auth/roles/${roleId}`);
  if(r.error){alert('❌ '+r.error);return;}
  loadRolesPermissions();
}

let QN={};
async function loadQuoteNumbering(){
  const el=document.getElementById('qnBox');if(!el)return;
  const r=await api('GET','/api/quotes/numbering');
  if(r.error){el.innerHTML=`<div class="auth-err">${esc(r.error)}</div>`;return;}
  QN=r;
  const seqByYear={};(r.sequences||[]).forEach(s=>seqByYear[s.year]=s.next_number);
  if(!(r.current_year in seqByYear))seqByYear[r.current_year]=1;
  const years=Object.keys(seqByYear).map(Number).sort((a,b)=>b-a);
  el.innerHTML=`
    <div style="display:flex;gap:12px">
      <div class="fld" style="max-width:160px"><label>Prefix</label><input id="qnPrefix" maxlength="20" value="${esc(r.prefix)}"></div>
      <div class="fld" style="max-width:160px"><label>Digits (zero-padding)</label><input id="qnPadding" type="number" min="1" max="6" value="${esc(r.padding)}"></div>
    </div>
    <button class="btn btn-navy btn-sm" onclick="saveQuoteNumberingFormat()">Save format</button>

    <div style="font-weight:600;font-size:14px;margin:18px 0 10px;border-top:1px solid var(--gray-100);padding-top:16px">Number ranges by year</div>
    ${years.map(y=>`<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">
      <span style="width:60px;font-weight:600">${y}${y===r.current_year?' (current)':''}</span>
      <span style="color:var(--gray-500);font-size:13px">Next number:</span>
      <input id="qnNext_${y}" type="number" min="1" value="${seqByYear[y]}" style="width:110px">
      <button class="btn btn-sm" onclick="saveQuoteYearNumber(${y})">Save</button>
      <span style="font-size:12px;color:var(--gray-500)">→ next ref will be ${esc(r.prefix)}-${y}-${String(seqByYear[y]).padStart(r.padding,'0')}</span>
    </div>`).join('')}

    <div style="display:flex;gap:10px;align-items:center;margin-top:12px;border-top:1px solid var(--gray-100);padding-top:14px">
      <span style="font-size:13px;color:var(--gray-500)">Pre-set a year:</span>
      <input id="qnNewYear" type="number" placeholder="2027" style="width:90px">
      <input id="qnNewStart" type="number" min="1" placeholder="Starting number" style="width:130px">
      <button class="btn btn-sm" onclick="addQuoteYearRange()">Add</button>
    </div>
  `;
}
async function saveQuoteNumberingFormat(){
  const prefix=document.getElementById('qnPrefix').value;
  const padding=document.getElementById('qnPadding').value;
  const r=await api('PATCH','/api/quotes/numbering',{prefix,padding});
  if(r.error){alert(r.error);return;}
  QN=r;loadQuoteNumbering();
}
async function saveQuoteYearNumber(year){
  const next_number=document.getElementById('qnNext_'+year).value;
  const r=await api('PATCH','/api/quotes/numbering',{year,next_number});
  if(r.error){alert(r.error);return;}
  loadQuoteNumbering();
}
async function addQuoteYearRange(){
  const year=document.getElementById('qnNewYear').value;
  const next_number=document.getElementById('qnNewStart').value;
  if(!year||!next_number){alert('Enter both a year and a starting number.');return;}
  const r=await api('PATCH','/api/quotes/numbering',{year,next_number});
  if(r.error){alert(r.error);return;}
  loadQuoteNumbering();
}

async function uploadCompanyLogo(event){
  const file=event.target.files[0];if(!file)return;event.target.value='';
  const reader=new FileReader();
  reader.onload=async function(e){
    const r=await api('POST','/api/auth/company-profile/logo',{data:e.target.result,content_type:file.type});
    if(r.error){alert(r.error);return;}
    CP.logo_url=r.logo_url;
    const el=document.getElementById('cpLogoPreview');
    if(el)el.innerHTML=`<img src="${esc(r.logo_url)}" style="max-width:100%;max-height:100%">`;
  };
  reader.readAsDataURL(file);
}

function customRoleSelectHTML(currentRoleId,roles,onchange){
  const opts=roles.map(rl=>`<option value="${rl.id}" ${currentRoleId===rl.id?'selected':''}>${esc(rl.name)}</option>`).join('');
  return `<select class="input" style="width:auto;padding:4px 8px;font-size:13px;margin-left:10px" onchange="${onchange}" title="Custom role controlling which pages this person can see">
    <option value="">No restriction (default)</option>
    ${opts}
  </select>`;
}
async function assignCustomRole(userId,roleId){
  const r=await api('PUT',`/api/auth/users/${userId}/role`,{role_id:roleId||null});
  if(r.error){alert('Error: '+r.error);loadTeam();return;}
}
function roleSelectHTML(currentRole,onchange){
  return `<select class="input" style="width:auto;padding:4px 8px;font-size:13px;margin-left:10px" onchange="${onchange}">
    <option value="user"${currentRole==='user'?' selected':''}>User</option>
    <option value="admin"${currentRole==='admin'?' selected':''}>Admin</option>
  </select>`;
}
async function loadTeam(){
  const el=document.getElementById('teamList'); if(!el)return;
  const r=await api('GET','/api/auth/team');
  const rolesRes=await api('GET','/api/auth/roles');
  const customRoles=rolesRes.roles||[];
  const members=r.members||[], pending=r.pending||[];
  const isAdmin=A.user?.role==='admin';
  let html=members.map(m=>`<div class="team-member" style="${m.is_locked?'opacity:.6':''}">
    <div class="team-avatar">${(m.name||m.email)[0].toUpperCase()}</div>
    <div style="flex:1;min-width:150px;overflow:hidden"><div style="font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(m.name||'—')}">${esc(m.name||'—')}${m.is_locked?' <span class="role-badge" style="background:var(--red-light,#fee2e2);color:var(--red,#dc2626)" title="Locked — cannot sign in">🔒 Locked</span>':''}</div><div style="font-size:13px;color:var(--gray-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(m.email)}">${esc(m.email)}</div></div>
    <div class="tm-slot tm-slot-sm">${isAdmin?`<label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--gray-500);cursor:pointer;white-space:nowrap" title="Eligible to be picked as a quote reviewer"><input type="checkbox" ${m.can_review?'checked':''} onchange="toggleCanReview('${m.id}',this.checked)">Reviewer</label>`:(m.can_review?`<span class="role-badge" style="background:var(--gray-100);color:var(--gray-600)">Reviewer</span>`:'')}</div>
    <div class="tm-slot tm-slot-md">${isAdmin?`<label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--gray-500);cursor:pointer;white-space:nowrap" title="Sees every quote in the company on the dashboard, not just their own"><input type="checkbox" ${m.can_view_all_quotes?'checked':''} onchange="toggleCanViewAllQuotes('${m.id}',this.checked)">View all quotes</label>`:(m.can_view_all_quotes?`<span class="role-badge" style="background:var(--gray-100);color:var(--gray-600)">Views all quotes</span>`:'')}</div>
    <div class="tm-slot tm-slot-role">${isAdmin?roleSelectHTML(m.role,`changeMemberRole('${m.id}',this.value,'${esc(m.email).replace(/'/g,"&#39;")}')`):`<span class="role-badge role-${m.role}">${m.role}</span>`}</div>
    <div class="tm-slot tm-slot-lg">${isAdmin?customRoleSelectHTML(m.role_id,customRoles,`assignCustomRole('${m.id}',this.value)`):''}</div>
    <div class="tm-slot-actions">${isAdmin?`<button class="btn btn-sm" onclick="adminResetPassword('${m.id}','${esc(m.email).replace(/'/g,"&#39;")}')">Reset password</button>`:''}${isAdmin&&m.id!==A.user?.id?`<button class="btn btn-sm ${m.is_locked?'':'btn-red'}" onclick="toggleUserLock('${m.id}',${!!m.is_locked},'${esc(m.email).replace(/'/g,"&#39;")}')">${m.is_locked?'🔓 Unlock':'🔒 Lock'}</button>`:''}</div>
  </div>`).join('');
  if(pending.length){html+=`<div style="font-size:12px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px">Pending invites</div>`;
    html+=pending.map(p=>`<div class="team-member"><div class="team-avatar" style="background:var(--amber-light);color:var(--amber)">✉</div><div style="flex:1;min-width:150px;overflow:hidden"><div style="font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(p.email)}">${esc(p.email)}</div><div style="font-size:13px;color:var(--gray-500)">Pending</div></div>
    <div class="tm-slot tm-slot-sm">${isAdmin?`<label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--gray-500);cursor:pointer;white-space:nowrap" title="Eligible to be picked as a quote reviewer once they join"><input type="checkbox" ${p.can_review?'checked':''} onchange="toggleInviteCanReview('${p.token}',this.checked)">Reviewer</label>`:(p.can_review?`<span class="role-badge" style="background:var(--gray-100);color:var(--gray-600)">Reviewer</span>`:'')}</div>
    <div class="tm-slot tm-slot-md">${isAdmin?`<label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--gray-500);cursor:pointer;white-space:nowrap" title="Sees every company quote once they join, not just their own"><input type="checkbox" ${p.can_view_all_quotes?'checked':''} onchange="toggleInviteCanViewAllQuotes('${p.token}',this.checked)">View all quotes</label>`:(p.can_view_all_quotes?`<span class="role-badge" style="background:var(--gray-100);color:var(--gray-600)">Views all quotes</span>`:'')}</div>
    <div class="tm-slot tm-slot-role">${isAdmin?roleSelectHTML(p.role,`changeInviteRole('${p.token}',this.value,'${esc(p.email).replace(/'/g,"&#39;")}')`):`<span class="role-badge role-${p.role}">${p.role}</span>`}</div>
    <div class="tm-slot tm-slot-lg"></div>
    <div class="tm-slot-actions"></div>
    </div>`).join('');}
  // Note: member rows have one tm-slot-lg for the custom-role select, then a
  // tm-slot-actions holding both action buttons together (Reset password +
  // Lock/Unlock) -- matches the two placeholders above so columns stay
  // aligned between members and pending invites.
  el.innerHTML=html||'<div style="color:var(--gray-500)">No team members yet</div>';
}

// ── Excel import ──────────────────────────────────────────────────────────────
function importExcel(event){
  const file=event.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      let hi=-1;
      for(let i=0;i<Math.min(rows.length,15);i++){
        const r=rows[i].map(c=>String(c).toUpperCase().trim());
        if(r.some(c=>c.includes('BRAND')||c.includes('MODEL')||c.includes('DESC'))){hi=i;break;}
      }
      if(hi===-1){alert('Could not find column headers. Make sure the file has BRAND, MODEL, DESCRIPTION columns.');return;}
      const H=rows[hi].map(c=>String(c).toUpperCase().trim());
      const col={section:H.findIndex(h=>h.includes('SECTION')),brand:H.findIndex(h=>h.includes('BRAND')),model:H.findIndex(h=>h.includes('MODEL')),desc:H.findIndex(h=>h.includes('DESC')),unitPrice:H.findIndex(h=>h.includes('UNIT')||h.includes('SELL')),qty:H.findIndex(h=>h==='QTY'||h.includes('QUANT')),margin:H.findIndex(h=>h.includes('MARGIN')),cost:H.findIndex(h=>h.includes('MSRP')||h.includes('COST')),disc:H.findIndex(h=>h.includes('DISC'))};
      const hasSec=col.section>=0;
      const sections=[];const smap={};let curSec=null;
      for(let i=hi+1;i<rows.length;i++){
        const row=rows[i];
        if(!row||row.every(c=>c===''||c===null))continue;
        const secN=hasSec&&col.section>=0?String(row[col.section]||'').trim():'';
        const brand=col.brand>=0?String(row[col.brand]||'').trim():'';
        const model=col.model>=0?String(row[col.model]||'').trim():'';
        const desc=col.desc>=0?String(row[col.desc]||'').trim():'';
        const up=col.unitPrice>=0?parseFloat(row[col.unitPrice])||0:0;
        const qty=col.qty>=0?parseFloat(row[col.qty])||1:1;
        const mr=col.margin>=0?parseFloat(row[col.margin])||0.2:0.2;
        const margin=mr>1?mr/100:mr;
        const costRaw=col.cost>=0?parseFloat(row[col.cost])||0:0;
        const disc=col.disc>=0?parseFloat(row[col.disc])||0:0;
        const rowTxt=(secN+brand+model+desc).toUpperCase();
        if(rowTxt.includes('TOTAL')||rowTxt.includes('GRAND')||rowTxt.includes('VAT'))continue;
        if(hasSec){
          if(!brand&&!model&&!desc)continue;
          const sn=secN||'General';
          if(!smap[sn]){const ns={id:uid(),name:sn,items:[]};sections.push(ns);smap[sn]=ns;}
          curSec=smap[sn];
        } else {
          const isSec=(!brand&&!model&&up===0)&&(desc.length>2||String(row[0]||'').trim().length>2);
          if(isSec){const sn=desc||String(row[0]||'').trim();if(sn&&!sn.toUpperCase().includes('TOTAL')){if(!smap[sn]){const ns={id:uid(),name:sn,items:[]};sections.push(ns);smap[sn]=ns;}curSec=smap[sn];}continue;}
          if(!brand&&!model&&!desc)continue;
          if(!curSec){curSec={id:uid(),name:'Imported Items',items:[]};sections.push(curSec);smap['Imported Items']=curSec;}
        }
        let cost=costRaw;
        if(!cost&&up&&margin)cost=up*(1-margin);
        curSec.items.push({id:uid(),brand,model,desc,qty:qty||1,cost:Math.round(cost),disc:disc>1?disc:disc*100,margin:margin||0.2});
      }
      if(!sections.length){alert('No items found. Check your file format.');return;}
      if(!A.activeQuote.quote_data)A.activeQuote.quote_data=[];
      if(!A.activeQuote.quote_data[A.activeOpt])A.activeQuote.quote_data[A.activeOpt]=mkOption('Option 1');
      A.activeQuote.quote_data[A.activeOpt].sections=sections;
      if(!A.activeQuote.customer)A.activeQuote.customer=file.name.replace(/\.xlsx?$/i,'').replace(/_/g,' ');
      schedSave();draw();
      const total=sections.reduce((s,sec)=>s+sec.items.length,0);
      setTimeout(()=>alert(`✅ Import successful!\n\n${sections.length} sections · ${total} line items`),100);
    }catch(err){console.error(err);alert('Error reading file: '+err.message);}
  };
  reader.readAsBinaryString(file);
  event.target.value='';
}

// ── Module 11: SLA Management ────────────────────────────────────────────
function fsmSlaBadge(label,dueAt,actualAt){
  if(!dueAt)return '';
  const due=new Date(dueAt),now=new Date();
  const pfx=label?label+' ':'';
  let cls,text;
  if(actualAt){
    const actual=new Date(actualAt);
    const met=actual<=due;
    cls=met?'s-resolved':'s-critical';
    text=`${pfx}${met?'met':'missed'}`;
  }else{
    const hoursLeft=(due-now)/3600000;
    cls=hoursLeft<0?'s-critical':hoursLeft<=2?'s-waiting':'s-resolved';
    text=hoursLeft<0?`${pfx}overdue`:`${pfx}${hoursLeft<1?Math.round(hoursLeft*60)+'m':Math.round(hoursLeft)+'h'} left`;
  }
  return `<span class="sbadge ${cls}" title="${label?label+' d':'D'}ue ${due.toLocaleString()}">${text}</span>`;
}
function fsmTicketSlaCell(t){
  if(t.status==='closed'||t.status==='cancelled')return '';
  return fsmSlaBadge('Resolution',t.sla_resolution_due_at,t.resolved_at)||fsmSlaBadge('Response',t.sla_response_due_at,t.first_response_at)||'<span style="color:var(--gray-400);font-size:12px">No SLA</span>';
}

function fsmSlaCardHTML(t){
  if(!t.sla_response_due_at&&!t.sla_resolution_due_at){
    return `<div style="color:var(--gray-500);font-size:13px">No SLA on this ticket — its site/customer has no active contract with SLA hours set.</div>`;
  }
  const row=(label,dueAt,actualAt)=>{
    if(!dueAt)return '';
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--gray-100)">
      <div style="font-size:13px"><strong>${label}</strong>${actualAt?` <span style="color:var(--gray-500)">— ${new Date(actualAt).toLocaleString()}</span>`:''}</div>
      ${fsmSlaBadge('',dueAt,actualAt)}
    </div>`;
  };
  return row('Response',t.sla_response_due_at,t.first_response_at)+row('Resolution',t.sla_resolution_due_at,t.resolved_at);
}

async function recordFsmPartTransaction(partId){
  const type=document.getElementById('fsmPartTxnType')?.value;
  const quantity=document.getElementById('fsmPartTxnQty')?.value;
  const notes=document.getElementById('fsmPartTxnNotes')?.value||'';
  if(!quantity||Number(quantity)===0){alert('Enter a quantity.');return;}
  const r=await api('POST','/api/fsm_parts?resource=transaction&action=create',{part_id:partId,type,quantity:Number(quantity),notes});
  if(r.error){alert(r.error);return;}
  closeFsmPartModal();
  A.fsmParts=null;loadFSMParts();

async function saveFsmPart(partId){
  const errEl=document.getElementById('fsmPartError');
  const name=(document.getElementById('fsmPartName')?.value||'').trim();
  if(!name){if(errEl){errEl.textContent='Name is required.';errEl.style.display='block';}return;}
  const num=id=>{const v=document.getElementById(id)?.value;return v?Number(v):null;};
  if(partId){
    const body={
      name,
      category:document.getElementById('fsmPartCategory')?.value||'',
      manufacturer:document.getElementById('fsmPartMfr')?.value||'',
      supplier:document.getElementById('fsmPartSupplier')?.value||'',
      compatible_models:document.getElementById('fsmPartCompat')?.value||'',
      stock_location:document.getElementById('fsmPartLocation')?.value||'',
      reorder_level:num('fsmPartReorder'),
      unit_cost:num('fsmPartUnitCost'),
    };
    const r=await api('PATCH','/api/fsm_parts?resource=part&action=update&id='+partId,body);
    if(r.error){if(errEl){errEl.textContent=r.error;errEl.style.display='block';}return;}
  }else{
    const part_code=(document.getElementById('fsmPartCode')?.value||'').trim();
    if(!part_code){if(errEl){errEl.textContent='Part Code is required.';errEl.style.display='block';}return;}
    const body={
      part_code,name,
      category:document.getElementById('fsmPartCategory')?.value||'',
      manufacturer:document.getElementById('fsmPartMfr')?.value||'',
      supplier:document.getElementById('fsmPartSupplier')?.value||'',
      compatible_models:document.getElementById('fsmPartCompat')?.value||'',
      stock_location:document.getElementById('fsmPartLocation')?.value||'',
      reorder_level:num('fsmPartReorder'),
      unit_cost:num('fsmPartUnitCost'),
      quantity_on_hand:num('fsmPartInitialQty')||0,
    };
    const r=await api('POST','/api/fsm_parts?resource=part&action=create',body);
    if(r.error){if(errEl){errEl.textContent=r.error;errEl.style.display='block';}return;}
  }
  closeFsmPartModal();
  A.fsmParts=null;loadFSMParts();
}

async function saveFsmPmSchedule(pmId){
  const errEl=document.getElementById('fsmPmError');
  const name=(document.getElementById('fsmPmName')?.value||'').trim();
  const site_id=document.getElementById('fsmPmSite')?.value;
  const next_due_date=document.getElementById('fsmPmNextDue')?.value;
  if(!name||!site_id||!next_due_date){if(errEl){errEl.textContent='Schedule Name, Site and Next Due Date are required.';errEl.style.display='block';}return;}
  const checklist=(document.getElementById('fsmPmChecklist')?.value||'').split('\n').map(s=>s.trim()).filter(Boolean).map(text=>({text,done:false}));
  const body={
    name,site_id,next_due_date,
    asset_id:document.getElementById('fsmPmAsset')?.value||null,
    frequency:document.getElementById('fsmPmFrequency')?.value||'quarterly',
    assigned_engineer_id:document.getElementById('fsmPmEngineer')?.value||null,
    checklist,
  };
  const activeSel=document.getElementById('fsmPmActive');
  if(activeSel)body.is_active=activeSel.value==='true';
  const r=pmId
    ?await api('PATCH','/api/fsm_pm?resource=schedule&action=update&id='+pmId,body)
    :await api('POST','/api/fsm_pm?resource=schedule&action=create',body);
  if(r.error){if(errEl){errEl.textContent=r.error;errEl.style.display='block';}return;}
  closeFsmPmModal();
  A.fsmPmSchedules=null;loadFSMPmSchedules();
}

// ── Module 6: Scheduling & Dispatch — drag-and-drop weekly board ───────────
let FSM_SCHED={dragId:null};

function fsmWeekStart(offsetWeeks){
  const d=new Date();d.setHours(0,0,0,0);
  const dow=(d.getDay()+6)%7; // 0=Mon .. 6=Sun
  d.setDate(d.getDate()-dow+(offsetWeeks||0)*7);
  return d;
}
function fsmISODate(d){return d.toISOString().slice(0,10);}

async function loadFSMSchedule(){
  if(A.fsmEngineers==null)await loadFSMEngineers();
  const [wo,tk]=await Promise.all([
    api('GET','/api/fsm_tickets?resource=work_order&action=list'),
    api('GET','/api/fsm_tickets?resource=ticket&action=list'),
  ]);
  A.fsmScheduleWO=Array.isArray(wo)?wo:[];
  A.fsmScheduleTickets={};(Array.isArray(tk)?tk:[]).forEach(t=>A.fsmScheduleTickets[t.id]=t);
  draw();
}

function fsmScheduleHTML(){
  if(A.fsmScheduleWO==null)return `<div style="padding:22px;color:var(--gray-500)">Loading…</div>`;
  const offset=A.fsmScheduleOffset||0;
  const weekStart=fsmWeekStart(offset);
  const days=[...Array(7)].map((_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return d;});
  const engineers=(A.fsmEngineers||[]).filter(e=>e.is_active!==false);
  const tkById=A.fsmScheduleTickets||{};
  const open=(A.fsmScheduleWO||[]).filter(w=>!w.completion_notes);
  const unscheduled=open.filter(w=>!w.engineer_id||!w.visit_date);

  const card=w=>{
    const t=tkById[w.ticket_id]||{};
    return `<div class="sbadge s-sent" draggable="true" ondragstart="fsmSchedDragStart(event,'${w.id}')"
      style="display:block;cursor:grab;margin-bottom:4px;padding:4px 8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"
      title="${esc(t.subject||'')}" onclick="A.page='fsmDetail';A.fsmDetailId='${w.ticket_id}';A.fsmDetail=null;A.fsmActivity=null;draw();loadFSMDetail('${w.ticket_id}')">
      ${esc(t.ticket_number||'—')}
    </div>`;
  };

  const dayHeaders=days.map(d=>`<div style="padding:8px;font-size:12px;font-weight:700;color:var(--gray-500);text-align:center">${d.toLocaleDateString(undefined,{weekday:'short'})}<br>${d.getDate()}/${d.getMonth()+1}</div>`).join('');

  const rows=engineers.map(e=>{
    const cells=days.map(d=>{
      const iso=fsmISODate(d);
      const items=open.filter(w=>w.engineer_id===e.id&&w.visit_date===iso);
      return `<div style="border:1px solid var(--gray-100);min-height:56px;padding:4px" ondragover="event.preventDefault()" ondrop="fsmSchedDrop(event,'${e.id}','${iso}')">
        ${items.map(card).join('')}
      </div>`;
    }).join('');
    return `<div style="display:grid;grid-template-columns:140px repeat(7,1fr);align-items:stretch">
      <div style="padding:8px;font-size:13px;font-weight:600;border:1px solid var(--gray-100);display:flex;align-items:center">${esc(e.name)}</div>
      ${cells}
    </div>`;
  }).join('');

  return `<div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm" onclick="A.fsmScheduleOffset=${offset-1};draw()">&larr; Prev week</button>
        <button class="btn btn-sm" onclick="A.fsmScheduleOffset=0;draw()">This week</button>
        <button class="btn btn-sm" onclick="A.fsmScheduleOffset=${offset+1};draw()">Next week &rarr;</button>
      </div>
      <div style="font-size:13px;color:var(--gray-500)">${weekStart.toLocaleDateString()} – ${days[6].toLocaleDateString()}</div>
    </div>
    <div style="margin-bottom:16px;border:1px dashed var(--gray-300);border-radius:8px;padding:10px" ondragover="event.preventDefault()" ondrop="fsmSchedDropUnscheduled(event)">
      <div style="font-size:12px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Unscheduled (${unscheduled.length})</div>
      ${unscheduled.length?`<div style="display:flex;flex-wrap:wrap;gap:6px">${unscheduled.map(card).join('')}</div>`:`<div style="color:var(--gray-500);font-size:13px">Nothing waiting to be scheduled.</div>`}
    </div>
    ${engineers.length?`<div style="overflow-x:auto">
      <div style="display:grid;grid-template-columns:140px repeat(7,1fr);min-width:760px">
        <div></div>${dayHeaders}
      </div>
      <div style="min-width:760px">${rows}</div>
    </div>`:`<div style="color:var(--gray-500);font-size:13px">No active engineers yet — add one from the Engineers tab.</div>`}
  </div>`;
}

function fsmSchedDragStart(ev,id){FSM_SCHED.dragId=id;ev.dataTransfer.effectAllowed='move';}

async function fsmSchedDrop(ev,engineerId,isoDate){
  ev.preventDefault();
  const woId=FSM_SCHED.dragId;FSM_SCHED.dragId=null;
  if(!woId)return;
  const r=await api('PATCH','/api/fsm_tickets?resource=work_order&action=reschedule&id='+woId,{engineer_id:engineerId,visit_date:isoDate});
  if(r.error){alert(r.error);return;}
  A.fsmScheduleWO=null;loadFSMSchedule();
}

async function fsmSchedDropUnscheduled(ev){
  ev.preventDefault();
  const woId=FSM_SCHED.dragId;FSM_SCHED.dragId=null;
  if(!woId)return;
  const r=await api('PATCH','/api/fsm_tickets?resource=work_order&action=reschedule&id='+woId,{engineer_id:null,visit_date:null});
  if(r.error){alert(r.error);return;}
  A.fsmScheduleWO=null;loadFSMSchedule();
}

async function saveFsmEngineer(engineerId){

    email:document.getElementById('fsmEngEmail')?.value||'',
    phone:document.getElementById('fsmEngPhone')?.value||'',
    territory:document.getElementById('fsmEngTerritory')?.value||'',
    availability:document.getElementById('fsmEngAvailability')?.value||'available',
    skills:fsmSplitTags(document.getElementById('fsmEngSkills')?.value),
    certifications:fsmSplitTags(document.getElementById('fsmEngCerts')?.value),

async function fsmAiTriage(){
  const subject=(document.getElementById('fsmNewSubject')?.value||'').trim();
  const description=(document.getElementById('fsmNewDescription')?.value||'').trim();
  const assetSel=document.getElementById('fsmNewAsset');
  const asset_category=assetSel?.selectedOptions?.[0]?.textContent?.split('—')[1]?.trim()||'';
  const resultEl=document.getElementById('fsmAiTriageResult');
  const btn=document.getElementById('fsmAiTriageBtn');
  if(!subject&&!description){if(resultEl)resultEl.textContent='Enter a subject or description first.';return;}
  if(btn){btn.disabled=true;btn.textContent='Thinking…';}
  const r=await api('POST','/api/fsm_ai',{action:'triage',subject,description,asset_category});
  if(btn){btn.disabled=false;btn.textContent='✨ AI Suggest Type & Priority';}
  if(r.error){if(resultEl)resultEl.textContent=r.error;return;}
  if(r.ticket_type)document.getElementById('fsmNewType').value=r.ticket_type;
  if(r.priority)document.getElementById('fsmNewPriority').value=r.priority;
  A.fsmNewAiFailureCategory=r.failure_category||null;
  if(resultEl)resultEl.textContent=r.reasoning?`Suggested: ${r.reasoning}`:'Suggestion applied.';
}

async function createFSMTicket(){
  const customer_id=document.getElementById('fsmNewCustomer')?.value;
  const site_id=document.getElementById('fsmNewSite')?.value||null;
  const asset_id=document.getElementById('fsmNewAsset')?.value||null;
  const ticket_type=document.getElementById('fsmNewType')?.value;
  const priority=document.getElementById('fsmNewPriority')?.value;
  const subject=(document.getElementById('fsmNewSubject')?.value||'').trim();
  const description=(document.getElementById('fsmNewDescription')?.value||'').trim();

  if(A.fsmNewAiFailureCategory&&(ticket_type==='incident'||ticket_type==='corrective_maintenance'))body.failure_category=A.fsmNewAiFailureCategory;

async function fsmGetAssetCategory(assetId){
  if(!assetId)return '';
  A.fsmAssetCatCache=A.fsmAssetCatCache||{};
  if(A.fsmAssetCatCache[assetId]!==undefined)return A.fsmAssetCatCache[assetId];
  const cached=(A.fsmAssets||[]).find(x=>x.id===assetId);
  if(cached){A.fsmAssetCatCache[assetId]=cached.category||'';return A.fsmAssetCatCache[assetId];}
  const r=await api('GET','/api/fsm_assets?resource=asset&action=get&id='+assetId);
  const cat=(r&&!r.error&&r.category)||'';
  A.fsmAssetCatCache[assetId]=cat;
  return cat;
}

async function fsmAiTroubleshoot(ticketId){
  const t=A.fsmDetail;
  fsmAiResultBox('<div style="color:var(--gray-500);font-size:13px">Thinking…</div>');
  const asset_category=await fsmGetAssetCategory(t.asset_id);
  const r=await api('POST','/api/fsm_ai',{action:'troubleshoot',subject:t.subject,description:t.description,asset_category});
  if(r.error){fsmAiResultBox(`<div class="auth-err" style="display:block">${esc(r.error)}</div>`);return;}
  const causes=(r.likely_causes||[]).map(c=>`<li>${esc(c)}</li>`).join('');
  const steps=(r.checklist||[]).map(c=>`<li>${esc(c)}</li>`).join('');
  fsmAiResultBox(`<div style="border:1px solid var(--gray-200);border-radius:10px;padding:14px">
    <div style="font-size:12px;font-weight:700;color:var(--gray-500);margin-bottom:6px">LIKELY CAUSES${r.grounded_in_kb?' (grounded in your Knowledge Base)':''}</div>
    <ul style="margin:0 0 12px 18px;font-size:13px">${causes||'<li style="color:var(--gray-500)">None suggested.</li>'}</ul>
    <div style="font-size:12px;font-weight:700;color:var(--gray-500);margin-bottom:6px">DIAGNOSTIC CHECKLIST</div>
    <ol style="margin:0 0 0 18px;font-size:13px">${steps||'<li style="color:var(--gray-500)">None suggested.</li>'}</ol>
    ${(r.kb_sources||[]).length?`<div style="font-size:12px;color:var(--gray-500);margin-top:10px">Sources: ${r.kb_sources.map(s=>esc(s.title)).join(', ')}</div>`:''}
  </div>`);
}

async function fsmAiSimilarTickets(ticketId){
  const t=A.fsmDetail;
  fsmAiResultBox('<div style="color:var(--gray-500);font-size:13px">Searching…</div>');
  const r=await api('POST','/api/fsm_ai',{action:'similar_tickets',ticket_id:ticketId,failure_category:t.failure_category});
  if(r.error){fsmAiResultBox(`<div class="auth-err" style="display:block">${esc(r.error)}</div>`);return;}
  const matches=r.matches||[];
  if(!matches.length){fsmAiResultBox('<div style="color:var(--gray-500);font-size:13px">No similar resolved tickets found yet.</div>');return;}
  fsmAiResultBox(matches.map(m=>`<div style="border:1px solid var(--gray-200);border-radius:10px;padding:12px;margin-bottom:8px;font-size:13px">
    <strong>${esc(m.ticket_number)}</strong> — ${esc(m.subject)}
    ${m.root_cause?`<div style="color:var(--gray-500);margin-top:4px"><strong>Root cause:</strong> ${esc(m.root_cause)}</div>`:''}
    ${m.corrective_action?`<div style="color:var(--gray-500);margin-top:2px"><strong>Fixed by:</strong> ${esc(m.corrective_action)}</div>`:''}
  </div>`).join(''));
}

async function fsmAiPartsSuggest(ticketId){
  const t=A.fsmDetail;
  fsmAiResultBox('<div style="color:var(--gray-500);font-size:13px">Checking inventory…</div>');
  let asset_category='';
  if(t.asset_id){
    const a=(A.fsmAssets||[]).find(x=>x.id===t.asset_id);
    asset_category=a?.category||'';
  }
  const r=await api('POST','/api/fsm_ai',{action:'parts_suggest',description:t.description,asset_category,failure_category:t.failure_category});
  if(r.error){fsmAiResultBox(`<div class="auth-err" style="display:block">${esc(r.error)}</div>`);return;}
  const parts=r.suggested_parts||[];
  fsmAiResultBox(`<div style="font-size:13px">${parts.length?parts.map(p=>`<div style="padding:6px 0;border-bottom:1px solid var(--gray-100)"><strong>${esc(p.name)}</strong> ${p.category?`— ${esc(p.category)}`:''} <span style="color:var(--gray-500)">(${p.quantity_on_hand??0} on hand)</span></div>`).join(''):'<div style="color:var(--gray-500)">No matching parts found in inventory.</div>'}${r.reasoning?`<div style="color:var(--gray-500);margin-top:8px">${esc(r.reasoning)}</div>`:''}</div>`);

    billing_notes:document.getElementById('fsmBillingNotes')?.value||'',
  };
  const r=await api('PATCH','/api/fsm_tickets?resource=ticket&action=update_billing&id='+ticketId,body);
  if(r.error){if(errEl){errEl.textContent=r.error;errEl.style.display='block';}return;}
  A.fsmDetail=null;loadFSMDetail(ticketId);
}

function fsmWorkOrdersHTML(){
  const list=A.fsmWorkOrders;
  if(list==null)return `<div style="color:var(--gray-500);font-size:13px">Loading…</div>`;
  if(!list.length)return `<div style="color:var(--gray-500);font-size:13px">No work orders yet for this ticket.</div>`;
  const engById={};(A.fsmEngineers||[]).forEach(e=>engById[e.id]=e.name);
  return list.map(w=>{
    const done=!!w.completion_notes;
    return `<div style="border:1px solid var(--gray-200);border-radius:10px;padding:14px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
        <div>
          <strong>${w.engineer_id?esc(engById[w.engineer_id]||'Unknown engineer'):'Unassigned'}</strong>
          ${w.visit_date?` — ${esc(w.visit_date)}`:''}${w.expected_duration_mins?` (${w.expected_duration_mins} min)`:''}
        </div>
        <span class="sbadge ${done?'s-resolved':'s-sent'}">${done?'Completed':'Scheduled'}</span>
      </div>
      ${w.instructions?`<div style="font-size:13px;color:var(--gray-500);margin-top:8px">${esc(w.instructions)}</div>`:''}
      ${w.materials_required?`<div style="font-size:12px;color:var(--gray-500);margin-top:4px">Materials: ${esc(w.materials_required)}</div>`:''}
      ${w.tools_required?`<div style="font-size:12px;color:var(--gray-500);margin-top:4px">Tools: ${esc(w.tools_required)}</div>`:''}
      ${(w.checklist||[]).length?`<ul style="margin:8px 0 0 18px;font-size:13px;color:var(--gray-700)">${(w.checklist||[]).map(c=>`<li>${esc(typeof c==='string'?c:c.text||'')}</li>`).join('')}</ul>`:''}
      ${done?`<div style="font-size:13px;margin-top:10px;padding-top:10px;border-top:1px solid var(--gray-100)"><strong>Completion notes:</strong> ${esc(w.completion_notes)}</div>`
        :`<button class="btn btn-sm" style="margin-top:10px" onclick="showFsmCompleteWorkOrderModal('${w.id}')">Mark Complete</button>`}
    </div>`;
  }).join('');
}

function fsmEngineerPickerHTML(t){
  const engineers=A.fsmEngineers;
  if(engineers==null)return `<div style="color:var(--gray-500);font-size:13px">Loading engineers…</div>`;
  const current=t.assigned_engineer_id;
  const opts=engineers.map(e=>`<option value="${e.id}" ${e.id===current?'selected':''}>${esc(e.name)}${e.territory?` (${esc(e.territory)})`:''}</option>`).join('');
  return `<select id="fsmEngineerSelect" class="iinput" style="width:auto">
      <option value="">— Unassigned —</option>
      ${opts}
    </select>
    <button class="btn btn-navy" onclick="assignFSMEngineer('${t.id}')">Assign</button>
    ${engineers.length?`<button class="btn btn-sm" onclick="fsmAiAssignSuggest('${t.id}')">✨ AI Suggest</button>`:''}
    ${!engineers.length?`<p style="font-size:12px;color:var(--gray-500);margin-top:6px">No engineers yet — add one from the Engineers tab.</p>`:''}
    <div id="fsmAiAssignResult" style="margin-top:8px"></div>`;
}

async function fsmAiAssignSuggest(ticketId){
  const el=document.getElementById('fsmAiAssignResult');
  if(el)el.innerHTML='<div style="color:var(--gray-500);font-size:13px">Scoring engineers…</div>';
  const r=await api('POST','/api/fsm_ai',{action:'assign_suggest',ticket_id:ticketId});
  if(!el)return;
  if(r.error){el.innerHTML=`<div class="auth-err" style="display:block">${esc(r.error)}</div>`;return;}
  const suggestions=r.suggestions||[];
  if(!suggestions.length){el.innerHTML='<div style="color:var(--gray-500);font-size:13px">No active engineers to suggest.</div>';return;}
  el.innerHTML=suggestions.map((s,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--gray-100);font-size:13px">
    <div><strong>${i===0?'★ ':''}${esc(s.name)}</strong><div style="color:var(--gray-500);font-size:12px">${s.reasons.map(r=>esc(r)).join(', ')}</div></div>
    <button class="btn btn-sm" onclick="document.getElementById('fsmEngineerSelect').value='${s.id}'">Pick</button>
  </div>`).join('');
}

async function assignFSMEngineer(ticketId){
  const engineerId=document.getElementById('fsmEngineerSelect')?.value;
  if(!engineerId){alert('Pick an engineer first.');return;}
  const r=await api('PATCH','/api/fsm_tickets?resource=ticket&action=assign&id='+ticketId,{engineer_id:engineerId});
  if(r.error){alert(r.error);return;}
  A.fsmDetail=null;loadFSMDetail(ticketId);
}

async function loadFSMDetail(id){
  const [t,act,wo]=await Promise.all([
    api('GET','/api/fsm_tickets?resource=ticket&action=get&id='+id),
    api('GET','/api/fsm_tickets?resource=activity&action=list&ticket_id='+id),
    api('GET','/api/fsm_tickets?resource=work_order&action=list&ticket_id='+id)
  ]);
  if(t.error){alert(t.error);A.page='fsm';draw();return;}
  A.fsmDetail=t;A.fsmActivity=Array.isArray(act)?act:[];A.fsmWorkOrders=Array.isArray(wo)?wo:[];draw();
  if(A.fsmEngineers==null)loadFSMEngineers();
}

function showFsmWorkOrderModal(ticketId){
  const engineers=A.fsmEngineers||[];
  document.body.insertAdjacentHTML('beforeend',`<div class="modal-overlay" id="fsmWoModalOverlay" onclick="if(event.target===this)closeFsmWorkOrderModal()">
    <div class="modal" style="max-width:520px;max-height:88vh;overflow-y:auto">
      <div class="modal-title">New Work Order</div>
      <div id="fsmWoError" class="auth-err" style="display:none"></div>
      <div class="fld"><label>Engineer</label>
        <select id="fsmWoEngineer" class="iinput">
          <option value="">— Unassigned —</option>
          ${engineers.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field-grid g2">
        <div class="fld"><label>Visit Date</label><input id="fsmWoDate" type="date" class="iinput"></div>
        <div class="fld"><label>Expected Duration (mins)</label><input id="fsmWoDuration" type="number" class="iinput" placeholder="60"></div>
      </div>
      <div class="fld"><label>Materials Required</label><input id="fsmWoMaterials" class="iinput" placeholder="e.g. HDMI cable, mounting bracket"></div>
      <div class="fld"><label>Tools Required</label><input id="fsmWoTools" class="iinput" placeholder="e.g. crimping tool, multimeter"></div>
      <div class="fld"><label>Instructions</label><textarea id="fsmWoInstructions" class="iinput" rows="3"></textarea></div>
      <div class="fld"><label>Checklist</label><textarea id="fsmWoChecklist" class="iinput" rows="3" placeholder="One item per line, e.g.&#10;Verify signal at LED wall input&#10;Check DSP gain staging&#10;Test audio-follow-video sync"></textarea></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeFsmWorkOrderModal()">Cancel</button>
        <button class="btn btn-navy" onclick="saveFsmWorkOrder('${ticketId}')">Create Work Order</button>
      </div>
    </div>
  </div>`);
}
function closeFsmWorkOrderModal(){const el=document.getElementById('fsmWoModalOverlay');if(el)el.remove();}

async function saveFsmWorkOrder(ticketId){
  const errEl=document.getElementById('fsmWoError');
  const checklist=(document.getElementById('fsmWoChecklist')?.value||'').split('\n').map(s=>s.trim()).filter(Boolean).map(text=>({text,done:false}));
  const body={
    ticket_id:ticketId,
    engineer_id:document.getElementById('fsmWoEngineer')?.value||null,
    visit_date:document.getElementById('fsmWoDate')?.value||null,
    expected_duration_mins:Number(document.getElementById('fsmWoDuration')?.value)||null,
    materials_required:document.getElementById('fsmWoMaterials')?.value||'',
    tools_required:document.getElementById('fsmWoTools')?.value||'',
    instructions:document.getElementById('fsmWoInstructions')?.value||'',
    checklist,
  };
  const r=await api('POST','/api/fsm_tickets?resource=work_order&action=create',body);
  if(r.error){if(errEl){errEl.textContent=r.error;errEl.style.display='block';}return;}
  closeFsmWorkOrderModal();
  loadFSMDetail(ticketId);
}

function showFsmCompleteWorkOrderModal(woId){
  document.body.insertAdjacentHTML('beforeend',`<div class="modal-overlay" id="fsmWoCompleteOverlay" onclick="if(event.target===this)closeFsmCompleteWorkOrderModal()">
    <div class="modal" style="max-width:480px">
      <div class="modal-title">Complete Work Order</div>
      <div class="fld"><label>Completion Notes</label><textarea id="fsmWoCompletionNotes" class="iinput" rows="4" placeholder="What was done, findings, follow-up needed…"></textarea></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeFsmCompleteWorkOrderModal()">Cancel</button>
        <button class="btn btn-navy" onclick="completeFsmWorkOrder('${woId}')">Mark Complete</button>
      </div>
    </div>
  </div>`);
}
function closeFsmCompleteWorkOrderModal(){const el=document.getElementById('fsmWoCompleteOverlay');if(el)el.remove();}

async function completeFsmWorkOrder(woId){
  const notes=(document.getElementById('fsmWoCompletionNotes')?.value||'').trim();
  if(!notes){alert('Add completion notes first.');return;}
  const r=await api('PATCH','/api/fsm_tickets?resource=work_order&action=complete&id='+woId,{completion_notes:notes});
  if(r.error){alert(r.error);return;}
  closeFsmCompleteWorkOrderModal();
  loadFSMDetail(A.fsmDetailId);
}

async function updateFSMStatus(id){
  const status=document.getElementById('fsmStatusSelect')?.value;
  const r=await api('PATCH','/api/fsm_tickets?resource=ticket&action=update_status&id='+id,{status});
  if(r.error){alert(r.error);return;}
  A.fsmDetail=null;loadFSMDetail(id);
}
// ── end FSM ───────────────────────────────────────────────────
(function boot(){
  const params=new URLSearchParams(window.location.search);
  const inviteToken=params.get('invite');
  const resetToken=params.get('reset');
  const feedbackToken=params.get('feedback');if(feedbackToken){A.screen='feedbackForm';FB.token=feedbackToken;draw();loadFeedbackDetails();}else if(inviteToken){
    A.screen='acceptInvite';INV.token=inviteToken;draw();loadInviteDetails();
  }else if(resetToken){
    A.screen='resetPassword';RST.token=resetToken;draw();
  }else{
    checkAuth();
  }
})();
</script>
</body>
</html>
