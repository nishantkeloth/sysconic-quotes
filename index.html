// ── Draw ──────────────────────────────────────────────────────────────────────
// The item grid can be wider than the screen (Vendor/Model/Brand/pricing
// columns), scrollable via the native horizontal scrollbar — but on many
// Windows laptops, a plain mouse wheel or trackpad only produces vertical
// scroll deltas with no easy horizontal gesture, so the table can look
// "stuck" even though the scrollbar works fine with a direct drag. This
// redirects ordinary vertical scroll input into horizontal movement while
// hovering the table, and steps out of the way at either edge so normal
// page scrolling still works once the table can't scroll further that way.
function gridWheelScroll(e,el){
  if(el.scrollWidth<=el.clientWidth)return;
  const goingRight=e.deltaY>0;
  const atRightEdge=el.scrollLeft+el.clientWidth>=el.scrollWidth-1;
  const atLeftEdge=el.scrollLeft<=0;
  if((goingRight&&atRightEdge)||(!goingRight&&atLeftEdge))return;
  e.preventDefault();
  el.scrollLeft+=e.deltaY;
}
function draw(){
  document.getElementById('app').innerHTML='';
  if(A.screen==='login'||A.screen==='register'){document.getElementById('app').innerHTML=authHTML();return;}
  if(A.screen==='feedbackForm'){document.getElementById('app').innerHTML=feedbackFormHTML();return;}if(A.screen==='acceptInvite'){document.getElementById('app').innerHTML=acceptInviteHTML();return;}
  if(A.screen==='forgotPassword'){document.getElementById('app').innerHTML=forgotPasswordHTML();return;}
  if(A.screen==='resetPassword'){document.getElementById('app').innerHTML=resetPasswordHTML();return;}
  const PAGE_KEY_MAP={dashboard:'quotes',deals:'deals',products:'products',customers:'customers',vendorMaster:'vendors',projects:'projects',projectPerformance:'projectPerformance',projectPerformanceDetail:'projectPerformance',reviewQueue:'reviewQueue',testimonials:'testimonials'};
  if(PAGE_KEY_MAP[A.page]&&!hasPageAccess(PAGE_KEY_MAP[A.page])){
    const fallbackOrder=['dashboard','deals','products','customers','vendorMaster','projects','projectPerformance','reviewQueue','testimonials'];
    A.page=fallbackOrder.find(p=>hasPageAccess(PAGE_KEY_MAP[p]))||'dashboard';
  }
  document.getElementById('app').innerHTML=appHTML();
  setTimeout(initTA,30);
  if(A.page==='team'){setTimeout(loadTeam,50);}
  if(A.page==='integrations'){setTimeout(loadIntegrations,50);setTimeout(loadSyncConfig,50);}
  if(A.page==='platform'){setTimeout(loadPlatformCompanies,50);}
  if(A.page==='companyProfile'){setTimeout(loadCompanyProfile,50);setTimeout(loadQuoteNumbering,50);}
  if(A.page==='rolesPermissions'){setTimeout(loadRolesPermissions,50);}
  if(A.page==='print'){ensurePrintCompany();}
  if(A.page==='deals')setTimeout(loadDealsPage,50);
  if(A.page==='products')setTimeout(loadProducts,50);
  if(A.page==='customers')setTimeout(loadCustomersPage,50);
  if(A.page==='projects'&&A.projects==null)setTimeout(loadProjectsPage,50);
  if(A.page==='fsm'&&A.fsmTickets==null)setTimeout(loadFSMPage,50);
  if(A.page==='fsmDetail'&&A.fsmDetail==null)setTimeout(function(){loadFSMDetail(A.fsmDetailId);},50);
  if(A.page==='projectPerformance'&&A.portfolio==null)setTimeout(loadPortfolioPage,50);
  if(A.page==='projectPerformanceDetail'&&A.ppDetail==null)setTimeout(loadProjectPerformanceDetail,50);
  if(A.page==='vendorMaster')setTimeout(loadVendorsMaster,50);
  if(A.page==='reviewQueue')setTimeout(loadReviewQueue,50);
  if(A.page==='testimonials')setTimeout(loadTestimonials,50);
  if(A.page==='log')setTimeout(loadLog,50);
}

// ── Auth HTML ─────────────────────────────────────────────────────────────────
function authHTML(){
  const isReg=A.screen==='register';
  return`<div class="auth-shell"><div class="auth-card">
    <img src="${QTCAL_LOGO_SRC}" class="auth-logo" alt="QTcal AI">
    <div class="auth-sub">Quote Manager v1.0.1 · SaaS Platform</div>
    <div class="auth-title">${isReg?'Create your account':'Welcome back'}</div>
    <div class="auth-desc">${isReg?'Set up your workspace in seconds':'Sign in to continue'}</div>
    <div id="${isReg?'regErr':'loginErr'}" class="auth-err" style="display:none"></div>
    <form onsubmit="${isReg?'doRegister':'doLogin'}(event)">
      ${isReg?`<div class="field-grid g2" style="margin-bottom:14px">
        <div class="fld"><label>Your name</label><input id="rName" required placeholder="Nishant"></div>
        <div class="fld"><label>Company</label><input id="rCo" required placeholder="Sysconic Technologies"></div>
      </div>
      <div class="fld"><label>Work email</label><input id="rEmail" type="email" required placeholder="you@company.com"></div>
      <div class="fld"><label>Password</label><input id="rPass" type="password" required placeholder="Min 8 characters"></div>`
      :`<div class="fld"><label>Email address</label><input id="lEmail" type="email" required placeholder="you@company.com"></div>
      <div class="fld"><label>Password</label><input id="lPass" type="password" required placeholder="••••••••"></div>`}
      <button class="auth-btn" type="submit">${isReg?'Create account →':'Sign in →'}</button>
    </form>
    ${!isReg?`<div class="auth-link"><a onclick="A.screen='forgotPassword';draw()">Forgot password?</a></div>`:''}
  </div></div>`;
}

// ── Accept invite (arrived via ?invite=TOKEN) ────────────────────────────────
async function loadInviteDetails(){
  INV.loading=true;INV.error='';draw();
  const r=await api('GET','/api/auth/invite-details?token='+encodeURIComponent(INV.token));
  INV.loading=false;
  if(r.error){INV.error=r.error;}
  else{INV.email=r.email;INV.role=r.role;INV.company_name=r.company_name;}
  draw();
}
async function submitAcceptInvite(e){
  e.preventDefault();
  if(INV.busy)return;
  const err=document.getElementById('invErr');if(err)err.style.display='none';
  const name=document.getElementById('invName').value;
  const password=document.getElementById('invPass').value;
  const confirm=document.getElementById('invPass2').value;
  if(password!==confirm){if(err){err.textContent='Passwords do not match';err.style.display='block';}return;}
  INV.busy=true;const btn=document.getElementById('invBtn');if(btn){btn.disabled=true;btn.textContent='Joining…';}
  const r=await api('POST','/api/auth/accept-invite',{token:INV.token,name,password});
  INV.busy=false;if(btn){btn.disabled=false;btn.textContent='Join workspace →';}
  if(r.error){if(err){err.textContent=r.error;err.style.display='block';}return;}
  setAuth(r);
  history.replaceState(null,'',window.location.pathname);
  await loadQuotes();A.page='dashboard';draw();
}
function acceptInviteHTML(){
  if(INV.loading)return`<div class="auth-shell"><div class="auth-card"><div class="auth-desc">Loading invite…</div></div></div>`;
  if(INV.error)return`<div class="auth-shell"><div class="auth-card">
    <div class="auth-title">Invite not valid</div>
    <div class="auth-err" style="display:block">${esc(INV.error)}</div>
    <div class="auth-link"><a onclick="history.replaceState(null,'',window.location.pathname);A.screen='login';draw()">Go to sign in</a></div>
  </div></div>`;
  return`<div class="auth-shell"><div class="auth-card">
    <img src="${QTCAL_LOGO_SRC}" class="auth-logo" alt="QTcal AI">
    <div class="auth-title">Join ${esc(INV.company_name)}</div>

// ── Forgot password ───────────────────────────────────────────────────────────
async function submitForgotPassword(e){
  e.preventDefault();
  if(RST.busy)return;
  RST.busy=true;const btn=document.getElementById('fpBtn');if(btn){btn.disabled=true;btn.textContent='Sending…';}
  const email=document.getElementById('fpEmail').value;
  let r;
  try{r=await api('POST','/api/auth/forgot-password',{email});}
  catch(err){RST.busy=false;if(btn){btn.disabled=false;btn.textContent='Send reset link →';}alert('Could not reach the server. Please try again.');return;}
  RST.busy=false;if(btn){btn.disabled=false;btn.textContent='Send reset link →';}
  if(r.error){alert('❌ '+r.error);return;}
  RST.done=true;draw();
}
function forgotPasswordHTML(){
  if(RST.done)return`<div class="auth-shell"><div class="auth-card">
    <div class="auth-title">Check your email</div>
    <div class="auth-desc">If that email is registered, we've sent a link to reset your password. It expires in 1 hour.</div>
    <div class="auth-link"><a onclick="RST.done=false;A.screen='login';draw()">Back to sign in</a></div>
  </div></div>`;
  return`<div class="auth-shell"><div class="auth-card">
    <img src="${QTCAL_LOGO_SRC}" class="auth-logo" alt="QTcal AI">
    <div class="auth-title">Forgot your password?</div>
    <div class="auth-desc">Enter your email and we'll send you a reset link</div>
    <form onsubmit="submitForgotPassword(event)">
      <div class="fld"><label>Email address</label><input id="fpEmail" type="email" required placeholder="you@company.com"></div>
      <button class="auth-btn" type="submit" id="fpBtn">Send reset link →</button>
    </form>
    <div class="auth-link"><a onclick="A.screen='login';draw()">Back to sign in</a></div>
  </div></div>`;
}

// ── Reset password (arrived via ?reset=TOKEN) ────────────────────────────────
async function submitResetPassword(e){
  e.preventDefault();
  if(RST.busy)return;
  const err=document.getElementById('rpErr');if(err)err.style.display='none';
  const password=document.getElementById('rpPass').value;
  const confirm=document.getElementById('rpPass2').value;
  if(password!==confirm){if(err){err.textContent='Passwords do not match';err.style.display='block';}return;}
  RST.busy=true;const btn=document.getElementById('rpBtn');if(btn){btn.disabled=true;btn.textContent='Updating…';}
  const r=await api('POST','/api/auth/reset-password',{token:RST.token,password});
  RST.busy=false;if(btn){btn.disabled=false;btn.textContent='Update password →';}
  if(r.error){if(err){err.textContent=r.error;err.style.display='block';}return;}
  RST.done=true;
  history.replaceState(null,'',window.location.pathname);
  draw();
}
function resetPasswordHTML(){
  if(RST.done)return`<div class="auth-shell"><div class="auth-card">
    <div class="auth-title">Password updated</div>
    <div class="auth-desc">You can now sign in with your new password.</div>
    <div class="auth-link"><a onclick="A.screen='login';draw()">Go to sign in</a></div>
  </div></div>`;
  return`<div class="auth-shell"><div class="auth-card">
    <img src="${QTCAL_LOGO_SRC}" class="auth-logo" alt="QTcal AI">
    <div class="auth-title">Set a new password</div>
    <div id="rpErr" class="auth-err" style="display:none"></div>
    <form onsubmit="submitResetPassword(event)">
      <div class="fld"><label>New password</label><input id="rpPass" type="password" required minlength="8" placeholder="Min 8 characters"></div>
      <div class="fld"><label>Confirm password</label><input id="rpPass2" type="password" required minlength="8" placeholder="Re-enter password"></div>
      <button class="auth-btn" type="submit" id="rpBtn">Update password →</button>
    </form>
  </div></div>`;
}

function appHTML(){
  const init=(A.user?.name||'U').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  const PAGE_TITLES={dashboard:'Dashboard',deals:'Deals',editor:'Quotation',terms:'Terms & Conditions',summary:'Summary',vendor:'Vendor Payments',print:'Print / PDF',log:'Activity Log',team:'Team & Settings',products:'Product Catalog',customers:'Customer Master',vendorMaster:'Vendor Master',integrations:'Integrations',platform:'All Companies',companyProfile:'Company Profile',rolesPermissions:'Roles & Permissions',reviewQueue:'Review Queue',testimonials:'Testimonials',projectPerformance:'Project Performance',projectPerformanceDetail:'Project Detail'};
  const inEditor=['editor','terms','summary','vendor','print','log'].includes(A.page);

  const nav=(page,cb)=>`A.page='${page}';${cb||''}closeSidebar();draw()`;
  const sidebar=`<div class="sidebar${A.sbOpen?' open':''}${A.sbCollapsed?' collapsed':''}">
    <div class="sb-brand">
      <img src="${LOGO_SRC}" class="sb-logo" alt="Sysconic">
      <div><div class="sb-co">${esc(A.company?.name||'')}</div></div>
    </div>
    <nav class="sb-nav">
      ${A.user?.is_platform_admin?'':`
      <div class="sb-sec">Workspace</div>
      ${hasPageAccess('quotes')?`<div class="sb-item ${A.page==='dashboard'?'active':''}" onclick="${nav('dashboard')}"><span class="sb-icon">🏠</span>Quotes</div>`:''}
      ${hasPageAccess('deals')?`<div class="sb-item ${A.page==='deals'?'active':''}" onclick="${nav('deals')}"><span class="sb-icon">🤝</span>Deals</div>`:''}
      ${hasPageAccess('products')?`<div class="sb-item ${A.page==='products'?'active':''}" onclick="${nav('products')}"><span class="sb-icon">📦</span>Products</div>`:''}
      ${hasPageAccess('customers')?`<div class="sb-item ${A.page==='customers'?'active':''}" onclick="${nav('customers')}"><span class="sb-icon">👤</span>Customers</div>`:''}
      ${hasPageAccess('vendors')?`<div class="sb-item ${A.page==='vendorMaster'?'active':''}" onclick="${nav('vendorMaster')}"><span class="sb-icon">🏭</span>Vendors</div>`:''}
      ${hasFeature('projects')&&hasPageAccess('projects')?`<div class="sb-item ${A.page==='projects'?'active':''}" onclick="${nav('projects')}"><span class="sb-icon">📁</span>Projects</div>`:''}
      ${hasFeature('fsm_module')&&hasPageAccess('fsm')?`<div class="sb-item ${(A.page==='fsm'||A.page==='fsmDetail')?'active':''}" onclick="${nav('fsm')}"><span class="sb-icon">🔧</span>Field Service</div>`:''}
      ${hasFeature('project_performance')&&hasPageAccess('projectPerformance')?`<div class="sb-item ${(A.page==='projectPerformance'||A.page==='projectPerformanceDetail')?'active':''}" onclick="${nav('projectPerformance')}"><span class="sb-icon">📊</span>Project Performance</div>`:''}
      ${hasPageAccess('reviewQueue')?`<div class="sb-item ${A.page==='reviewQueue'?'active':''}" onclick="${nav('reviewQueue')}"><span class="sb-icon">📝</span>Review Queue${A.reviewQueueCount?` <span class="sb-badge">${A.reviewQueueCount}</span>`:''}</div>`:''}       ${hasFeature('testimonials')&&hasPageAccess('testimonials')?`<div class="sb-item ${A.page==='testimonials'?'active':''}" onclick="${nav('testimonials')}"><span class="sb-icon">⭐</span>Testimonials</div>`:''}       ${A.activeQuote?`<div class="sb-item ${inEditor&&A.page!=='team'?'active':''}" onclick="${nav('editor')}"><span class="sb-icon">📄</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(A.activeQuote.title||'Quote')}</span></div>`:''}`}       ${(A.user?.role==='admin'&&!A.user?.is_platform_admin)?`<div class="sb-sec">Settings</div>
      <div class="sb-item ${A.page==='team'?'active':''}" onclick="${nav('team')}"><span class="sb-icon">👥</span>Team</div>
      <div class="sb-item ${A.page==='integrations'?'active':''}" onclick="${nav('integrations')}"><span class="sb-icon">🔌</span>Integrations</div>
      <div class="sb-item ${A.page==='companyProfile'?'active':''}" onclick="${nav('companyProfile')}"><span class="sb-icon">🏢</span>Company Profile</div>
      <div class="sb-item ${A.page==='rolesPermissions'?'active':''}" onclick="${nav('rolesPermissions')}"><span class="sb-icon">🔐</span>Roles & Permissions</div>`:''}
      ${A.user?.is_platform_admin?`<div class="sb-sec">Platform</div><div class="sb-item ${A.page==='platform'?'active':''}" onclick="${nav('platform')}"><span class="sb-icon">🌐</span>All Companies</div>`:''}
    </nav>
    <div class="sb-foot">
      <div class="sb-user">
        <div class="sb-avatar">${init}</div>
        <div><div class="sb-uname">${esc(A.user?.name||'')}</div><div class="sb-urole">${A.user?.role||''}</div></div>
      </div>
      <button class="sb-logout" onclick="doLogout()">Sign out</button>
      <div class="sb-poweredby">Powered by <span class="sb-poweredby-name">QTcal AI</span></div>
      <div id="saveStatus"></div>
    </div>
  </div>`;
  const sbOverlay=`<div class="sb-overlay${A.sbOpen?' open':''}" onclick="closeSidebar()"></div>`;

  const topbarRight=buildTopbarRight();
  const cstrip=(inEditor&&!A.reviewMode)?buildCstrip():'';

  let pageContent='';
  if(A.page==='dashboard')pageContent=dashHTML();
  else if(A.page==='editor')pageContent=editorHTML();
  else if(A.page==='terms')pageContent=termsHTML();
  else if(A.page==='summary')pageContent=summaryHTML();
  else if(A.page==='vendor')pageContent=vendorHTML();
  else if(A.page==='print')pageContent=printHTML();
  else if(A.page==='log')pageContent=logHTML();
  else if(A.page==='deals')pageContent=dealsHTML();
  else if(A.page==='products')pageContent=productsHTML();
  else if(A.page==='customers')pageContent=customersHTML();
  else if(A.page==='projects')pageContent=projectsHTML();
  else if(A.page==='fsm')pageContent=fsmHTML();
  else if(A.page==='fsmDetail')pageContent=fsmDetailHTML();
  else if(A.page==='projectPerformance')pageContent=portfolioHTML();
  else if(A.page==='projectPerformanceDetail')pageContent=projectPerformanceDetailHTML();
  else if(A.page==='vendorMaster')pageContent=vendorsMasterHTML();
  else if(A.page==='team')pageContent=teamHTML();
  else if(A.page==='integrations')pageContent=integrationsHTML();
  else if(A.page==='platform')pageContent=platformHTML();
  else if(A.page==='companyProfile')pageContent=companyProfileHTML();
  else if(A.page==='rolesPermissions')pageContent=rolesPermissionsHTML();
  else if(A.page==='reviewQueue')pageContent=reviewQueueHTML();
  else if(A.page==='testimonials')pageContent=testimonialsHTML();

  if(['editor','terms','vendor'].includes(A.page)&&isQuoteLocked()&&!A.reviewMode){
    pageContent=`<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:14px 18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div><div style="font-weight:700;color:#9a3412">🔒 This quote is locked (status: ${esc(STATUS_LABELS[A.activeQuote.status]||A.activeQuote.status)})</div>
      <div style="font-size:13px;color:#9a3412">Set the status back to Draft to make changes.</div></div>
      <button class="btn btn-navy" onclick="unlockForEditing()">Unlock — set to Draft</button>
    </div><div style="pointer-events:none;opacity:.55;user-select:none">${pageContent}</div>`;
  }

  return`<div class="shell">${sidebar}${sbOverlay}${helpFabHTML()}${helpDrawerHTML()}<div class="main">
    <div class="topbar"><div style="display:flex;align-items:center;gap:6px;min-width:0"><button class="sb-toggle" onclick="toggleSidebarBtn()" aria-label="${A.sbCollapsed?'Show sidebar':'Hide sidebar'}" title="${A.sbCollapsed?'Show sidebar':'Hide sidebar'}">☰</button><div class="topbar-title">${PAGE_TITLES[A.page]||''}</div></div><div class="topbar-right">${topbarRight}</div></div>
    ${cstrip}
    <div class="content">${pageContent}</div>
  </div></div>`;
}

function buildTopbarRight(){
  if(A.page==='dashboard')return`<button class="btn btn-navy" onclick="newQuote()">+ New quote</button>`;
  if(A.page==='editor')return`
    <div class="vtoggle">
      <button class="vtbtn ${A.view==='internal'?'active':''}" onclick="A.view='internal';draw()">Internal</button>
      <button class="vtbtn ${A.view==='client'?'active':''}" onclick="A.view='client';draw()">Client</button>
    </div>
    <button class="btn" onclick="A.page='dashboard';draw()">← Back</button>
    <span class="tb-sep"></span>
    ${!isQuoteLocked()?`<button class="btn btn-navy" onclick="saveQuote()">💾 Save</button>`:`<button class="btn btn-navy" onclick="unlockForEditing()">🔓 Unlock to edit</button>`}
    ${!isQuoteLocked()?`<button class="btn" onclick="submitForReview()" title="Snapshot this quote and send it for internal approval before it goes to the customer">📤 Send to Review</button>`:''}
    <button class="btn" onclick="openProposalModal()" title="Generate a technical/commercial proposal document from this quote using AI">📑 Generate Proposal</button>
    ${reviewStatusBadgeHTML()}
    <span class="tb-sep"></span>
    <button class="btn" onclick="reviewQuote()">🔍 AI Review</button>
    ${!isQuoteLocked()?`<button class="btn" onclick="openBomModal()" title="Generate a bill of materials from a project description using AI">✨ Auto-BOM</button>`:''}
    ${hasFeature('diagrams')?`<button class="btn" onclick="openDiagramModal()" title="Generate a system schematic (signal flow diagram) from this option's BOM using AI">🗺 AI Diagram</button>`:''}
    <button class="btn" onclick="openPriceCheckModal()" title="Sum cost x qty by vendor per option, to cross-check against distributor pricing">Price Check</button>
    <span class="tb-sep"></span>
    <button class="btn" onclick="downloadTemplate()" title="Download Excel template">📄 Template</button>
    ${!isQuoteLocked()?`<label class="btn" style="cursor:pointer" title="Import from Excel">📥 Import Excel<input type="file" accept=".xlsx,.xls" style="display:none" onchange="importExcel(event)"></label>`:''}
    <button class="btn" onclick="A.page='print';draw()" title="Open the print view">🖨 Print</button>
    <div class="more-wrap" id="moreMenuWrap">
      <button class="btn" onclick="toggleMoreMenu(event)">⋯ More</button>
      <div class="more-panel" id="moreMenuPanel">
        <button onclick="closeMoreMenu();showVersionHistoryModal()" title="View past review submissions">📜 History</button>
        <button onclick="closeMoreMenu();showCompareModal()" title="Compare any two saved versions (review submissions or customer sends)">🔍 Compare</button>
        <button onclick="toggleImgOn()" title="Toggle product images & catalog assist for this quote">🖼 Images ${imgOn()?'ON':'OFF'}</button>
        <div class="mp-divider"></div>
        <button onclick="duplicateCurrentQuote()" title="Create an editable copy of this quote">⧉ Duplicate quote</button>
        <button onclick="closeMoreMenu();downloadPDF()" title="Export this quote as a PDF">⬇ Export PDF</button>
      </div>
    </div>`;
  if(A.page==='products')return`
    <button class="btn" onclick="downloadProdTemplate()">⬇ Template</button>
    <label class="btn" style="cursor:pointer" title="Import products from Excel">📥 Import Excel<input type="file" accept=".xlsx,.xls" style="display:none" onchange="importProducts(event)"></label>
    <button class="btn btn-navy" onclick="showProdModal()">+ Add product</button>`;
  if(A.page==='customers')return`
    ${A.user?.role==='admin'?`<button class="btn" onclick="syncIntegrationCustomers()" id="syncCustBtn" title="Pull contacts from your configured integration (Settings → Integrations)">🔄 Sync</button>`:''}
    <button class="btn" onclick="downloadCustTemplate()">⬇ Template</button>
    <label class="btn" style="cursor:pointer" title="Import customers from Excel">📥 Import Excel<input type="file" accept=".xlsx,.xls" style="display:none" onchange="importCustomers(event)"></label>
    <button class="btn btn-navy" onclick="showCustModal()">+ Add customer</button>`;
  if(A.page==='vendorMaster')return`
    ${A.user?.role==='admin'?`<button class="btn" onclick="syncIntegrationVendors()" id="syncVendBtn" title="Pull contacts from your configured integration (Settings → Integrations)">🔄 Sync</button>`:''}
    <button class="btn" onclick="downloadVendTemplate()">⬇ Template</button>
    <label class="btn" style="cursor:pointer" title="Import vendors from Excel">📥 Import Excel<input type="file" accept=".xlsx,.xls" style="display:none" onchange="importVendorsMaster(event)"></label>
    <button class="btn btn-navy" onclick="showVendModal()">+ Add vendor</button>`;
  if(A.page==='print')return`
    ${!A.reviewMode?`<button class="btn btn-navy" onclick="downloadPDF()" title="Download this quotation as a PDF file">⬇ PDF</button>`:''}
    <select id="pSel" onchange="draw()" style="padding:6px 12px;font-size:14px;border:1.5px solid var(--gray-200);border-radius:var(--radius)">
      ${(()=>{const w=printWhich();return (A.activeQuote?.quote_data||[]).map((o,i)=>`<option value="${i}" ${w===String(i)?'selected':''}>${esc(o.label)}</option>`).join('')+`<option value="all" ${w==='all'?'selected':''}>All options</option>`;})()}
    </select>
    ${A.reviewMode?`
    <span style="background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px">🔍 Reviewing v${A.reviewMode.vnum} — read only</span>
    <button class="btn btn-navy" onclick="showReviewDecisionModal('${A.reviewMode.qid}','${A.reviewMode.vid}',${A.reviewMode.vnum})">✅ Review Decision</button>
    <button class="btn" onclick="exitReviewMode()">✕ Exit Review</button>`:`
    <button class="btn btn-navy" onclick="showEmailQuoteModal()" title="Email this quote to the customer from your own mailbox">✉️ Email to Customer</button>
    <button class="btn btn-navy print-controls" onclick="window.print()">🖨️ Print / PDF</button>`}`;
  if(A.page==='team')return A.user?.role==='admin'?`<button class="btn btn-navy" onclick="showInviteModal()">+ Invite member</button>`:'';
  if(A.page==='platform')return A.user?.is_platform_admin?`<button class="btn btn-navy" onclick="showAddCompanyModal()">+ Onboard company</button>`:'';
  return'';
}

function buildCstrip(){
  const o=opt();
  const locked=isQuoteLocked();
  return`<div class="cstrip">
    <span class="cstrip-label">Currency</span>
    <select ${locked?'disabled title="Locked — unlock the quote to change"':''} onchange="A.cur=this.value;A.rate=RATES[this.value]||1;schedSave();draw()">
      ${['AED','USD','EUR','GBP','SAR','QAR'].map(c=>`<option value="${c}" ${A.cur===c?'selected':''}>${c}</option>`).join('')}
    </select>
    <span style="color:var(--gray-300)">|</span>
    <span class="cstrip-label">Rate to AED</span>
    <input type="number" ${locked?'disabled title="Locked — unlock the quote to change"':''} value="${A.rate}" step="0.01" onchange="A.rate=+this.value;schedSave()">
    ${A.activeQuote?`<span style="color:var(--gray-300)">|</span>
    <span class="cstrip-label">Status</span>
    <select onchange="changeQuoteStatus(this.value)">
      ${['draft','sent','awarded','lost'].map(s=>`<option value="${s}" ${A.activeQuote.status===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join('')}
    </select>
    ${hasFeature('project_performance')&&A.activeQuote.status==='awarded'?ppCreateProjectBtnHTML():''}
    <span style="color:var(--gray-300)">|</span>
    <span class="cstrip-label" title="How each item's percentage is applied. Markup = Cost × (1+%). Margin = Cost ÷ (1-%), i.e. % of the selling price. Changing this recalculates every item's price immediately using its existing % — the % values themselves are not changed.">Pricing</span>
    <select ${locked?'disabled title="Locked — unlock the quote to change"':''} onchange="A.activeQuote.pricing_type=this.value;schedSave();draw()">
      <option value="markup" ${(A.activeQuote.pricing_type||'markup')==='markup'?'selected':''}>Markup</option>
      <option value="margin" ${A.activeQuote.pricing_type==='margin'?'selected':''}>Margin</option>
    </select>`:''}
    <span style="color:var(--gray-300)">|</span>
    <div class="tab-btns">
      ${['editor','terms','summary','vendor','print','log'].map(p=>`<button class="tab-btn ${A.page===p?'active':''}" onclick="A.page='${p}';draw()">${{editor:'Quote',terms:'Terms',summary:'Summary',vendor:'Vendors',print:'Print',log:'Log'}[p]}</button>`).join('')}
    </div>
  </div>`;
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function dashHTML(){
  const qs=A.quotes;
  const awarded=qs.filter(q=>q.status==='awarded').length;
  const totalVal=qs.reduce((s,q)=>s+(q.total_sell||0),0);
  const totalGp=qs.reduce((s,q)=>s+(q.total_gp||0),0);
  const filtered=qs.filter(q=>{
    const ms=!A.searchQ||q.title.toLowerCase().includes(A.searchQ.toLowerCase())||(q.customer||'').toLowerCase().includes(A.searchQ.toLowerCase());
    const mf=A.filterStatus==='all'||q.status===A.filterStatus;
    return ms&&mf;
  });
  let html=`<div class="dash-metrics">
    <div class="mcard"><div class="mcard-label">Total quotes</div><div class="mcard-val navy">${qs.length}</div><div class="mcard-sub">${awarded} awarded</div></div>
    <div class="mcard"><div class="mcard-label">Pipeline value</div><div class="mcard-val navy">AED ${fmt(totalVal)}</div></div>
    <div class="mcard"><div class="mcard-label">Total GP</div><div class="mcard-val green">AED ${fmt(totalGp)}</div></div>
    <div class="mcard"><div class="mcard-label">Win rate</div><div class="mcard-val amber">${qs.length>0?Math.round(awarded/qs.length*100):0}%</div></div>
  </div>
  <div class="filter-bar">
    <input class="search-inp" placeholder="🔍 Search quotes..." value="${esc(A.searchQ)}" oninput="A.searchQ=this.value;draw()">
    <select class="filter-sel" onchange="A.filterStatus=this.value;draw()">
      <option value="all">All status</option>
      ${['draft','sent','awarded','lost'].map(s=>`<option value="${s}" ${A.filterStatus===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join('')}
    </select>
    <div class="view-toggle">
      <button class="${(A.dashView||'grid')==='grid'?'active':''}" title="Grid view" onclick="A.dashView='grid';draw()">▦</button>
      <button class="${A.dashView==='list'?'active':''}" title="List view" onclick="A.dashView='list';draw()">☰</button>
    </div>
  </div>`;
  if(!filtered.length){
    html+=`<div class="empty-state"><div class="empty-icon">📄</div><div class="empty-title">${qs.length?'No matches':'No quotes yet'}</div><div class="empty-sub">${qs.length?'Try adjusting filters':'Create your first quote'}</div>${!qs.length?`<button class="btn btn-navy" onclick="newQuote()">+ New quote</button>`:''}</div>`;
  } else if(A.dashView==='list'){
    html+=`<div class="quote-list">
      <div class="qlist-hd"><div>Title</div><div>Customer</div><div>Status</div><div>Date</div><div>Currency</div><div>Total value</div><div>Gross profit</div><div>Actions</div></div>`;
    filtered.forEach(q=>{
      const date=new Date(q.updated_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
      html+=`<div class="qlist-row" onclick="openQuote({id:'${q.id}'})">
        <div class="qlist-title">${esc(q.title)}</div>
        <div class="qlist-cust">${esc(q.customer||'No customer')}</div>
        <div><span class="sbadge s-${q.status}">${STATUS_LABELS[q.status]}</span></div>
        <div>${date}</div>
        <div>${q.currency||'AED'}</div>
        <div class="qlist-total">${q.currency||'AED'} ${fmt(q.total_sell||0)}</div>
        <div class="qlist-gp">${q.currency||'AED'} ${fmt(q.total_gp||0)}</div>
        <div class="qlist-actions" onclick="event.stopPropagation()">
          <button class="btn btn-sm" onclick="openQuote({id:'${q.id}'})">✏️</button>
          <button class="btn btn-sm" onclick="duplicateQuote('${q.id}',event)">⧉</button>
          ${A.user?.role==='admin'?`<button class="btn btn-sm btn-red" onclick="deleteQuote('${q.id}',event)">🗑</button>`:''}
        </div>
      </div>`;
    });
    html+=`</div>`;
  } else {
    html+=`<div class="quote-grid">`;
    filtered.forEach(q=>{
      const date=new Date(q.updated_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
      html+=`<div class="qcard" onclick="openQuote({id:'${q.id}'})">
        <div class="qcard-header"><div class="qcard-title">${esc(q.title)}</div><span class="sbadge s-${q.status}">${STATUS_LABELS[q.status]}</span></div>
        <div class="qcard-customer">${esc(q.customer||'No customer')}</div>
        <div class="qcard-meta"><span>📅 ${date}</span><span>💱 ${q.currency||'AED'}</span></div>
        <div class="qcard-totals">
          <div><div class="qcard-total-label">Total value</div><div class="qcard-total-val">${q.currency||'AED'} ${fmt(q.total_sell||0)}</div></div>
          <div style="text-align:right"><div class="qcard-total-label">Gross profit</div><div class="qcard-total-val" style="color:var(--green)">${q.currency||'AED'} ${fmt(q.total_gp||0)}</div></div>
        </div>
        <div class="qcard-actions" onclick="event.stopPropagation()">
          <button class="btn btn-sm" onclick="openQuote({id:'${q.id}'})">✏️ Edit</button>
          <button class="btn btn-sm" onclick="duplicateQuote('${q.id}',event)">⧉ Copy</button>
          ${A.user?.role==='admin'?`<button class="btn btn-sm btn-red" onclick="deleteQuote('${q.id}',event)">🗑 Delete</button>`:''}
        </div>
      </div>`;
    });
    html+=`</div>`;
  }
  return html;
}

// ── Editor ────────────────────────────────────────────────────────────────────
function editorHTML(){
  const q=A.activeQuote;
  if(!q)return`<div class="empty-state"><div class="empty-icon">📄</div><button class="btn btn-navy" onclick="A.page='dashboard';draw()">← Back</button></div>`;
  const o=opt(); if(!o)return`<button class="btn btn-navy" onclick="addOpt()">+ Add option</button>`;
  const isInt=A.view==='internal';
  const IMG=imgOn();

  // "Prepared by" is set once, at option creation (see mkOption), to whoever
  // created it -- it must NOT be re-synced to the current viewer on every
  // render, or opening someone else's quote (as any admin / anyone with
  // "view all quotes" can) silently overwrites their name with your own.
  // Only fill it in here if it's genuinely missing (legacy rows from before
  // this field existed). "Title / Role" similarly only resets the old
  // "General Manager" default -- it never overwrites a custom value.
  let _prepDirty=false;
  opts().forEach(op=>{
    if(!op.by && A.user?.name){op.by=A.user.name;_prepDirty=true;}
    if(!op.title||op.title==='General Manager'){op.title='Sales Team';_prepDirty=true;}
  });
  if(_prepDirty)schedSave();

  let html=`<div class="opt-pills">`;
  opts().forEach((op,i)=>html+=`<button class="opt-pill ${i===A.activeOpt?'active':''}" onclick="A.activeOpt=${i};draw()">${esc(op.label)}</button>`);
  html+=`<button class="opt-pill-add" onclick="addOpt()">+ Add option</button></div>`;

  html+=`<div class="card">
    <div class="card-title">Quote details</div>
    <div class="field-grid g4" style="margin-bottom:14px">
      <div class="fld2"><label>Quote title</label><input value="${esc(q.title)}" oninput="A.activeQuote.title=this.value;schedSave()"></div>
      <div class="fld2" style="position:relative"><label>Customer</label><input id="custInput" value="${esc(q.customer)}" autocomplete="off" style="padding-right:36px" oninput="A.activeQuote.customer=this.value;schedSave();zohoSearch(this.value)" onblur="setTimeout(hideCustDrop,180)" placeholder="Type or search Zoho Books…"><button class="cust-search-btn" title="Search customers in Zoho Books" onclick="openCustModal()">🔍</button><div id="custDrop" class="cust-drop" style="display:none"></div></div>

// ── Print ─────────────────────────────────────────────────────────────────────
// Builds a standalone HTML document from the exact same printHTML() markup
// shown on screen (minus the theme-picker/tip-banner UI, which don't belong
// in the PDF) plus the page's own CSS, so the PDF-rendering service produces
// a byte-for-byte match of what the user actually sees — instead of a
// separately hand-built PDF template that can only ever approximate it.
function buildExportHTML(){
  const css=document.querySelector('style')?.textContent||'';
  const body=printHTML(true);
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><style>${css}
  body{background:#fff;margin:0;padding:0}
  .print-doc{box-shadow:none;max-width:100%}
  </style></head><body>${body}</body></html>`;
}
// Repeating per-page footer for the downloaded PDF only (PDFShift renders
// header/footer independently of the document, on every page from
// `start_at` onward -- something a browser's own print/Ctrl+P can't do,
// since Chromium only supports its native URL/date header-footer, not
// custom repeating content). Page 1 already carries the full letterhead,
// so this starts at page 2 as a lightweight "which company sent this"
// reminder in case pages get separated after printing.
function pdfFooterHTML(){
  const q=A.activeQuote;
  const ref=q?.quote_ref||q?.quote_data?.[0]?.ref||q?.title||'';
  const web=PRINTCO?.website||'';
  const left=[ref,web].filter(Boolean).join(' · ');
  const dark=getPrintTheme().dark;
  return `<div style="width:100%;box-sizing:border-box;padding:6px 24px 0;border-top:1px solid #d8dce3;display:flex;justify-content:space-between;align-items:center;font-family:Arial,Helvetica,sans-serif;font-size:9px;color:${dark}">
    <span>${esc(left)}</span>
    <span>Page {{page}} of {{total}}</span>
  </div>`;
}
async function downloadPDF(){
  const q=A.activeQuote;if(!q)return;
  const btns=document.querySelectorAll('button');let b=null;btns.forEach(x=>{if(x.textContent.includes('PDF'))b=x;});
  if(b){b.disabled=true;b.textContent='⏳ Generating…';}
  try{
    const html=buildExportHTML();
    // Self-hosted Puppeteer/Chromium route (api/pdf-render.js) -- swapped in
    // from the old PDFShift-backed /api/pdf/render after PDFShift's free
    // monthly credits ran out. Same "render the real on-screen HTML" approach,
    // just no third-party quota. footer_html/footer_start_at were PDFShift-
    // specific (page.pdf() builds its own repeating footer instead), so they're
    // no longer sent. Old route/pdfFooterHTML() left in place as a fallback.
    const r=await fetch('/api/pdf/render2',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+A.token},
      body:JSON.stringify({html, filename:'Quotation-'+(q.quote_ref||q.quote_data?.[0]?.ref||q.title||'quote').replace(/[^\w\-]+/g,'-')+'.pdf'})});
    if(!r.ok){const e=await r.json().catch(()=>({}));alert(e.error||'PDF generation failed');return;}
    const blob=await r.blob();
    const cd=r.headers.get('Content-Disposition')||'';
    const m=cd.match(/filename="?([^";]+)"?/);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=m?m[1]:('Quotation-'+(q.title||'quote').replace(/[^\w\-]+/g,'-')+'.pdf');
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  }catch(e){alert('Could not reach the PDF service.');}
  finally{if(b){b.disabled=false;b.textContent='⬇ PDF';}}
}

function printAddrLines(){
  if(!PRINTCO)return[];
  // Keep "TRN: X" and "Tel: Y" each glued together as one unbreakable chunk
  // (using a non-breaking space instead of a normal one) so a long print
  // line never wraps mid-phone-number or mid-TRN, which reads badly.
  const nb=s=>String(s).replace(/ /g,'\u00A0');
  const lines=[];
  if(PRINTCO.address)lines.push(PRINTCO.address);
  const trnTel=[PRINTCO.trn?`TRN:\u00A0${nb(PRINTCO.trn)}`:'',PRINTCO.phone?`Tel:\u00A0${nb(PRINTCO.phone)}`:''].filter(Boolean).join(' | ');
  if(trnTel)lines.push(trnTel);
  if(PRINTCO.website)lines.push(PRINTCO.website);
  return lines;
}

  {id:'purple',  name:'Royal Purple',   dark:'#4c1d95', bg:'#f1eafe', text:'#6d28d9'},

  {id:'indigo',  name:'Indigo Night',   dark:'#312e81', bg:'#eef0fd', text:'#4338ca'},
];
function getPrintTheme(){
  const saved=localStorage.getItem('sq_print_theme');
  return PRINT_THEMES.find(t=>t.id===saved)||PRINT_THEMES[0];
}
function setPrintTheme(id){localStorage.setItem('sq_print_theme',id);draw();}
function printThemeSwitcherHTML(){
  const cur=getPrintTheme().id;
  return `<div class="print-controls" style="background:#fff;border:1.5px solid var(--gray-200);border-radius:8px;padding:12px 16px;margin-bottom:16px">
    <div style="font-size:12px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Choose a layout color</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      ${PRINT_THEMES.map(t=>`<div onclick="setPrintTheme('${t.id}')" title="${esc(t.name)}" style="cursor:pointer;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;border:1.5px solid ${t.id===cur?t.dark:'var(--gray-200)'};background:${t.id===cur?t.bg:'#fff'}">
        <span style="width:14px;height:14px;border-radius:50%;background:${t.dark};display:inline-block"></span>
        <span style="font-size:12px;font-weight:${t.id===cur?'700':'500'};color:${t.id===cur?t.text:'var(--gray-700)'}">${esc(t.name)}</span>
      </div>`).join('')}
    </div>
  </div>`;
}
// ── Print layout density, font family, and per-zone text size ──────────────
// Independent from the color theme above: density only affects the item
// table's row padding, font controls only affect font-size (never padding),
// each zone scale multiplies that zone's *existing* px values so relative
// hierarchy within a zone (e.g. price cells vs description cells) is kept.
const PRINT_DENSITIES=[
  {id:'compact', name:'Compact',  scale:0.72},
  {id:'standard',name:'Standard', scale:1},
  {id:'spacious',name:'Spacious', scale:1.4},
];
function getPrintDensity(){
  const saved=localStorage.getItem('sq_print_density');
  return PRINT_DENSITIES.find(d=>d.id===saved)||PRINT_DENSITIES[1];
}
function setPrintDensity(id){localStorage.setItem('sq_print_density',id);draw();}
function DP(str){
  const sc=getPrintDensity().scale;
  return str.replace(/(\d+(?:\.\d+)?)px/g,(m,n)=>(Math.round(parseFloat(n)*sc*10)/10)+'px');
}

const PRINT_FONTS=[
  {id:'sans',    name:'Sans (default)', css:"-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"},
  {id:'serif',   name:'Classic Serif',  css:"Georgia,'Times New Roman',Times,serif"},
  {id:'grotesk', name:'Modern Grotesk', css:"'Helvetica Neue',Helvetica,Arial,sans-serif"},
  {id:'calibri', name:'Calibri Style',  css:"Calibri,'Segoe UI',Arial,sans-serif"},
];
function getPrintFont(){
  const saved=localStorage.getItem('sq_print_font');
  return PRINT_FONTS.find(f=>f.id===saved)||PRINT_FONTS[0];
}
function setPrintFont(id){localStorage.setItem('sq_print_font',id);draw();}

const PRINT_SIZE_SCALES=[
  {id:'sm', name:'Small',  scale:0.85},
  {id:'md', name:'Medium', scale:1},
  {id:'lg', name:'Large',  scale:1.15},
];
const PRINT_ZONES=[
  {id:'header', name:'Headers & titles'},
  {id:'body',   name:'Body & totals'},
  {id:'table',  name:'Item table'},
];
function getPrintZoneSizeId(zone){
  const saved=localStorage.getItem('sq_print_size_'+zone);
  return (PRINT_SIZE_SCALES.find(s=>s.id===saved)||PRINT_SIZE_SCALES[1]).id;
}
function getPrintZoneScale(zone){
  return (PRINT_SIZE_SCALES.find(s=>s.id===getPrintZoneSizeId(zone))||PRINT_SIZE_SCALES[1]).scale;
}
function setPrintZoneSize(zone,id){localStorage.setItem('sq_print_size_'+zone,id);draw();}
function SZ(px,zone){return Math.round(px*getPrintZoneScale(zone)*10)/10;}

function printTypographyControlsHTML(){
  const curFont=getPrintFont().id, curDensity=getPrintDensity().id;
  const chip=(active,label,onclick,extraStyle='')=>`<div onclick="${onclick}" style="cursor:pointer;padding:5px 14px;border-radius:20px;border:1.5px solid ${active?'#16294f':'var(--gray-200)'};background:${active?'#eaf1fc':'#fff'};font-size:12px;font-weight:${active?'700':'500'};color:${active?'#16294f':'var(--gray-700)'};${extraStyle}">${esc(label)}</div>`;
  return `<div class="print-controls" style="background:#fff;border:1.5px solid var(--gray-200);border-radius:8px;padding:12px 16px;margin-bottom:16px">
    <div style="font-size:12px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Layout density</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">
      ${PRINT_DENSITIES.map(d=>chip(d.id===curDensity,d.name,`setPrintDensity('${d.id}')`)).join('')}
    </div>
    <div style="font-size:12px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Font</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">
      ${PRINT_FONTS.map(f=>chip(f.id===curFont,f.name,`setPrintFont('${f.id}')`,`font-family:${f.css}`)).join('')}
    </div>
    <div style="font-size:12px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Text size</div>
    <div style="display:flex;flex-wrap:wrap;gap:20px">
      ${PRINT_ZONES.map(z=>`<div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:12px;color:var(--gray-700);margin-right:2px">${esc(z.name)}:</span>
        ${PRINT_SIZE_SCALES.map(s=>`<div onclick="setPrintZoneSize('${z.id}','${s.id}')" title="${esc(s.name)}" style="cursor:pointer;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:5px;border:1.5px solid ${getPrintZoneSizeId(z.id)===s.id?'#16294f':'var(--gray-200)'};background:${getPrintZoneSizeId(z.id)===s.id?'#eaf1fc':'#fff'};font-size:${s.id==='sm'?'10px':s.id==='md'?'12px':'14px'};font-weight:700;color:${getPrintZoneSizeId(z.id)===s.id?'#16294f':'var(--gray-500)'}">A</div>`).join('')}
      </div>`).join('')}
    </div>
  </div>`;
}
// ── Print pricing visibility ────────────────────────────────────────────────
// Session-only (not persisted to localStorage like the theme/density/font
// choices above) so a no-pricing copy never lingers silently into the next
// quote or the next day -- it always resets to "prices shown" on reload.
function togglePrintPricing(){A.printHidePrices=!A.printHidePrices;draw();}
function printPricingToggleHTML(){
  const hidden=!!A.printHidePrices;
  return `<div class="print-controls" style="background:#fff;border:1.5px solid var(--gray-200);border-radius:8px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <div>
      <div style="font-size:12px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px">Pricing</div>
      <div style="font-size:12px;color:var(--gray-700)">${hidden?'Unit price, VAT, and totals are hidden on this printout.':'Unit price, VAT, and totals are shown on this printout.'}</div>
    </div>
    <button class="btn ${hidden?'':'btn-navy'}" onclick="togglePrintPricing()" style="white-space:nowrap">${hidden?'💰 Show prices':'🚫 Hide prices'}</button>
  </div>`;
}
function printHTML(forExport){

  const multi=os.length>1;
  const IMG=imgOn();

// ── Products & dynamic catalog ───────────────────────────────────────────────
let PRODS={list:[],total:0,search:'',t:null};

function thumbCell(si,ii,it){
  const id=`pthumb-${si}-${ii}`;
  if(it.img)return`<div class="prod-thumb" id="${id}" title="Change image" onclick="openRowImage(${si},${ii})"><img src="${esc(it.img)}"></div>`;
  if(A.view==='internal'&&((it.brand||'').trim()||(it.model||'').trim()))return`<div class="prod-thumb empty" id="${id}" title="Pick product image" onclick="openRowImage(${si},${ii})">📷</div>`;
  return`<div id="${id}"></div>`;
}
function updThumb(si,ii){const el=document.getElementById(`pthumb-${si}-${ii}`);const it=sec(si)?.items?.[ii];if(el&&it)el.outerHTML=thumbCell(si,ii,it);}

async function captureProduct(si,ii){
  if(!imgOn())return;
  const it=sec(si)?.items?.[ii];if(!it)return;
  const brand=(it.brand||'').trim(),model=(it.model||'').trim();
  if(!brand&&!model)return;
  const key=(brand+'|'+model).toLowerCase();
  if(it._pk===key&&it.product_id)return;
  it._pk=key;
  try{
    const r=await api('GET','/api/products?limit=10&search='+encodeURIComponent(model||brand));
    const hit=(r.products||[]).find(p=>(p.model||'').trim().toLowerCase()===model.toLowerCase()&&(!brand||!(p.brand||'').trim()||(p.brand||'').trim().toLowerCase()===brand.toLowerCase()));
    if(hit){
      it.product_id=hit.id;
      let fill=false;
      if(hit.image_url&&it.img!==hit.image_url){it.img=hit.image_url;fill=true;}
      if(!it.desc&&hit.description){it.desc=hit.description;fill=true;}
      if((!it.cost||+it.cost===0)&&+hit.default_cost>0){it.cost=+hit.default_cost;fill=true;}
      schedSave();
      if(fill&&document.activeElement===document.body)draw();else updThumb(si,ii);
      return;
    }
    const cr=await api('POST','/api/products',{brand,model,description:it.desc||'',default_cost:+it.cost||0,default_margin:+it.margin||0.2});
    if(cr.product){it.product_id=cr.product.id;schedSave();updThumb(si,ii);}
  }catch(e){}
}

// Pushes a quote line's cost back to the product it's linked to, if that
// product's catalog cost is still 0/missing. Needed because captureProduct()
// above links/creates the product the moment Brand or Model is blurred --
// almost always before the user has typed a cost yet -- so without this, a
// product created from a quote line permanently keeps a 0 catalog cost even
// after the real cost is entered.
async function syncProductCost(si,ii){
  const it=sec(si)?.items?.[ii];
  if(!it||!it.product_id||!(+it.cost>0))return;
  try{ await api('POST',`/api/products/${it.product_id}/sync-cost`,{cost:+it.cost}); }catch(e){}
}

// ── Vendor-field live search (Vendor Master autocomplete; manual values allowed) ──
// NOT gated behind the Images/catalog toggle — vendor lookup is independent of
// catalog assist. Picking a suggestion fills the item's vendor (and vendor_id);
// free-typed values are kept as-is and are never auto-added to the Vendor Master.
let VDD={si:-1,ii:-1,t:null,last:'',matches:[]};
function vdSearchInput(si,ii,val){
  clearTimeout(VDD.t);
  const q=(val||'').trim();
  if(q.length<1){hideVdDrop();return;}
  VDD.t=setTimeout(async()=>{
    VDD.last=q;
    let r;
    try{r=await api('GET','/api/vendors?limit=8&search='+encodeURIComponent(q));}catch(e){return;}
    if(VDD.last!==q)return; // stale response
    VDD.si=si;VDD.ii=ii;VDD.matches=r.vendors||[];
    showVdDrop(si,ii,VDD.matches);
  },300);
}
function showVdDrop(si,ii,matches){
  const inp=document.getElementById(`vdInput-${si}-${ii}`);if(!inp)return;
  if(!matches.length){hideVdDrop();return;}
  let el=document.getElementById('vdDrop');
  if(!el){el=document.createElement('div');el.id='vdDrop';el.className='pm-drop';document.body.appendChild(el);}
  const rect=inp.getBoundingClientRect();
  el.style.left=Math.round(rect.left)+'px';
  el.style.top=Math.round(rect.bottom+4)+'px';
  el.style.width=Math.max(Math.round(rect.width),220)+'px';
  el.innerHTML=matches.map((v,idx)=>`<div class="pm-opt" onmousedown="vdPick(${idx})">
    <div class="pm-txt"><div class="pm-model">${esc(v.name||'')}</div><div class="pm-sub">${esc(v.category||'')}${v.contact_person?' · '+esc(v.contact_person):''}</div></div>
  </div>`).join('');
  el.style.display='block';
}
function hideVdDrop(){const el=document.getElementById('vdDrop');if(el)el.style.display='none';}
function vdPick(idx){
  const v=VDD.matches[idx];if(!v)return;
  const it=sec(VDD.si)?.items?.[VDD.ii];if(!it)return;
  it.vendor=v.name||'';
  it.vendor_id=v.id;
  hideVdDrop();
  const inp=document.getElementById(`vdInput-${VDD.si}-${VDD.ii}`);
  if(inp)inp.value=it.vendor; // update in place — no full redraw, keeps typing flow
  schedSave();
}

// ── Model-field live search (Product Master first, online search fallback) ────
// Gated behind the same "Images & catalog assist" toggle as captureProduct
// above, so it's a no-op (zero behavior change) for quotes that have it off.
let PMD={si:-1,ii:-1,t:null,last:'',matches:[]};
function pmSearchInput(si,ii,val){
  if(!imgOn())return;
  clearTimeout(PMD.t);
  const q=(val||'').trim();
  if(q.length<2){hidePmDrop();return;}
  PMD.t=setTimeout(async()=>{
    PMD.last=q;
    let r;
    try{r=await api('GET','/api/products?limit=8&search='+encodeURIComponent(q));}catch(e){return;}
    if(PMD.last!==q)return; // stale response — a newer keystroke has since fired
    const matches=(r.products||[]).filter(p=>p.is_active!==false);
    PMD.si=si;PMD.ii=ii;PMD.matches=matches;
    showPmDrop(si,ii,q,matches);
  },300);
}
// Manual trigger for the 🔍 icon next to the Model field: skips the 300ms
// typing debounce so a click searches immediately, and — unlike the silent
// no-op that typing produces — explains itself when Images/catalog assist is
// off for this quote, since that's the most common reason search "does
// nothing" and it isn't obvious from the Model field alone.
function pmSearchIconClick(si,ii){
  if(!imgOn()){
    alert('Product search is off for this quote.\n\nTurn on "🖼 Images" in the toolbar above to search the Product Master and enable AI Model Lookup.');
    return;
  }
  const inp=document.getElementById(`pmInput-${si}-${ii}`);
  if(!inp)return;
  const q=(inp.value||'').trim();
  const it=sec(si)?.items?.[ii];
  const q2=q||(it?.brand||'').trim()||(it?.desc||'').trim();
  clearTimeout(PMD.t);
  hidePmDrop();
  showImagePicker(it?.product_id||'',q2,si,ii);
}
function showPmDrop(si,ii,query,matches){
  const inp=document.getElementById(`pmInput-${si}-${ii}`);if(!inp)return;
  let el=document.getElementById('pmDrop');
  if(!el){el=document.createElement('div');el.id='pmDrop';el.className='pm-drop';document.body.appendChild(el);}
  const rect=inp.getBoundingClientRect();
  el.style.left=Math.round(rect.left)+'px';
  el.style.top=Math.round(rect.bottom+4)+'px';
  el.style.width=Math.max(Math.round(rect.width),260)+'px';
  const rows=matches.map((p,idx)=>`<div class="pm-opt" onmousedown="pmPick(${idx})">
    ${p.image_url?`<img class="pm-thumb" src="${esc(p.image_url)}">`:`<div class="pm-thumb empty">📦</div>`}
    <div class="pm-txt"><div class="pm-model">${esc(p.model||p.brand||'(unnamed)')}</div><div class="pm-sub">${esc(p.brand||'')}${p.category?' · '+esc(p.category):''}${p.sku?' · '+esc(p.sku):''}</div></div>
  </div>`).join('');
  const noMatch=matches.length?'':`<div style="padding:10px 12px;font-size:12.5px;color:var(--gray-500)">No matches in your Product Master.</div>`;
  const onlineRow=`<div class="pm-online" onmousedown="pmOnlineSearch(${si},${ii})">🔍 ${matches.length?'Not the right one? ':''}Search online</div>`;
  el.innerHTML=rows+noMatch+onlineRow;
  el.style.display='block';
}
function hidePmDrop(){const el=document.getElementById('pmDrop');if(el)el.style.display='none';}
function pmPick(idx){
  const p=PMD.matches[idx];if(!p)return;
  const it=sec(PMD.si)?.items?.[PMD.ii];if(!it)return;
  it.brand=p.brand||'';it.model=p.model||'';
  if(p.description)it.desc=p.description;
  if(+p.default_cost>0)it.cost=+p.default_cost;
  if(p.default_margin!=null)it.margin=+p.default_margin;
  if(p.image_url)it.img=p.image_url;
  it.product_id=p.id;
  it._pk=((p.brand||'')+'|'+(p.model||'')).toLowerCase();
  hidePmDrop();
  schedSave();draw();
}

}

}

    ${pmManualFormHTML(query,r.guessed_brand||'',top?(top.snippet||top.title||''):'')}

    <div class="modal-actions">

}
function pmSelectImg(idx){

function closePmOnlineModal(){const el=document.getElementById('pmOnlineOverlay');if(el)el.remove();}
async function pmOnlineConfirm(si,ii){
  const brand=(document.getElementById('pmoBrand')?.value||'').trim();
  const model=(document.getElementById('pmoModel')?.value||'').trim();
  const desc=(document.getElementById('pmoDesc')?.value||'').trim();
  if(!brand&&!model){alert('Enter at least a brand or model.');return;}
  const cr=await api('POST','/api/products',{brand,model,description:desc,default_cost:0,default_margin:0.2});
  if(cr.error){alert(cr.error);return;}
  let product=cr.product;
  if(PMOS.selectedImg&&product?.id){
    const ir=await api('POST','/api/products/'+product.id+'/image',{url:PMOS.selectedImg});
    if(ir.product)product=ir.product;
  }

  if(it){
    it.brand=brand;it.model=model;if(desc)it.desc=desc;
    if(product&&product.image_url)it.img=product.image_url;
    it.product_id=product?product.id:it.product_id;
    it._pk=(brand+'|'+model).toLowerCase();
  }

async function openRowImage(si,ii){

function showImagePicker(pid,query,si,ii){
  closeImgPicker();

function runImgSearch(pid,si,ii){
  const q=(document.getElementById('imgQ')?.value||'').trim();
  if(!q)return;
  const el=document.getElementById('imgBody');
  if(el)el.innerHTML=`<div style="text-align:center;padding:26px;color:var(--gray-500)">Searching your vendor sites…</div>`;
  api('GET','/api/products/image-search?q='+encodeURIComponent(q)).then(r=>{
    const el=document.getElementById('imgBody');if(!el)return;
    if(r.error){el.innerHTML=`<div class="auth-err">${esc(r.error)}</div><div style="font-size:13px;color:var(--gray-500);margin-top:8px">You can still upload an image manually below.</div>`;return;}
    if(!(r.images||[]).length){el.innerHTML=`<div style="color:var(--gray-500);padding:14px">No images found for this search — try different keywords or upload one manually below.</div>`;return;}
    el.innerHTML=`<div class="img-grid">${r.images.map(im=>{
      const u=encodeURIComponent(im.url).replace(/'/g,'%27');
      const src=(im.source||'').replace(/^https?:\/\/(www\.)?/,'').split('/')[0];
      return`<div class="img-opt" onclick="pickProdImage('${pid}','${u}',${si},${ii})"><img src="${esc(im.thumb)}" loading="lazy" onerror="this.parentNode.style.display='none'"><div class="img-src">${esc(src)}</div></div>`;
    }).join('')}</div><div style="font-size:12px;color:var(--gray-500)">Click the correct image — it will be saved to your catalog.</div>`;
  });
}
function closeImgPicker(){const el=document.getElementById('imgOverlay');if(el)el.remove();}
async function pickProdImage(pid,encUrl,si,ii){
  const el=document.getElementById('imgBody');if(el)el.innerHTML='<div style="text-align:center;padding:26px;color:var(--gray-500)">Saving image…</div>';
  const r=await api('POST','/api/products/'+pid+'/image',{url:decodeURIComponent(encUrl)});
  if(r.error){if(el)el.innerHTML=`<div class="auth-err">${esc(r.error)}</div><div style="font-size:13px;color:var(--gray-500);margin-top:8px">Try another result or upload manually below.</div>`;return;}
  finishImage(pid,r.product.image_url,si,ii);
}
function uploadProdImage(event,pid,si,ii){
  const file=event.target.files[0];if(!file)return;event.target.value='';
  if(file.size>4*1024*1024){alert('Image must be under 4 MB.');return;}
  const el=document.getElementById('imgBody');if(el)el.innerHTML='<div style="text-align:center;padding:26px;color:var(--gray-500)">Uploading…</div>';
  const reader=new FileReader();
  reader.onload=async function(e){
    const r=await api('POST','/api/products/'+pid+'/image',{data:e.target.result,content_type:file.type});
    if(r.error){if(el)el.innerHTML=`<div class="auth-err">${esc(r.error)}</div>`;return;}
    finishImage(pid,r.product.image_url,si,ii);
  };
  reader.readAsDataURL(file);
}
function finishImage(pid,url,si,ii){
  closeImgPicker();
  let touched=false;
  if(A.activeQuote)opts().forEach(op=>(op.sections||[]).forEach(s=>(s.items||[]).forEach(it=>{if(it.product_id===pid){it.img=url;touched=true;}})));
  if(si>=0&&ii>=0){const it=sec(si)?.items?.[ii];if(it){it.img=url;it.product_id=pid;touched=true;}}
  if(touched&&A.activeQuote)schedSave();
  if(A.page==='editor')draw();
  if(A.page==='products')loadProducts();
}

function downloadProdTemplate(){

  ws['!cols']=[{wch:16},{wch:26},{wch:16},{wch:16},{wch:50},{wch:12},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws,'Products');
  XLSX.writeFile(wb,'sysconic-products-template.xlsx');
}
function importProducts(event){
  const file=event.target.files[0];if(!file)return;event.target.value='';
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      let hi=-1;
      for(let i=0;i<Math.min(rows.length,10);i++){const r=rows[i].map(x=>String(x).toUpperCase());if(r.some(x=>x.includes('MODEL'))){hi=i;break;}}
      if(hi===-1){alert('Could not find a MODEL column header in that file.');return;}
      const H=rows[hi].map(x=>String(x).toUpperCase().trim());
      const col={brand:H.findIndex(h=>h.includes('BRAND')),model:H.findIndex(h=>h.includes('MODEL')),sku:H.findIndex(h=>h.includes('SKU')),category:H.findIndex(h=>h.includes('CATEGORY')),desc:H.findIndex(h=>h.includes('DESC')),cost:H.findIndex(h=>h.includes('COST')||h.includes('MSRP')),margin:H.findIndex(h=>h.includes('MARGIN'))};
      const products=[];
      for(let i=hi+1;i<rows.length;i++){
        const row=rows[i];if(!row||row.every(x=>x===''||x===null))continue;
        const g=x=>x>=0?String(row[x]??'').trim():'';
        let m=parseFloat(g(col.margin))||0;if(m>1)m=m/100;
        products.push({brand:g(col.brand),model:g(col.model),sku:g(col.sku),category:g(col.category),description:g(col.desc),default_cost:parseFloat(g(col.cost))||0,default_margin:m||0.2});
      }
      if(!products.length){alert('No product rows found below the header.');return;}
      if(products.length>500){alert('Maximum 500 rows per import — please split the file.');return;}
      if(!confirm(`Import ${products.length} products into the catalog?`))return;
      const r=await api('POST','/api/products/bulk',{products});
      if(r.error){alert(r.error);return;}
      alert(`Imported ${r.imported} products${r.skipped?`, skipped ${r.skipped} rows without brand/model`:''}.`);
      loadProducts();
    }catch(err){alert('Could not read that Excel file.');}
  };
  reader.readAsBinaryString(file);
}

async function generateBom(){

function applyBom(){
  const o=opt();if(!o)return;
  let added=0;
  BOM.sections.forEach(s=>{
    const items=s.items.filter(it=>it._checked).map(it=>{
      const item=mkItem(it.brand||'',it.model||'',it.description||'',it.qty||1,+it.cost||0,0,+it.margin||0.2);

// ── AI System Diagram ──────────────────────────────────────────────────────────
// Generates a Mermaid system schematic from the active option's BOM via Gemini.
// The code is stored on the option object itself (opt().diagram) so it rides
// along inside quote_data — saved, snapshotted and available to the proposal
// generator with no schema change.
let DIAG={busy:false,code:'',showCode:false,photos:true};

function diagMermaidReady(){return typeof window.mermaid!=='undefined';}
let _diagInit=false;
function diagInitMermaid(){
  if(_diagInit||!diagMermaidReady())return;
  // htmlLabels:false is load-bearing: with HTML labels, mermaid puts
  // <foreignObject> nodes inside the SVG, and Chrome then refuses
  // canvas.toDataURL() ("tainted canvas") — which silently killed the
  // PNG export and the proposal schematic embed. Pure-SVG labels render
  // near-identically and keep the canvas clean.
  window.mermaid.initialize({startOnLoad:false,securityLevel:'loose',theme:'base',fontFamily:'inherit',flowchart:{htmlLabels:false},htmlLabels:false});
  _diagInit=true;
}

function openDiagramModal(){
  if(!A.activeQuote)return;
  const o=opt();if(!o)return;
  DIAG={busy:false,code:(o.diagram&&o.diagram.code)||'',showCode:false,photos:true};
  document.body.insertAdjacentHTML('beforeend',`<div class="modal-overlay" id="diagOverlay" onclick="if(event.target===this)closeDiagramModal()">
    <div class="modal" style="max-width:900px;max-height:90vh;overflow-y:auto" id="diagModalBox"></div></div>`);
  renderDiagramModal();
  if(DIAG.code)renderDiagPreview();
}
function closeDiagramModal(){const el=document.getElementById('diagOverlay');if(el)el.remove();DIAG={busy:false,code:'',showCode:false};}

function renderDiagramModal(){
  const box=document.getElementById('diagModalBox');if(!box)return;
  const o=opt()||{};
  const saved=o.diagram&&o.diagram.code;
  let missingImgs=0;
  (o.sections||[]).forEach(s=>(s.items||[]).forEach(it=>{if(!it.img&&((it.brand||'').trim()||(it.model||'').trim()))missingImgs++;}));
  box.innerHTML=`
    <div class="modal-title">🗺 AI System Diagram <span style="font-size:12px;font-weight:600;color:var(--amber)">AI</span></div>
    <div class="modal-sub">Generates a system schematic (signal flow) from this option's bill of materials. Review it — AI can misread a BOM line — then save it to the quote or download it.${saved?` <span style="color:var(--green)">A diagram is saved on ${esc(o.label||'this option')}${o.diagram.updated_at?' ('+esc(o.diagram.updated_at.slice(0,10))+')':''}.</span>`:''}</div>
    <div id="diagPreview" style="border:1.5px solid var(--gray-200);border-radius:8px;min-height:220px;margin:10px 0;padding:12px;overflow:auto;background:#fff;display:flex;align-items:center;justify-content:center">
      <div style="color:var(--gray-500);font-size:14px">${DIAG.code?'Rendering…':'No diagram yet — click Generate to draw one from the BOM.'}</div>
    </div>
    ${DIAG.showCode?`<textarea id="diagCode" rows="10" spellcheck="false" style="width:100%;padding:10px;font-family:monospace;font-size:12px;border:1.5px solid var(--gray-200);border-radius:8px;margin-bottom:10px" oninput="DIAG.code=this.value" onchange="renderDiagPreview()">${esc(DIAG.code)}</textarea>
    <div style="font-size:12px;color:var(--gray-500);margin:-6px 0 10px">Edit the Mermaid code above, then click outside the box to re-render.</div>`:''}
    <div class="modal-actions" style="flex-wrap:wrap;gap:8px">
      <button class="btn" onclick="closeDiagramModal()">Close</button>
      <button class="btn" onclick="DIAG.showCode=!DIAG.showCode;renderDiagramModal();if(DIAG.code)renderDiagPreview()">${DIAG.showCode?'Hide':'✎ Edit'} code</button>
      ${DIAG.code?`<button class="btn" onclick="diagToggleDirection()" title="Flip the layout between Left-to-Right and Top-to-Bottom">${/^(flowchart|graph)\s+(TB|TD)/.test(DIAG.code)?'↔ Horizontal':'↕ Vertical'}</button>
      <button class="btn" onclick="openDiagLiveEditor()" title="Open this diagram in the free Mermaid Live Editor for full editing — paste the refined code back via ✎ Edit code">🔗 Mermaid Live</button>
      <button class="btn" onclick="downloadDiagram('svg')">⬇ SVG</button>
      <button class="btn" onclick="downloadDiagram('png')">⬇ PNG</button>`:''}
      ${DIAG.code&&!isQuoteLocked()?`<button class="btn" onclick="saveDiagramToQuote()">💾 Save to quote</button>`:''}
      <label style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;cursor:pointer;color:var(--gray-500)" title="Render items that have a catalog image as product-photo nodes (XTEN-AV style). Applies on the next Generate."><input type="checkbox" ${DIAG.photos?'checked':''} onchange="DIAG.photos=this.checked">🖼 Product photos</label>
      ${missingImgs&&!isQuoteLocked()?`<button class="btn" id="diagImgFillBtn" onclick="diagAutoFillImages()" title="Web-search a product photo for each item that has a brand/model but no image (first result is used; saved to your catalog — fix any wrong pick via the 📷 icon on the item row)">🖼 Auto-fill images (${missingImgs})</button>`:''}
      <button class="btn btn-navy" id="diagGenBtn" onclick="generateDiagram()">${DIAG.code?'🔄 Regenerate':'✨ Generate'} with AI</button>
    </div>`;
}

function diagBomPayload(){
  const o=opt();if(!o)return null;
  return{
    title:A.activeQuote?.title||'',
    sections:(o.sections||[]).map(s=>({name:s.name||'',items:(s.items||[]).map(it=>{
      const row={brand:it.brand||'',model:it.model||'',desc:it.desc||'',qty:it.qty||1};
      // Product photo (Supabase product-images) → image node in the schematic,
      // XTEN-AV style. Only sent when the toggle is on and the item has one.
      if(DIAG.photos&&it.img)row.img=it.img;
      return row;
    })})),
  };
}

// Auto-fill: for every item with a brand/model but no image, web-search a
// product photo (Brave, via the existing image-search endpoint), take the top
// result and save it to the catalog via the existing per-product image
// endpoint — which copies it into Supabase storage, so the photo is also
// CORS-safe for PNG export. Sequential on purpose: respects the Brave API
// rate limit. First result isn't always right; the row 📷 picker fixes those.
async function diagAutoFillImages(){
  if(DIAG.busy)return;
  const o=opt();if(!o)return;
  if(isQuoteLocked()){alert('This quote is locked — unlock it to update item images.');return;}
  const targets=[];
  (o.sections||[]).forEach((s,si)=>(s.items||[]).forEach((it,ii)=>{
    if(!it.img&&((it.brand||'').trim()||(it.model||'').trim()))targets.push([si,ii]);
  }));
  if(!targets.length)return;
  const CAP=15;
  const btn=document.getElementById('diagImgFillBtn');
  DIAG.busy=true;
  let done=0,ok=0,fail=0;
  for(const [si,ii] of targets.slice(0,CAP)){
    done++;
    if(btn){btn.disabled=true;btn.textContent=`Fetching ${done}/${Math.min(targets.length,CAP)}…`;}
    try{
      const it=sec(si)?.items?.[ii];if(!it)continue;
      if(!it.product_id)await captureProduct(si,ii);
      if(!it.product_id){fail++;continue;}
      const q=((it.brand||'')+' '+(it.model||'')).trim();
      const r=await api('GET','/api/products/image-search?q='+encodeURIComponent(q));
      const first=(r.images||[])[0];
      if(r.error||!first||!first.url){fail++;continue;}
      const sv=await api('POST','/api/products/'+it.product_id+'/image',{url:first.url});
      if(sv.error||!sv.product||!sv.product.image_url){fail++;continue;}
      it.img=sv.product.image_url;ok++;
    }catch(e){fail++;}
  }
  DIAG.busy=false;
  if(ok&&A.activeQuote)schedSave();
  const skipped=targets.length>CAP?` ${targets.length-CAP} item(s) skipped (rate-limit cap) — run Auto-fill again for the rest.`:'';
  alert(`Product images: ${ok} found and saved${fail?`, ${fail} not found or failed`:''}.${skipped}${ok?' The first search result was used — fix any wrong picture via the 📷 icon on the item row, then Regenerate the diagram.':''}`);
  renderDiagramModal();
  if(DIAG.code)renderDiagPreview();
  if(A.page==='editor')draw();
}

async function generateDiagram(){
  if(DIAG.busy)return;
  const payload=diagBomPayload();
  if(!payload||!payload.sections.some(s=>s.items.length)){alert('This option has no line items yet — add the BOM first.');return;}
  const btn=document.getElementById('diagGenBtn');
  if(btn){btn.disabled=true;btn.textContent='Generating…';}
  DIAG.busy=true;
  const prev=document.getElementById('diagPreview');
  if(prev)prev.innerHTML='<div style="color:var(--gray-500);font-size:14px;padding:26px">⏳ Drawing the system schematic… this can take up to a minute</div>';
  let r;
  try{r=await api('POST','/api/diagram/generate',{quote:payload});}
  catch(e){r={error:'Could not reach the diagram service. Please try again.'};}
  DIAG.busy=false;
  if(r.error){
    if(prev)prev.innerHTML=`<div class="auth-err">${esc(r.error)}</div>`;
    if(btn){btn.disabled=false;btn.textContent=(DIAG.code?'🔄 Regenerate':'✨ Generate')+' with AI';}
    return;
  }
  DIAG.code=r.mermaid||'';
  renderDiagramModal();
  renderDiagPreview();
}

let _diagSeq=0;
async function renderDiagPreview(){
  const prev=document.getElementById('diagPreview');if(!prev)return;
  if(DIAG._pz){try{DIAG._pz.destroy();}catch(e){}DIAG._pz=null;}
  if(!DIAG.code){prev.innerHTML='<div style="color:var(--gray-500);font-size:14px">No diagram yet.</div>';return;}
  if(!diagMermaidReady()){prev.innerHTML='<div class="auth-err">Diagram renderer failed to load — check your internet connection and reload the page.</div>';return;}
  diagInitMermaid();
  try{
    const {svg}=await window.mermaid.render('diagSvg'+(++_diagSeq),DIAG.code);
    prev.style.display='block';
    prev.innerHTML=svg;
    const el=prev.querySelector('svg');
    if(el){el.style.maxWidth='100%';el.style.height='auto';}
    // Pan/zoom: scroll to zoom, drag to pan — big schematics don't fit a modal.
    // Needs a fixed-height box and explicit svg size; guarded so a pan-zoom
    // hiccup never breaks the preview itself.
    if(el&&typeof window.svgPanZoom!=='undefined'){
      try{
        prev.style.height='440px';
        el.style.maxWidth='none';el.style.width='100%';el.style.height='100%';
        DIAG._pz=window.svgPanZoom(el,{controlIconsEnabled:true,fit:true,center:true,minZoom:0.3,maxZoom:12,zoomScaleSensitivity:0.35});
      }catch(e){}
    }
  }catch(e){
    prev.innerHTML=`<div class="auth-err">The diagram code has a syntax error and can't be rendered.<br><span style="font-size:12px">${esc(String(e.message||e).slice(0,300))}</span></div>`;
    if(!DIAG.showCode){DIAG.showCode=true;renderDiagramModal();}
  }
}

// Quick-win: flip flowchart orientation. TD is mermaid's legacy alias for TB.
function diagToggleDirection(){
  if(!DIAG.code)return;
  DIAG.code=DIAG.code.replace(/^((?:flowchart|graph)\s+)(LR|RL|TB|TD|BT)/,(m,p,d)=>p+((d==='TB'||d==='TD')?'LR':'TB'));
  renderDiagramModal();
  renderDiagPreview();
}

// Quick-win: open the current code in the free Mermaid Live Editor
// (mermaid.live) — full editing with live preview, no login. The state rides
// in the URL hash as base64 JSON; UTF-8-safe encoding for symbols like ×/·.
function diagLiveEditorUrl(code){
  const state={code:code,mermaid:'{\n  "theme": "base"\n}',autoSync:true,updateDiagram:true};
  const json=JSON.stringify(state);
  const bytes=new TextEncoder().encode(json);
  let bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return 'https://mermaid.live/edit#base64:'+btoa(bin);
}
function openDiagLiveEditor(){
  if(!DIAG.code)return;
  try{window.open(diagLiveEditorUrl(DIAG.code),'_blank');}
  catch(e){alert('Could not open the Mermaid Live Editor.');}
}

// Returns a Promise<string|null> of a PNG data URL rendered at 2x for quality.
async function diagCodeToPng(code,scale=2){
  if(!code||!diagMermaidReady())return null;
  diagInitMermaid();
  const {svg}=await window.mermaid.render('diagPngSvg'+(++_diagSeq),code);
  // Parse intrinsic size from the SVG so the raster isn't blurry or clipped
  const tmp=document.createElement('div');
  tmp.style.cssText='position:absolute;left:-99999px;top:0';
  tmp.innerHTML=svg;document.body.appendChild(tmp);
  const el=tmp.querySelector('svg');
  let w=1200,h=800;
  try{
    const bb=el.getBBox();
    w=Math.ceil(bb.width+bb.x*2)||el.viewBox?.baseVal?.width||1200;
    h=Math.ceil(bb.height+bb.y*2)||el.viewBox?.baseVal?.height||800;
  }catch(e){
    w=el.viewBox?.baseVal?.width||1200;h=el.viewBox?.baseVal?.height||800;
  }
  el.setAttribute('width',w);el.setAttribute('height',h);
  // Inline external product photos as data URLs: an SVG rasterized through an
  // <img> element is forbidden from loading external resources, so photo nodes
  // would silently render blank in the PNG (and the proposal embed). Supabase
  // storage serves CORS '*' so fetch() works; any failure just leaves that
  // node photo-less rather than breaking the export.
  const extImgs=[...el.querySelectorAll('image')];
  await Promise.all(extImgs.map(async im=>{
    const href=im.getAttribute('href')||im.getAttribute('xlink:href')||'';
    if(!href||href.startsWith('data:'))return;
    try{
      const resp=await fetch(href,{mode:'cors'});
      const blob=await resp.blob();
      const durl=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob);});
      im.setAttribute('href',durl);im.removeAttribute('xlink:href');
    }catch(e){}
  }));
  const svgStr=new XMLSerializer().serializeToString(el);
  document.body.removeChild(tmp);
  const blob=new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const canvas=document.createElement('canvas');
    canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    return canvas.toDataURL('image/png');
  }finally{URL.revokeObjectURL(url);}
}

async function downloadDiagram(kind){
  if(!DIAG.code)return;
  const name=((A.activeQuote?.title||'diagram').replace(/[^\w\- ]+/g,'').trim().replace(/ +/g,'-')||'diagram')+'-schematic';
  try{
    if(kind==='svg'){
      diagInitMermaid();
      const {svg}=await window.mermaid.render('diagDlSvg'+(++_diagSeq),DIAG.code);
      const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.svg';a.click();URL.revokeObjectURL(a.href);
    }else{
      const png=await diagCodeToPng(DIAG.code);
      if(!png){alert('Could not render the diagram to PNG.');return;}
      const a=document.createElement('a');a.href=png;a.download=name+'.png';a.click();
    }
  }catch(e){alert('Download failed: the diagram code has a syntax error.');}
}

function saveDiagramToQuote(){

  o.diagram={code:DIAG.code,updated_at:new Date().toISOString()};
