<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QTcal AI — Quote Manager v1.0.1</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e3a5f'/%3E%3Ccircle cx='27' cy='27' r='15' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Cline x1='37' y1='37' x2='46' y2='46' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M46 14 L48 20 L54 22 L48 24 L46 30 L44 24 L38 22 L44 20 Z' fill='%23f59e0b'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a3c6e;--navy-dark:#0f2544;--navy-light:#dde8f7;--navy-mid:#a8c0e0;
  --green:#047857;--green-light:#d1fae5;--green-bright:#10b981;
  --amber:#b45309;--amber-light:#fef3c7;
  --red:#b91c1c;--red-light:#fee2e2;
  --gray-50:#f9fafb;--gray-100:#f0f2f5;--gray-200:#e2e6eb;--gray-300:#c8d0da;
  --gray-500:#5a6475;--gray-700:#2d3748;--gray-900:#0f172a;
  --white:#fff;--radius:8px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.10);--shadow:0 3px 10px rgba(0,0,0,.12);--shadow-lg:0 8px 28px rgba(0,0,0,.16);
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#e8edf5;color:var(--gray-900);font-size:15px;line-height:1.5}

/* ── Layout ── */
.shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;min-width:240px;background:var(--navy-dark);display:flex;flex-direction:column}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── Sidebar ── */
.sb-brand{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:10px}
.sb-logo{height:30px;object-fit:contain}
.sb-co{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px}
.sb-nav{flex:1;padding:10px 0;overflow-y:auto}
.sb-sec{font-size:11px;font-weight:700;color:rgba(255,255,255,.35);padding:14px 20px 5px;letter-spacing:.08em;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:10px;padding:11px 20px;cursor:pointer;color:rgba(255,255,255,.65);font-size:14px;font-weight:500;border-left:3px solid transparent;transition:all .15s}
.sb-badge{background:#f59e0b;color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;margin-left:auto}
.sb-item:hover{color:#fff;background:rgba(255,255,255,.08)}
.sb-item.active{color:#fff;background:rgba(255,255,255,.14);border-left-color:#60a5fa;font-weight:600}
.sb-icon{font-size:16px;width:20px;text-align:center}
.sb-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.1)}
.sb-user{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sb-avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.sb-uname{font-size:14px;font-weight:600;color:#fff}
.sb-urole{font-size:11px;color:rgba(255,255,255,.4)}
.sb-logout{background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:12px;font-family:inherit;padding:0}
.sb-logout:hover{color:#fff}
.sb-poweredby{font-size:10.5px;color:rgba(255,255,255,.32);margin-top:10px;letter-spacing:.02em}
.sb-poweredby-name{color:rgba(255,255,255,.5);font-weight:500}
.save-pill{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;display:inline-block;margin-top:6px}
.save-ok{background:var(--green-light);color:var(--green)}
.save-ing{background:var(--navy-light);color:var(--navy)}
.save-err{background:var(--red-light);color:var(--red)}

/* ── Topbar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:58px;background:var(--white);border-bottom:2px solid var(--navy-light);flex-shrink:0;box-shadow:var(--shadow-sm)}
.topbar-title{font-size:17px;font-weight:700;color:var(--navy)}
.topbar-right{display:flex;gap:8px;align-items:center}

/* ── Currency strip ── */
.cstrip{display:flex;align-items:center;gap:14px;padding:8px 24px;background:#f0f4fa;border-bottom:1px solid var(--navy-light);font-size:14px;flex-shrink:0;flex-wrap:wrap}
.cstrip-label{font-size:11px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.05em}
.cstrip select,.cstrip input[type=number]{padding:5px 10px;font-size:13px;border:1.5px solid var(--navy-mid);border-radius:var(--radius);font-family:inherit;color:var(--gray-900);background:var(--white)}
.cstrip input[type=number]{width:80px}
.tab-btns{display:flex;gap:4px}
.tab-btn{padding:5px 14px;font-size:13px;border-radius:6px;cursor:pointer;border:1.5px solid var(--navy-mid);background:var(--white);color:var(--navy);font-family:inherit;font-weight:600;transition:all .15s}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ── Content ── */
.content{flex:1;overflow-y:auto;padding:24px}

/* ── Auth ── */
.auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy-dark) 0%,var(--navy) 60%,#1d4ed8 100%);padding:20px}
.auth-card{background:var(--white);border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:var(--shadow-lg)}
.auth-logo{height:40px;object-fit:contain;margin-bottom:6px}
.auth-sub{font-size:13px;color:var(--gray-500);margin-bottom:24px}
.auth-title{font-size:22px;font-weight:700;color:var(--gray-900);margin-bottom:6px}
.auth-desc{font-size:14px;color:var(--gray-500);margin-bottom:22px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fld label{font-size:12px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.04em}
.fld input{padding:10px 12px;font-size:15px;border:1.5px solid var(--gray-200);border-radius:var(--radius);font-family:inherit;transition:border .15s}
.fld input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(26,60,110,.1)}
.auth-btn{width:100%;padding:12px;font-size:15px;font-weight:700;border-radius:var(--radius);border:none;background:var(--navy);color:#fff;cursor:pointer;font-family:inherit;transition:background .15s}
.auth-btn:hover{background:var(--navy-dark)}
.auth-link{text-align:center;margin-top:18px;font-size:14px;color:var(--gray-500)}
.auth-link a{color:var(--navy);font-weight:600;cursor:pointer}
.auth-err{background:var(--red-light);color:var(--red);padding:10px 14px;border-radius:var(--radius);font-size:14px;margin-bottom:14px;font-weight:500}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-size:14px;border-radius:var(--radius);cursor:pointer;border:1.5px solid var(--gray-300);background:var(--white);color:var(--gray-700);font-family:inherit;font-weight:500;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--gray-50);border-color:var(--navy-mid)}
.btn-navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-navy:hover{background:var(--navy-dark)}
.btn-red{background:var(--red-light);color:var(--red);border-color:#fca5a5}
.btn-red:hover{background:#fee2e2}
.btn-green{background:var(--green-light);color:var(--green);border-color:var(--green-bright)}
.btn-sm{padding:5px 12px;font-size:13px}

/* ── View toggle ── */
.vtoggle{display:flex;background:var(--gray-100);border:1.5px solid var(--navy-mid);border-radius:var(--radius);padding:2px;gap:2px}
.vtbtn{padding:5px 16px;font-size:13px;border-radius:6px;cursor:pointer;border:none;background:transparent;color:var(--gray-500);font-family:inherit;font-weight:600;transition:all .15s}
.vtbtn.active{background:var(--navy);color:#fff}

/* ── Dashboard ── */
.dash-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.mcard{background:var(--white);border:1.5px solid var(--gray-200);border-radius:12px;padding:18px;box-shadow:var(--shadow-sm)}
.mcard-label{font-size:12px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.mcard-val{font-size:28px;font-weight:800}
.mcard-val.navy{color:var(--navy)}
.mcard-val.green{color:var(--green)}
.mcard-val.amber{color:var(--amber)}
.mcard-sub{font-size:12px;color:var(--gray-500);margin-top:4px}
.filter-bar{display:flex;gap:10px;margin-bottom:20px}
.view-toggle{display:flex;border:1px solid var(--gray-200);border-radius:var(--radius);overflow:hidden;flex-shrink:0}
.tb-sep{width:1px;align-self:stretch;background:var(--gray-200);margin:2px 2px}
.more-wrap{position:relative;display:inline-block}
.more-panel{display:none;position:absolute;top:calc(100% + 4px);right:0;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:200px;z-index:400;overflow:hidden}
.more-panel.open{display:block}
.more-panel button{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 14px;font-size:13px;cursor:pointer;color:var(--gray-700,#334155)}
.more-panel button:hover{background:var(--gray-50,#f8fafc)}
.more-panel .mp-divider{height:1px;background:var(--gray-100);margin:4px 0}
.view-toggle button{background:#fff;border:none;padding:0 14px;font-size:15px;color:var(--gray-400);cursor:pointer;transition:background .15s,color .15s}
.view-toggle button:first-child{border-right:1px solid var(--gray-200)}
.view-toggle button.active{background:var(--navy,#1e3a5f);color:#fff}
.view-toggle button:not(.active):hover{background:var(--gray-50,#f8fafc)}
.quote-list{border:1px solid var(--gray-200);border-radius:var(--radius);overflow:hidden;background:#fff}
.qlist-hd,.qlist-row{display:grid;grid-template-columns:2fr 1.4fr 90px 100px 80px 130px 130px 130px;gap:10px;padding:11px 14px;align-items:center}
.qlist-hd{background:var(--navy,#1e3a5f);color:#fff;font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.qlist-row{border-top:1px solid var(--gray-100);cursor:pointer;font-size:13px;color:var(--gray-700,#334155)}
.qlist-row:hover{background:var(--gray-50,#f8fafc)}
.qlist-title{font-weight:600;color:var(--navy,#1e3a5f)}
.qlist-cust{color:var(--gray-500)}
.qlist-total{font-weight:600}
.qlist-gp{font-weight:600;color:var(--green)}
.qlist-actions{display:flex;gap:6px}
.search-inp{flex:1;padding:10px 14px;font-size:14px;border:1.5px solid var(--gray-200);border-radius:var(--radius);font-family:inherit;background:var(--white)}
.search-inp:focus{outline:none;border-color:var(--navy)}
.filter-sel{padding:9px 12px;font-size:14px;border:1.5px solid var(--gray-200);border-radius:var(--radius);font-family:inherit;background:var(--white)}

/* ── Quote cards ── */
.quote-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.qcard{background:var(--white);border:2px solid var(--gray-200);border-radius:12px;padding:20px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow-sm)}
.qcard:hover{border-color:var(--navy);box-shadow:var(--shadow);transform:translateY(-2px)}
.qcard-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.qcard-title{font-size:16px;font-weight:700;color:var(--gray-900)}
.qcard-customer{font-size:14px;color:var(--gray-500);margin-bottom:10px}
.qcard-meta{display:flex;gap:12px;font-size:13px;color:var(--gray-500);margin-bottom:14px}
.qcard-totals{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--gray-100)}
.qcard-total-label{font-size:12px;color:var(--gray-500);margin-bottom:3px}
.qcard-total-val{font-size:15px;font-weight:700;color:var(--navy)}
.qcard-actions{display:flex;gap:6px;margin-top:12px}
.sbadge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px}
.s-draft{background:var(--gray-100);color:var(--gray-500)}
.s-sent{background:var(--navy-light);color:var(--navy)}
.s-awarded{background:var(--green-light);color:var(--green)}
.s-lost{background:var(--red-light);color:var(--red)}
.s-healthy{background:var(--green-light);color:var(--green)}
.s-at_risk{background:var(--amber-light);color:var(--amber)}
.s-critical{background:var(--red-light);color:var(--red)}
.empty-state{text-align:center;padding:80px 20px}
.empty-icon{font-size:52px;margin-bottom:16px}
.empty-title{font-size:20px;font-weight:700;color:var(--gray-700);margin-bottom:8px}
.empty-sub{font-size:15px;color:var(--gray-500);margin-bottom:24px}

/* ── Quote header card ── */
.card{background:var(--white);border:1.5px solid var(--gray-200);border-radius:12px;padding:22px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.card-title{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px}
.field-grid{display:grid;gap:14px}
.g4{grid-template-columns:2fr 1fr 1fr 1fr}
.g2{grid-template-columns:1fr 1fr}
.fld2{display:flex;flex-direction:column;gap:5px}
.fld2 label{font-size:12px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.04em}
.fld2 input,.fld2 select{padding:9px 12px;font-size:14px;border:1.5px solid var(--gray-200);border-radius:var(--radius);font-family:inherit;transition:border .15s;width:100%}
.fld2 input:focus,.fld2 select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(26,60,110,.08)}

/* ── Option pills ── */
.opt-pills{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.opt-pill{padding:7px 20px;font-size:14px;border-radius:20px;cursor:pointer;border:2px solid var(--gray-300);background:var(--white);color:var(--gray-500);font-family:inherit;font-weight:600;transition:all .15s}
.opt-pill:hover{border-color:var(--navy);color:var(--navy)}
.opt-pill.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.opt-pill-add{padding:7px 16px;font-size:14px;border-radius:20px;cursor:pointer;border:2px dashed var(--navy-mid);background:var(--navy-light);color:var(--navy);font-family:inherit;font-weight:600}

/* ── Sections ── */
.section{margin-bottom:24px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-hd-l{display:flex;align-items:center;gap:10px}
.sec-bar{width:5px;height:28px;background:var(--navy);border-radius:3px}
.sec-name-inp{font-size:16px;font-weight:700;color:var(--navy);border:none;background:transparent;font-family:inherit;padding:0;min-width:150px}
.sec-name-inp:focus{outline:none;border-bottom:2px solid var(--navy)}
.sec-badge{font-size:12px;font-weight:600;color:var(--gray-500);background:var(--gray-100);padding:3px 10px;border-radius:10px}

/* ── Column headers ── */
.col-hd{display:grid;padding:9px 14px;background:var(--navy);border-radius:8px 8px 0 0;font-size:12px;font-weight:700;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.05em}
.col-hd.int{grid-template-columns:46px 28px 90px 130px 80px minmax(140px,1fr) 75px 85px 55px 70px 85px 45px 55px 95px 115px 128px 28px;min-width:1394px;font-size:10.5px;letter-spacing:.02em}
.col-hd.int div{padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid rgba(255,255,255,.15)}
.col-hd.int div:last-child{border-right:none}
.item-row.int>*{border-right:1px solid var(--gray-100)}
.item-row.int>*:last-child{border-right:none}
.col-hd.int.img{grid-template-columns:46px 28px 44px 90px 130px 80px minmax(140px,1fr) 75px 85px 55px 70px 85px 45px 55px 95px 115px 128px 28px;min-width:1438px}
.col-hd.cli{grid-template-columns:28px 90px 140px 1fr 60px 55px 95px 115px 28px}
.col-hd.cli.img{grid-template-columns:28px 44px 90px 140px 1fr 60px 55px 95px 115px 28px}
.col-hd div{padding:0 5px}
.grid-scroll{overflow-x:auto;overflow-y:hidden}

/* ── Item rows ── */
.items-wrap{background:var(--white);border:1.5px solid var(--gray-200);border-top:none;border-radius:0 0 10px 10px;overflow:hidden;margin-bottom:4px}
.item-row{display:grid;padding:9px 14px;align-items:start;border-bottom:1px solid var(--gray-100);transition:background .12s}
.item-row:last-child{border-bottom:none}
.item-row:hover{background:#f5f8ff}
.item-row.int{grid-template-columns:46px 28px 90px 130px 80px minmax(140px,1fr) 75px 85px 55px 70px 85px 45px 55px 95px 115px 128px 28px;min-width:1394px}
.item-row.int input[type=number]{padding:7px 5px;font-size:13px}
.item-row.int .icalc{font-size:13px}
.item-row.int.img{grid-template-columns:46px 28px 44px 90px 130px 80px minmax(140px,1fr) 75px 85px 55px 70px 85px 45px 55px 95px 115px 128px 28px;min-width:1438px}
.item-row.cli{grid-template-columns:28px 90px 140px 1fr 60px 55px 95px 115px 28px}
.item-row.cli.img{grid-template-columns:28px 44px 90px 140px 1fr 60px 55px 95px 115px 28px}
.item-row>*{padding:0 5px}
.inum{font-size:12px;color:var(--gray-300);font-weight:700;text-align:center;padding-top:10px}
.iinput{width:100%;padding:7px 8px;font-size:14px;border:1.5px solid transparent;border-radius:6px;font-family:inherit;color:var(--gray-900);background:transparent;transition:all .15s;resize:none;overflow:hidden;min-height:36px;line-height:1.4}
.pm-field-wrap{position:relative;width:100%}
.pm-field-wrap .pm-field-input{padding-right:26px}
.pm-search-btn{position:absolute;right:2px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:13px;padding:4px;line-height:1;opacity:.55;transition:opacity .15s}
.pm-search-btn:hover{opacity:1}
.iinput:hover{border-color:var(--gray-200);background:var(--white)}
.iinput:focus{outline:none;border-color:var(--navy);background:var(--white);box-shadow:0 0 0 3px rgba(26,60,110,.08)}
.iinput.editable-calc{background:var(--navy-light);color:var(--navy);font-weight:600;border-color:var(--navy-mid)}
.iinput.editable-calc:hover{background:#c8d8f0;border-color:var(--navy)}
.iinput.editable-calc:focus{background:var(--white);box-shadow:0 0 0 3px rgba(26,60,110,.12)}
.icalc{padding:7px 8px;font-size:14px;font-weight:700;text-align:right;border-radius:6px;white-space:nowrap;font-family:'Courier New',monospace}
.icalc.total{color:var(--navy);background:var(--navy-light);border:1px solid var(--navy-mid)}
.icalc.gp{color:var(--green);background:var(--green-light);border:1px solid #6ee7b7}
.icalc.cost{color:var(--gray-700);background:var(--gray-100);border:1px solid var(--gray-200)}
.idel{background:none;border:none;cursor:pointer;color:var(--gray-300);font-size:20px;padding:4px 0;transition:color .15s;text-align:center;width:100%;line-height:1}
.imove{display:flex;flex-direction:column;gap:1px;align-items:center;justify-content:center;height:100%}
.imove button{background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:11px;line-height:1;padding:2px 6px;transition:color .15s}
.imove button:hover:not(:disabled){color:var(--navy,#1e3a5f)}
.imove button:disabled{color:var(--gray-200);cursor:default}
.idrag{cursor:grab;color:var(--gray-300);font-size:13px;line-height:1;padding:1px 6px;user-select:none}
.idrag:active{cursor:grabbing}
.item-row.int.drag-ghost{opacity:.4}
.item-row.int.drag-over-top{box-shadow:inset 0 2px 0 0 var(--navy,#1e3a5f)}
.item-row.int.drag-over-bottom{box-shadow:inset 0 -2px 0 0 var(--navy,#1e3a5f)}
.idel:hover{color:var(--red)}

/* ── Grand strip ── */
.grand-strip{position:sticky;bottom:0;background:var(--navy);color:#fff;border-radius:12px;padding:14px 22px;display:flex;gap:20px;align-items:center;box-shadow:var(--shadow-lg);margin-top:10px;flex-wrap:wrap}
.gs-item{display:flex;flex-direction:column;gap:2px}
.gs-label{font-size:11px;font-weight:700;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.06em}
.gs-val{font-size:16px;font-weight:700}
.gs-val.big{font-size:22px}
.gs-sep{width:1px;height:38px;background:rgba(255,255,255,.2)}
.vat-controls{display:flex;align-items:center;gap:8px}
.vat-check{width:16px;height:16px;cursor:pointer;accent-color:#60a5fa}
.vat-inp{width:55px;padding:4px 7px;font-size:13px;border-radius:5px;border:none;text-align:center;background:rgba(255,255,255,.18);color:#fff;font-family:inherit;font-weight:600}
.vat-inp:focus{outline:none;background:rgba(255,255,255,.28)}
.vat-inp:disabled{opacity:.4}

/* ── Terms ── */
.term-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--gray-100)}
.term-n{font-size:13px;font-weight:700;color:var(--gray-400);min-width:26px;padding-top:10px}
.term-inp{flex:1;padding:8px 12px;font-size:14px;border:1.5px solid var(--gray-200);border-radius:var(--radius);font-family:inherit}
.term-inp:focus{outline:none;border-color:var(--navy)}
.term-del{background:none;border:none;cursor:pointer;color:var(--gray-300);font-size:20px;padding:6px;transition:color .15s}
.term-del:hover{color:var(--red)}

/* ── Summary ── */
.metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.tbar{display:flex;gap:20px;padding:14px 20px;background:var(--navy-light);border:1.5px solid var(--navy-mid);border-radius:10px;font-size:14px;flex-wrap:wrap}
.tbar strong{color:var(--navy)}
.cmp-card{background:var(--white);border:2px solid var(--gray-200);border-radius:12px;padding:20px}
.cmp-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:4px}
.cmp-sub{font-size:13px;color:var(--gray-500);margin-bottom:14px}
.cmp-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--gray-100);font-size:14px}
.cmp-grand{margin-top:12px;background:var(--navy);color:#fff;padding:11px 14px;border-radius:8px;display:flex;justify-content:space-between;font-weight:700;font-size:15px}

/* ── Vendor ── */
.vtbl{width:100%;border-collapse:collapse;font-size:14px}
.vtbl th{padding:10px 12px;text-align:left;font-size:12px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.04em;background:var(--gray-50);border-bottom:2px solid var(--gray-200)}
.vtbl td{padding:9px 12px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
.vtbl input,.vtbl select{padding:6px 9px;font-size:14px;border:1.5px solid var(--gray-200);border-radius:6px;font-family:inherit;background:var(--white)}
.vtbl input:focus,.vtbl select:focus{outline:none;border-color:var(--navy)}
.role-badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px}
.role-admin{background:var(--navy-light);color:var(--navy)}
.role-user{background:var(--gray-100);color:var(--gray-500)}
.team-member{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--gray-100)}
.team-avatar{width:42px;height:42px;border-radius:50%;background:var(--navy-light);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0}

.prod-thumb{width:36px;height:36px;border-radius:6px;border:1.5px solid var(--gray-200);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background:var(--white);font-size:15px;margin-top:2px}
.prod-thumb img{width:100%;height:100%;object-fit:contain}
.prod-thumb.empty{opacity:.45;border-style:dashed}
.prod-thumb.empty:hover{opacity:1;border-color:var(--navy)}
.img-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0}
.img-opt{border:1.5px solid var(--gray-200);border-radius:8px;overflow:hidden;cursor:pointer;background:var(--white);transition:all .15s}
.img-opt:hover{border-color:var(--navy);box-shadow:0 2px 8px rgba(26,60,110,.15)}
.img-opt img{width:100%;height:92px;object-fit:contain;background:#fff}
.img-src{font-size:10px;color:var(--gray-500);padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--gray-100)}
.prod-hd{display:grid;grid-template-columns:44px 100px 150px 100px 1fr 80px 70px 110px;padding:9px 12px;background:var(--navy);border-radius:8px 8px 0 0;font-size:12px;font-weight:700;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.05em}
.prod-hd div{padding:0 5px}
.prod-row{display:grid;grid-template-columns:44px 100px 150px 100px 1fr 80px 70px 110px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--gray-100);font-size:14px}
.prod-row.inactive{opacity:.5}
.prod-row>div{padding:0 5px;overflow:hidden}
.prod-row:hover{background:#f5f8ff}
.bom-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--gray-100)}
.bom-item:last-child{border-bottom:none}
.bom-check{margin-top:4px}

/* ── Modal ── */
.cust-search-btn{position:absolute;right:6px;bottom:6px;border:0;background:transparent;cursor:pointer;font-size:15px;padding:4px 6px;border-radius:6px;line-height:1}
.cust-search-btn:hover{background:var(--gray-100,#f0f2f5)}
.cust-drop{position:absolute;top:100%;left:0;right:0;background:var(--white);border:1.5px solid var(--gray-200);border-radius:8px;box-shadow:0 8px 24px rgba(15,37,68,.14);z-index:60;max-height:280px;overflow-y:auto;margin-top:4px}
.cust-opt{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--gray-100)}
.cust-opt:last-child{border-bottom:0}
.cust-opt:hover{background:#f0f5ff}
.cust-name{font-size:14px;font-weight:600;color:var(--navy-dark, #0f2544)}
.cust-sub{font-size:12px;color:var(--gray-500)}
.cust-src{padding:6px 12px;font-size:11px;color:var(--gray-500);background:var(--gray-100, #f0f2f5);border-radius:0 0 8px 8px}
/* Model-field autocomplete dropdown — position:fixed (JS-positioned via getBoundingClientRect)
   rather than absolute, since the item grid's scroll container has overflow-y:hidden and
   would otherwise clip it. */
.pm-drop{position:fixed;background:var(--white);border:1.5px solid var(--gray-200);border-radius:8px;box-shadow:0 8px 24px rgba(15,37,68,.18);z-index:1200;max-height:300px;overflow-y:auto;text-align:left}
.pm-opt{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--gray-100);display:flex;gap:8px;align-items:center}
.pm-opt:last-child{border-bottom:0}
.pm-opt:hover{background:#f0f5ff}
.pm-thumb{width:32px;height:32px;object-fit:contain;background:#fff;border:1px solid var(--gray-100);border-radius:4px;flex-shrink:0}
.pm-thumb.empty{display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--gray-400,#c2c8d4)}
.pm-txt{min-width:0}
.pm-model{font-size:13px;font-weight:600;color:var(--navy-dark,#0f2544);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-sub{font-size:11px;color:var(--gray-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-online{padding:9px 10px;cursor:pointer;font-size:12.5px;color:var(--navy);font-weight:600;background:var(--navy-light,#eef3fb)}
.pm-online:hover{background:#dfe9f9}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:var(--white);border-radius:14px;padding:32px;width:100%;max-width:440px;box-shadow:var(--shadow-lg)}
.modal-title{font-size:19px;font-weight:700;margin-bottom:6px}
.modal-sub{font-size:14px;color:var(--gray-500);margin-bottom:22px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* ── Print ── */
.print-doc{background:var(--white);border-radius:16px;border:1.5px solid var(--gray-200);padding:0;max-width:880px;margin:0 auto;font-family:Arial,sans-serif;box-shadow:var(--shadow);overflow:hidden}
.pcard-body{padding:32px 40px 40px}
.pdoc-hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--navy);padding-bottom:20px;margin-bottom:26px}
.pdoc-co{font-size:22px;font-weight:800;color:var(--navy)}
.pdoc-co-sub{font-size:13px;color:var(--gray-500);margin-top:5px;line-height:1.7}
.pdoc-meta-title{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:8px;text-align:right}
.pdoc-meta-row{font-size:13px;color:var(--gray-500);text-align:right;margin-bottom:3px}
.psec-title{background:var(--navy);color:#fff;padding:8px 14px;font-size:13px;font-weight:700}
.ptbl{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:22px}
.ptbl th{padding:7px 10px;font-weight:700;background:var(--navy-light);border:0.5px solid var(--navy-mid);font-size:11px;color:var(--navy)}
.ptbl td{padding:7px 10px;border:0.5px solid var(--gray-200)}
.ptbl tr:nth-child(even) td{background:var(--gray-50)}
.ptbl td.r{text-align:right}.ptbl td.c{text-align:center}
.ptotals{display:flex;justify-content:flex-end;gap:36px;padding:16px 22px;background:var(--navy-light);border:1.5px solid var(--navy-mid);border-radius:8px;margin-bottom:24px}
.ptotal-item{text-align:right}
.ptotal-label{font-size:12px;color:var(--gray-500);margin-bottom:4px;font-weight:600}
.ptotal-val{font-size:15px;font-weight:800;color:var(--navy)}
.ptotal-val.grand{font-size:21px}
.pfooter{margin-top:28px;padding-top:14px;border-top:1px solid var(--gray-200);font-size:11px;color:var(--gray-400);text-align:center}

/* ── Responsive: hamburger + off-canvas sidebar for tablet/phone ── */
.sb-toggle{display:none;background:none;border:none;font-size:22px;color:var(--navy);cursor:pointer;padding:4px 8px;line-height:1;flex-shrink:0}
.sb-overlay{display:none}

/* ── Contextual Help drawer ── */
.help-fab{position:fixed;bottom:22px;right:22px;width:46px;height:46px;border-radius:50%;background:#f59e0b;color:#1e3a5f;border:none;font-size:19px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-lg);z-index:400;display:flex;align-items:center;justify-content:center;line-height:1;transition:filter .15s}
.help-fab:hover{filter:brightness(1.06)}
.help-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:900;display:flex;justify-content:flex-end}
.help-drawer{width:440px;max-width:92vw;height:100%;background:var(--white);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:helpSlideIn .18s ease}
@keyframes helpSlideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.help-drawer-hd{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 20px 14px;border-bottom:1px solid var(--gray-200);flex-shrink:0}
.help-drawer-eyebrow{font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.06em}
.help-drawer-title{font-size:19px;font-weight:700;margin-top:2px}
.help-close{background:none;border:none;font-size:20px;color:var(--gray-500);cursor:pointer;padding:2px 4px;line-height:1}
.help-close:hover{color:var(--gray-900)}
.help-drawer-jump{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--gray-100);flex-wrap:wrap;flex-shrink:0}
.help-drawer-jump label{font-size:12px;color:var(--gray-500);font-weight:600;white-space:nowrap}
.help-drawer-jump select{flex:1;min-width:140px;padding:6px 8px;font-size:13px;border:1.5px solid var(--gray-200);border-radius:6px;font-family:inherit}
.help-follow-btn{font-size:11px;padding:4px 9px;border-radius:14px;border:1.5px solid var(--gray-200);background:#fff;cursor:pointer;color:var(--navy);white-space:nowrap}
.help-drawer-body{flex:1;overflow-y:auto;padding:18px 20px 36px}
.help-drawer-body h4{font-size:12.5px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.04em;margin:22px 0 8px}
.help-drawer-body h4:first-child{margin-top:0}
.help-drawer-body p{font-size:13.5px;line-height:1.55;color:var(--gray-700);margin:0 0 10px}
.help-drawer-body ul{margin:0 0 12px;padding-left:18px}
.help-drawer-body li{font-size:13.5px;line-height:1.55;color:var(--gray-700);margin-bottom:6px}
.help-drawer-body strong{color:var(--gray-900)}
.help-drawer-body .help-tip{background:var(--navy-light);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--navy);margin-top:2px;margin-bottom:12px}
@media (max-width:640px){.help-drawer{width:100%;max-width:100%}}
@media (max-width:900px){
  .shell{position:relative}
  .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:300;transform:translateX(-100%);transition:transform .25s ease;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .sb-toggle{display:inline-flex;align-items:center}
  .sb-overlay.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:250}
  .topbar{padding:0 12px;gap:8px}
  .topbar-title{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
  .topbar-right{overflow-x:auto;flex-wrap:nowrap;max-width:58vw;scrollbar-width:thin;padding-bottom:2px}
  .content{padding:14px}
  .cstrip{padding:8px 12px;gap:8px}
  /* Dense quote-editor pricing grid: kept intact (not restacked) since its cells
     are live-bound inputs the pricing engine reads by id — safer to let it
     scroll horizontally than risk breaking live calculations by restructuring
     cell markup. Still fully usable, just swipe/scroll sideways on a narrow screen.
     (.item-row.int/.int.img already scroll at their own min-width on all screen
     sizes — see base rules above; this just covers the simpler .cli/.cli.img view.) */
  .items-wrap{-webkit-overflow-scrolling:touch}
  .item-row.cli,.item-row.cli.img,.col-hd.cli,.col-hd.cli.img{min-width:900px}
  .sec-hd{flex-wrap:wrap;gap:6px}
}
@media (max-width:600px){
  .content{padding:10px}
  .card{padding:14px}
  .auth-card{padding:24px}
  .auth-shell{padding:12px}
}
/* The sticky totals bar (.grand-strip) stays pinned to the bottom of the
   editor while scrolling, which is helpful on normal screens but on short
   viewports (small/mini laptops) there isn't enough vertical room left —
   it ends up visually overlapping the last row or two of a section, and
   since it's an opaque, clickable-looking bar, those covered rows become
   unreachable. Isolated to short screens only, and only changes whether
   the bar sticks — no layout, column, or calculation changes, so normal
   desktop behavior (and the item grid's own horizontal scroll above) is
   untouched. */
@media (max-height:800px){
  .grand-strip{position:static}
}
@media (max-width:640px){
  .modal{width:100%;max-width:100%;max-height:88vh;overflow-y:auto;border-radius:12px}
  .modal-overlay{padding:0;align-items:flex-end}
}

/* ── Generic list grids (Products/Customers/Vendors/Platform companies)
   restack into labeled cards below tablet width ── */
@media (max-width:760px){
  .prod-hd{display:none}
  .prod-row{grid-template-columns:1fr!important;gap:0;padding:12px 14px;border:1px solid var(--gray-200);border-radius:10px;margin-bottom:10px;background:var(--white)}
  .prod-row>div{padding:4px 0!important;overflow:visible!important;white-space:normal!important}
  .prod-row>div[data-label]::before{content:attr(data-label);display:block;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--gray-500);letter-spacing:.05em;margin-top:4px}
}

@media print{
  @page{margin:12mm 10mm 15mm 10mm;size:A4}
  .sidebar,.topbar,.cstrip,.sec-hd>div:last-child,.opt-pills,.grand-strip,.btn,.idel,.term-del,.print-controls,.sb-overlay,.help-fab,.help-overlay{display:none!important}
  .shell{display:block;height:auto}.main{overflow:visible;height:auto}.content{padding:0;overflow:visible;height:auto}
  .print-doc{box-shadow:none;border:none;padding:0;max-width:100%;border-radius:14px;overflow:hidden}
  .pcard-body{padding:16px 22px 22px}
  .print-doc:not(:last-child){page-break-after:always}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table{page-break-inside:auto}
  tr{page-break-inside:avoid;page-break-after:auto}
  thead{display:table-header-group}
  tfoot{display:table-footer-group}
  img{max-width:100%}
  .print-footer-div{display:block !important}
}
</style>

<body>
<div id="app"></div>
<script>
// ── Config ──────────────────────────────────────────────────────────────────
const API='';
const STATUS_LABELS={draft:'Draft',sent:'Sent',awarded:'Awarded',lost:'Lost'};
const RATES={AED:1,USD:3.68,EUR:4.02,GBP:4.65,SAR:0.981,QAR:1.011};
const DEFAULT_TERMS=[
  'The items and quantities are as per the clients requirement',
  'Civil works, digging, tile removal etc. if needed will be Clients Scope',
  'The offered prices are for Supply and Installation of the above mentioned only.',
  'Any addition or change on BOQ, T&C, scope of work, payment terms, warranty, delivery and timelines will require a revised proposal',
  'Payment Terms: 25% Advance, 25% on Delivery, 50% on completion',
  'Delivery: 10-12 Weeks','Warranty: Three Years','Validity: 30 days from date of this Offer.',
];

// ── App state ────────────────────────────────────────────────────────────────
let _n=1; const uid=()=>'i'+ _n++;
const A={screen:'login',token:null,user:null,company:null,
  page:'dashboard',quotes:[],activeQuote:null,view:'internal',cur:'AED',rate:1,
  activeOpt:0,saveStatus:'',searchQ:'',filterStatus:'all',sbOpen:false,
  portfolio:null,ppFilters:{},ppDetail:null,ppDetailId:null,ppDetailTab:'overview'};
function toggleSidebar(){A.sbOpen=!A.sbOpen;draw();}
function parseJwt(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));}catch(e){return {};}}
function hasFeature(f){return !!(A.token&&(parseJwt(A.token).features||{})[f]);}
// Zoho's internal project_id isn't the human-readable number staff use --
// that's the cf_project_no custom field, stored separately as
// zoho_project_no. Display should always prefer it, falling back to the
// internal id only if the custom field hasn't been set in Zoho yet.
function zohoNo(o){return (o&&(o.zoho_project_no||o.zoho_project_id))||'';}
function projectsHTML(){
  const list=A.projects||null;
  const rows=(list||[]).map(p=>`<tr style="border-bottom:1px solid var(--gray-100)">
    <td style="padding:8px;font-weight:600">${esc(p.name)}</td>
    <td style="padding:8px">${esc(p.customer||'')}</td>
    <td style="padding:8px">${esc(p.site_location||'')}</td>
    <td style="padding:8px"><select class="iinput" onchange="updateProjectStatus('${p.id}',this.value)">
      ${['active','on_hold','completed','cancelled'].map(s=>`<option value="${s}" ${p.status===s?'selected':''}>${s.replace('_',' ')}</option>`).join('')}
    </select></td>
    <td style="padding:8px">${esc(p.po_number||'')}</td>
    <td style="padding:8px">${p.zoho_project_id?`<span style="color:#16a34a;font-weight:600" title="Linked to Zoho Books">&#10003; Zoho</span>`:`<span style="color:var(--gray-500)">—</span>`}</td>
    <td style="padding:8px;text-align:right"><button class="btn btn-green" style="font-size:11px;padding:3px 8px;font-weight:700;margin-right:6px" onclick="requestFeedback('${p.id}')" title="Generate a client feedback link">Request Feedback</button><button class="idel" onclick="deleteProject('${p.id}')" title="Delete project">✕</button></td>
  </tr>`).join('');
  return `<div style="padding:24px">
    <h2 style="margin:0 0 16px">Projects</h2>
    <div style="background:#fff;border-radius:10px;padding:16px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.06)">
      <div style="display:grid;grid-template-columns:2fr 2fr 2fr 1fr auto;gap:10px">
        <input class="iinput" id="prjName" placeholder="Project name *">
        <input class="iinput" id="prjCustomer" placeholder="Customer">
        <input class="iinput" id="prjSite" placeholder="Site / location">
        <input class="iinput" id="prjPo" placeholder="PO number">
        <button class="btn btn-navy" onclick="saveNewProject()">+ Add project</button>
      </div>
    </div>
    <div style="background:#fff;border-radius:10px;overflow:auto;box-shadow:0 1px 3px rgba(0,0,0,.06)">
      ${list===null?`<div style="padding:22px;color:var(--gray-500)">Loading…</div>`
      :!list.length?`<div style="padding:22px;color:var(--gray-500)">No projects yet — add your first one above.</div>`
      :`<table style="width:100%;border-collapse:collapse;font-size:14px">
        <thead><tr style="text-align:left;border-bottom:1px solid var(--gray-200)">
          <th style="padding:8px">Name</th><th style="padding:8px">Customer</th><th style="padding:8px">Site</th><th style="padding:8px">Status</th><th style="padding:8px">PO</th><th style="padding:8px">Zoho</th><th style="padding:8px"></th>
        </tr></thead><tbody>${rows}</tbody></table>`}
    </div>
  </div>`;
}
async function loadProjectsPage(){
  const r=await api('GET','/api/projects');
  if(r.error){A.projects=[];alert(r.error);}else{A.projects=r.projects||[];}
  draw();
}
async function saveNewProject(){
  const name=(document.getElementById('prjName')?.value||'').trim();
  if(!name){alert('Project name is required');return;}
  const body={name,customer:(document.getElementById('prjCustomer')?.value||'').trim(),site_location:(document.getElementById('prjSite')?.value||'').trim(),po_number:(document.getElementById('prjPo')?.value||'').trim()};
  const r=await api('POST','/api/projects',body);
  if(r.error){alert(r.error);return;}
  A.projects=null;draw();loadProjectsPage();
}
async function updateProjectStatus(id,status){
  const r=await api('PUT','/api/projects/'+id,{status});
  if(r.error)alert(r.error);
}
async function createZohoProject(id){

const fmtPct100=n=>(isNaN(n)?0:n).toFixed(1)+'%';
function healthBadge(status){

async function loadPortfolioPage(){
  const qs=new URLSearchParams();
  Object.entries(A.ppFilters||{}).forEach(([k,v])=>{if(v)qs.set(k,v);});
  const r=await api('GET','/api/project-performance?'+qs.toString());
  if(r.error){A.portfolio={kpis:{},projects:[]};alert(r.error);}else{A.portfolio=r;}
  draw();

async function ppSyncAll(){
  // A big portfolio can't be synced in one request without risking a
  // timeout (see api/projects.py) -- the backend processes a time-boxed
  // batch per call and reports has_more, so keep calling until it's done.
  await ppRunSyncLoop({});
}
async function ppSyncSelected(){
  const raw=(document.getElementById('ppZohoIdsInp')?.value||'').trim();
  if(!raw){alert('Enter one or more Zoho Project IDs, comma-separated (e.g. from the Project No column)');return;}
  const ids=raw.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
  const r=await ppRunSyncLoop({zoho_project_ids:ids});
  if(r&&r.zoho_import&&(r.zoho_import.errors||[]).length)console.warn('Zoho import issues:',r.zoho_import.errors);
}
async function ppSyncRange(){
  const from=(document.getElementById('ppZohoNoFrom')?.value||'').trim();
  const to=(document.getElementById('ppZohoNoTo')?.value||'').trim();
  if(!from&&!to){alert('Enter a Project No to sync from and/or to (e.g. PRJ100000 to PRJ100010)');return;}
  const r=await ppRunSyncLoop({zoho_project_no_from:from||null,zoho_project_no_to:to||null});
  if(r&&r.zoho_import&&(r.zoho_import.errors||[]).length)console.warn('Zoho import issues:',r.zoho_import.errors);
}
async function ppRunSyncLoop(baseBody){
  const btn=document.getElementById('ppSyncBtn');
  const origLabel=btn?btn.textContent:'';
  if(btn)btn.disabled=true;
  let more=true, first=true, done=0, loops=0, last=null;
  while(more&&loops<50){
    loops++;
    const body=first?baseBody:{...baseBody,skip_import:true};
    const r=await api('POST','/api/pp-sync/run', body);
    last=r;
    if(r.error){alert(r.error);break;}
    done+=(r.projects_synced||0);
    more=!!r.has_more;
    if(btn)btn.textContent=more?`🔄 Syncing… (${done} done, ${r.remaining} left)`:'🔄 Sync Now';
    first=false;
  }
  if(btn){btn.disabled=false;btn.textContent=origLabel;}
  A.portfolio=null;draw();loadPortfolioPage();
  return last;
}

// ── Calculations ─────────────────────────────────────────────────────────────
function calcItem(it){
  const cad=it.cost*(1-(it.disc||0)/100)*(1-(it.discAdd||0)/100);
  const pct=it.margin||0.2;
  const pt=A.activeQuote?.pricing_type||'markup';
  const up=Math.round(pt==='margin'?cad/(1-Math.min(0.95,Math.max(0,pct))):cad*(1+pct));
  return{cad,up,tp:up*(it.qty||1),tgp:(up-cad)*(it.qty||1),tc:cad*(it.qty||1)};
}
function liveCalc(el){
  const si=+el.dataset.si,ii=+el.dataset.ii,field=el.dataset.field;
  const it=sec(si)?.items?.[ii];if(!it)return;
  let v=parseFloat(el.value);if(isNaN(v))v=0;
  if(field==='cost')it.cost=v;
  else if(field==='costusd'){it.costUsd=v;it.cost=+(v*(A.rate||1)).toFixed(2);}
  else if(field==='disc')it.disc=v;
  else if(field==='discadd')it.discAdd=v;
  else if(field==='margin')it.margin=v/100;
  else if(field==='qty')it.qty=v||1;
  else if(field==='unitprice'){
    const cad=it.cost*(1-(it.disc||0)/100)*(1-(it.discAdd||0)/100);
    const pt=A.activeQuote?.pricing_type||'markup';
    if(cad<=0){/* keep existing % — nothing sensible to back-solve from a zero cost */}
    else if(pt==='margin')it.margin=Math.max(0,Math.min(0.95,1-(cad/v)));
    else it.margin=Math.max(0,(v/cad)-1);
  }
  schedSave();
  updateRowCalc(si,ii,el);
}
// Patches just this row's computed cells + the grand-totals strip, without a full
// re-render — keeps focus/cursor intact so typing across multiple fields (Disc%,
// Add.Disc%, Markup% etc) recalculates live instead of only on blur.
function updateRowCalc(si,ii,activeEl){
  const it=sec(si)?.items?.[ii];if(!it)return;
  const c=calcItem(it);
  const setVal=(id,val)=>{const el=document.getElementById(id);if(el&&el!==activeEl)el.value=val;};
  const setText=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val;};
  setVal(`cost-${si}-${ii}`,it.cost);
  setVal(`unitprice-${si}-${ii}`,c.up);
  const o=opt();
  setText(`vat-${si}-${ii}`,o&&o.vatEnabled?fmtC(c.tp*(o.vatRate||5)/100):'—');
  setText(`total-${si}-${ii}`,fmtC(c.tp));
  if(o){
    const T=calcOpt(o);
    setText('gsSubtotal',fmtC(T.ts));
    setText('gsCost',fmtC(T.tc));
    setText('gsGP',fmtC(T.tg));
    setText('gsMargin',fmtP(T.margin));
    setText('gsVat',T.vatEnabled?fmtC(T.vat):'—');
    setText('gsGrand',fmtC(T.grand));
  }
}
function calcOpt(opt){
  if(!opt)return{ts:0,tc:0,tg:0,vat:0,grand:0,margin:0,vatEnabled:true,vatRate:5};
  let ts=0,tc=0,tg=0;
  (opt.sections||[]).forEach(s=>(s.items||[]).forEach(it=>{
    const c=calcItem(it);ts+=c.tp;tc+=c.tc;tg+=c.tgp;
  }));
  const vr=(opt.vatEnabled?(opt.vatRate||5):0)/100;
  const vat=ts*vr;
  return{ts,tc,tg,vat,vatRate:opt.vatRate||5,vatEnabled:!!opt.vatEnabled,grand:ts+vat,margin:ts>0?tg/ts:0};
}

// ── Unit price back-calculation ───────────────────────────────────────────────
function onUnitPriceChange(si,ii,newUp){
  const item=opt().sections[si].items[ii];
  const cad=item.cost*(1-(item.disc||0)/100);
  if(newUp>0&&cad>=0){
    const nm=cad>0?Math.max(0,Math.min(0.99,1-(cad/newUp))):0;
    item.margin=parseFloat(nm.toFixed(4));
  }
  schedSave();draw();
}

// ── API ──────────────────────────────────────────────────────────────────────
async function api(method,path,body,_retried){
  // AUTH-002: credentials:'same-origin' so the httpOnly sq_refresh cookie
  // (set only on /api/auth/*) actually gets sent/received by the browser.
  const o={method,headers:{'Content-Type':'application/json'},credentials:'same-origin'};
  if(A.token)o.headers['Authorization']='Bearer '+A.token;
  if(body)o.body=JSON.stringify(body);
  let r;
  try{
    r=await fetch(API+path,o);
  }catch(e){
    return {error:'Network error — could not reach the server. '+(e&&e.message||'')};
  }
  // AUTH-002: the access token is short-lived (1hr) now instead of 30 days,
  // so a 401 mid-session is expected/routine, not exceptional. Silently
  // trade the httpOnly refresh cookie for a new access token and retry the
  // original call once, instead of surfacing an error or booting the user
  // back to the login screen. Excludes the refresh/login endpoints
  // themselves to avoid recursion.
  if(r.status===401&&!_retried&&path!=='/api/auth/refresh'&&path!=='/api/auth/login'){
    const ref=await api('POST','/api/auth/refresh');
    if(ref&&ref.token){
      A.token=ref.token;A.user=ref.user;A.company=ref.company;
      return api(method,path,body,true);
    }
    A.token=null;A.user=null;A.company=null;A.screen='login';draw();
    return {error:'Session expired. Please sign in again.'};
  }
  let text='';
  try{
    text=await r.text();
  }catch(e){
    return {error:'Server error (status '+r.status+'): could not read the response.'};
  }
  if(!text)return {};
  try{
    return JSON.parse(text);
  }catch(e){
    // Response wasn't JSON at all -- almost always a Vercel timeout/error
    // page (HTML) rather than the API actually responding. Surface enough
    // of it to diagnose instead of throwing and leaving callers stuck.
    return {error:'Server error (status '+r.status+'): '+text.slice(0,200)};
  }
}

// AUTH-002: the access token now lives only in memory (A.token), never in
// localStorage -- the long-lived side of the session is the httpOnly
// sq_refresh cookie the server sets, which JS can't read even if it wanted
// to. That's what checkAuth()/boot() calls on page load to get a fresh
// access token back into memory without ever having persisted it client-side.
function setAuth(r){A.token=r.token;A.user=r.user;A.company=r.company;A.screen='app';}
function doLogout(){
  api('POST','/api/auth/logout'); // best-effort server-side revoke; don't block the UI on it
  A.token=null;A.user=null;A.company=null;A.quotes=[];A.screen='login';draw();
}
async function checkAuth(){
  // AUTH-002: no access token is ever persisted client-side, so there's
  // nothing in A.token to check on a fresh page load/refresh. Instead,
  // always attempt a refresh first -- the httpOnly sq_refresh cookie (if
  // there's a still-valid, non-revoked session) gets sent automatically,
  // and this returns a fresh short-lived access token straight into memory.
  const r=await api('POST','/api/auth/refresh');
  if(r.error||!r.token){A.screen='login';draw();return;}
  A.token=r.token;A.user=r.user;A.company=r.company;A.screen='app';
  if(A.user&&A.user.is_platform_admin){A.page='platform';draw();return;}
  await loadQuotes();draw();
}

async function ppCreateProjectFromQuote(wonOptionIndex){

    if(r.needs_won_option_index){
      const labels=(r.options||[]).map(o=>`${o.index+1}. ${o.label}`).join('\n');
      const pick=prompt(`This quote has more than one pricing option. Which one was awarded?\n${labels}\n\nEnter the option number:`);
      const idx=parseInt(pick,10)-1;
      if(pick!==null&&!isNaN(idx)&&idx>=0){A.ppCreating=false;return ppCreateProjectFromQuote(idx);}
      return;
    }
    if(r.error){alert(r.error);return;}
    if(r.quote){A.activeQuote.project_id=r.quote.project_id;const i=A.quotes.findIndex(q=>q.id===A.activeQuote.id);if(i>=0)A.quotes[i]=r.quote;}

  }finally{
    A.ppCreating=false;
    draw();
  }
}

async function ppLinkZoho(projectId){

async function fetchSnapshot(e){
  const qid=A.activeQuote.id;
  const r=e.kind==='review'?await api('GET','/api/quotes/'+qid+'/versions/'+e.id):await api('GET','/api/quotes/'+qid+'/customer-sends/'+e.id);
  if(r.error)return{error:r.error};
  const snap=e.kind==='review'?r.version:r.send;
  if(!snap||!snap.quote_data)return{error:'This version has no saved content snapshot (it predates version comparison being added).'};
  return{snap};
}
async function runCompare(){
  const body=document.getElementById('cmpBody');if(!body)return;
  const entries=A._cmpEntries||[];
  const ai=+document.getElementById('cmpSelA').value, bi=+document.getElementById('cmpSelB').value;
  const ea=entries[ai],eb=entries[bi];
  if(!ea||!eb)return;
  if(ai===bi){body.innerHTML='<div style="text-align:center;padding:20px;color:var(--gray-500)">Pick two different versions to compare.</div>';return;}
  body.innerHTML='<div style="text-align:center;padding:20px;color:var(--gray-500)">Loading…</div>';
  const [ra,rb]=await Promise.all([fetchSnapshot(ea),fetchSnapshot(eb)]);
  if(ra.error||rb.error){body.innerHTML='<div class="auth-err">'+esc(ra.error||rb.error)+'</div>';return;}
  body.innerHTML=renderVersionDiff(ea,ra.snap,eb,rb.snap);
}

function renderVersionDiff(ea,snapA,eb,snapB){
  let html=`<div style="display:flex;gap:10px;margin-bottom:14px">
    <div style="flex:1;background:#f7f9fc;border-radius:8px;padding:10px 14px">
      <div style="font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase">Version A</div>
      <div style="font-weight:700">${esc(ea.label)}</div>
      <div style="font-size:12px;color:var(--gray-500)">${ea.date?new Date(ea.date).toLocaleString():''}</div>
    </div>
    <div style="flex:1;background:#f7f9fc;border-radius:8px;padding:10px 14px">
      <div style="font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase">Version B</div>
      <div style="font-weight:700">${esc(eb.label)}</div>
      <div style="font-size:12px;color:var(--gray-500)">${eb.date?new Date(eb.date).toLocaleString():''}</div>
    </div>
  </div>`;

  html+=`<table style="width:100%;border-collapse:collapse;margin-bottom:16px">
    <thead><tr><th style="text-align:left;padding:6px 10px;font-size:11px;color:var(--gray-500);text-transform:uppercase">Field</th>
    <th style="text-align:left;padding:6px 10px;font-size:11px;color:var(--gray-500);text-transform:uppercase">A</th>
    <th style="text-align:left;padding:6px 10px;font-size:11px;color:var(--gray-500);text-transform:uppercase">B</th></tr></thead><tbody>`
    +cmpFieldRow('Title',snapA.title,snapB.title)
    +cmpFieldRow('Customer',snapA.customer,snapB.customer)
    +cmpFieldRow('Currency',snapA.currency,snapB.currency)
    +`</tbody></table>`;

  const optsA=snapA.quote_data||[], optsB=snapB.quote_data||[];
  const optIds=optsA.map(o=>o.id);
  optsB.forEach(o=>{if(!optIds.includes(o.id))optIds.push(o.id);});
  optIds.forEach(oid=>{
    const oa=optsA.find(o=>o.id===oid), ob=optsB.find(o=>o.id===oid);
    const label=(oa||ob).label||'Option';
    if(!oa||!ob){
      html+=`<div class="card" style="border-left:4px solid ${oa?'#e05252':'#2ea36c'}">
        <div style="font-weight:700">${esc(label)} — ${oa?'removed in B':'added in B'}</div>
      </div>`;
      return;
    }
    html+=cmpOptionHTML(label,oa,ob);
  });

  html+=cmpTermsHTML(snapA.terms_data||[],snapB.terms_data||[]);
  html+=cmpVendorHTML(snapA.vendor_data||[],snapB.vendor_data||[]);
  return html;
}
function cmpOptionHTML(label,oa,ob){
  const Ta=calcOpt(oa), Tb=calcOpt(ob);
  let html=`<div class="card"><div class="card-title">${esc(label)}</div>
    <table style="width:100%;border-collapse:collapse;margin-bottom:10px"><tbody>`
    +cmpFieldRow('VAT',oa.vatEnabled?(oa.vatRate||5)+'%':'Off',ob.vatEnabled?(ob.vatRate||5)+'%':'Off')
    +cmpFieldRow('Subtotal',fmt(Ta.ts),fmt(Tb.ts))
    +cmpFieldRow('Grand total',fmt(Ta.grand),fmt(Tb.grand))
    +cmpFieldRow('Margin',fmtP(Ta.margin),fmtP(Tb.margin))
    +`</tbody></table>`;

  const secIds=(oa.sections||[]).map(s=>s.id);
  (ob.sections||[]).forEach(s=>{if(!secIds.includes(s.id))secIds.push(s.id);});
  secIds.forEach(sid=>{
    const sa=(oa.sections||[]).find(s=>s.id===sid);

    const descChanged=ia.desc!==ib.desc;
    rows+=`<tr style="${changed?'background:#fffbf2':''}">
      <td style="padding:4px 6px;font-size:12px;${itemChanged?'background:#ffe3b3':''}">${esc(ia.brand)} ${esc(ia.model)}${itemChanged?'<div style="font-size:11px;color:#9a5b0f">→ '+esc(ib.brand)+' '+esc(ib.model)+'</div>':''}</td>
      <td style="padding:4px 6px;font-size:12px;${descChanged?'background:#ffe3b3':''}">${esc(ia.desc||'')}${descChanged?'<div style="font-size:11px;color:#9a5b0f">→ '+esc(ib.desc||'')+'</div>':''}</td>`
      +cmpPairTd(ia.qty||1,ib.qty||1,String(ia.qty||1)!==String(ib.qty||1),'center')
      +cmpPairTd(fmt(ia.cost),fmt(ib.cost),String(ia.cost??0)!==String(ib.cost??0))
      +cmpPairTd((ia.disc||0)+'%',(ib.disc||0)+'%',String(ia.disc||0)!==String(ib.disc||0),'center')
      +cmpPairTd(fmtP(ia.margin||0),fmtP(ib.margin||0),String(ia.margin||0)!==String(ib.margin||0),'center')
      +cmpPairTd(fmt(cA.up),fmt(cB.up),cA.up!==cB.up)
      +cmpPairTd(fmt(cA.tp),fmt(cB.tp),cA.tp!==cB.tp)
      +`</tr>`;

    <th style="text-align:left;font-size:11px;color:var(--gray-500);padding:4px 6px">Item</th>
    <th style="text-align:left;font-size:11px;color:var(--gray-500);padding:4px 6px">Description</th>

    <th style="font-size:10px;color:var(--gray-500);padding:2px 6px;border-left:1px solid var(--gray-200)">Cost A</th><th style="font-size:10px;color:var(--gray-500);padding:2px 6px">Cost B</th>
    <th style="font-size:10px;color:var(--gray-500);padding:2px 6px;border-left:1px solid var(--gray-200)">Disc A</th><th style="font-size:10px;color:var(--gray-500);padding:2px 6px">Disc B</th>
    <th style="font-size:10px;color:var(--gray-500);padding:2px 6px;border-left:1px solid var(--gray-200)">Margin A</th><th style="font-size:10px;color:var(--gray-500);padding:2px 6px">Margin B</th>
    <th style="font-size:10px;color:var(--gray-500);padding:2px 6px;border-left:1px solid var(--gray-200)">Unit A</th><th style="font-size:10px;color:var(--gray-500);padding:2px 6px">Unit B</th>
    <th style="font-size:10px;color:var(--gray-500);padding:2px 6px;border-left:1px solid var(--gray-200)">Total A</th><th style="font-size:10px;color:var(--gray-500);padding:2px 6px">Total B</th>
  </tr></thead>`;
  if(!sectionChanged){
    return `<details style="margin-top:6px"><summary style="font-size:12px;color:var(--gray-500);cursor:pointer;padding:4px 0">${esc(sa.name)} — no changes</summary>
      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:760px">${thead}<tbody>${rows}</tbody></table></div></details>`;
  }
  return `<div style="margin-top:10px">
    <div style="font-weight:600;font-size:13px;margin-bottom:4px">${esc(sa.name)}${sa.name!==sb.name?' → '+esc(sb.name):''}</div>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:760px">
      ${thead}

function cmpTermsHTML(ta,tb){
  const max=Math.max(ta.length,tb.length);
  let rows='';
  for(let i=0;i<max;i++){
    const a=ta[i],b=tb[i];
    if(a===b)continue;
    rows+=`<tr><td style="padding:5px 8px;font-size:12px;width:24px;color:var(--gray-500)">${i+1}.</td>
      <td style="padding:5px 8px;font-size:12px;${a==null?'':'background:#fdeceb'}">${a==null?'<span style="color:var(--gray-400)">—</span>':esc(a)}</td>
      <td style="padding:5px 8px;font-size:12px;${b==null?'':'background:#e9f9ef'}">${b==null?'<span style="color:var(--gray-400)">—</span>':esc(b)}</td>
    </tr>`;
  }
  if(!rows)return '';
  return `<div class="card"><div class="card-title">Terms & Conditions — changes</div>
    <table style="width:100%;border-collapse:collapse">${rows}</table></div>`;
}
function cmpVendorHTML(va,vb){
  const ids=va.map(v=>v.id);
  vb.forEach(v=>{if(!ids.includes(v.id))ids.push(v.id);});
  let rows='';
  ids.forEach(id=>{
    const a=va.find(v=>v.id===id), b=vb.find(v=>v.id===id);
    if(!a||!b){const v=a||b;rows+=`<tr style="background:${a?'#fdeceb':'#e9f9ef'}"><td colspan="3" style="padding:5px 8px;font-size:12px">${a?'− Removed:':'+ Added:'} ${esc(v.vendor)}</td></tr>`;return;}
    if(a.vendor===b.vendor&&a.payable===b.payable&&a.status===b.status)return;
    rows+=`<tr style="background:#fff7ed">
      <td style="padding:5px 8px;font-size:12px">${esc(a.vendor)}${a.vendor!==b.vendor?' → '+esc(b.vendor):''}</td>
      <td style="padding:5px 8px;font-size:12px;text-align:right">${fmt(a.payable)}${a.payable!==b.payable?' → '+fmt(b.payable):''}</td>
      <td style="padding:5px 8px;font-size:12px">${esc(a.status)}${a.status!==b.status?' → '+esc(b.status):''}</td>
    </tr>`;
  });
  if(!rows)return '';
  return `<div class="card"><div class="card-title">Vendors — changes</div>
    <table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;font-size:11px;color:var(--gray-500);padding:4px 8px">Vendor</th><th style="text-align:right;font-size:11px;color:var(--gray-500);padding:4px 8px">Payable</th><th style="text-align:left;font-size:11px;color:var(--gray-500);padding:4px 8px">Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

async function openQuoteForReview(qid){
  const r=await api('GET','/api/quotes/'+qid);
  if(r.error){alert(r.error);return;}
  const vr=await api('GET','/api/quotes/'+qid+'/versions');
  const latestMeta=(vr.versions||[]).find(v=>v.status==='pending');
  if(!latestMeta){alert('No pending version found for this quote.');return;}
  // Pull the full submitted snapshot (quote_data/terms_data/vendor_data) so
  // the reviewer sees exactly what was sent for review — not any live edits
  // made since. Live quote only supplies read-only metadata (currency etc).
  const vfull=await api('GET','/api/quotes/'+qid+'/versions/'+latestMeta.id);
  if(vfull.error){alert(vfull.error);return;}
  const v=vfull.version;
  A.activeQuote={...r.quote,
    title:v.title||r.quote.title,customer:v.customer||r.quote.customer,
    quote_data:v.quote_data,terms_data:v.terms_data,vendor_data:v.vendor_data};
  A.cur=A.activeQuote.currency||'AED';A.rate=A.activeQuote.exchange_rate||1;A.activeOpt=0;
  A.reviewMode={qid,vid:v.id,vnum:v.version_number,reviewers:v.reviewers||[]};
  A.page='print';
  draw();
  showReviewDecisionModal(qid,v.id,v.version_number);
}
function exitReviewMode(){
  A.reviewMode=null;A.activeQuote=null;A.page='reviewQueue';draw();
}
function showReviewDecisionModal(qid,vid,vnum){
  const reviewers=A.reviewMode?.reviewers||[];
  const isAssigned=reviewers.some(rv=>rv.user_id===A.user?.id);
  const isAdmin=A.user?.role==='admin';
  const reviewersHTML=reviewers.length?('<div style="margin:10px 0"><div style="font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;margin-bottom:4px">Reviewers on this version</div>'+
    reviewers.map(rv=>{const rm=REVIEW_STATUS_STYLE[rv.status]||{};return '<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:2px 0">'+
      '<span>'+esc(rv.name||rv.email||'')+(rv.user_id===A.user?.id?' (you)':'')+'</span>'+
      '<span style="background:'+(rm.bg||'#eee')+';color:'+(rm.c||'#555')+';font-weight:700;padding:1px 8px;border-radius:10px;font-size:11px">'+(rm.t||rv.status)+'</span></div>';}).join('')+
    '</div>'):'';
  const adminActionsHTML=isAdmin?(
    '<div style="margin-top:14px;padding-top:14px;border-top:1px dashed var(--gray-200)">'+
    '<div style="font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;margin-bottom:8px">Admin override</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
      '<button class="btn btn-sm" onclick="adminReassignReviewers(\''+qid+'\',\''+vid+'\')">🔁 Reassign reviewers</button>'+
      '<button class="btn btn-sm" onclick="adminCancelReview(\''+qid+'\',\''+vid+'\')">✕ Cancel review</button>'+
      '<button class="btn btn-sm btn-red" onclick="adminDecide(\''+qid+'\',\''+vid+'\',\'changes_requested\')">Force request changes</button>'+
      '<button class="btn btn-sm btn-navy" onclick="adminDecide(\''+qid+'\',\''+vid+'\',\'approved\')">Force approve</button>'+
    '</div></div>'
  ):'';
  document.body.insertAdjacentHTML('beforeend','<div class="modal-overlay" id="rdOverlay" onclick="if(event.target===this)closeReviewDecisionModal()">'+
    '<div class="modal" style="max-width:520px">'+
    '<div class="modal-title">Review version '+vnum+'</div>'+
    '<div class="modal-sub">'+esc(A.activeQuote?.title||'')+(A.activeQuote?.customer?' · '+esc(A.activeQuote.customer):'')+'</div>'+
    reviewersHTML+
    '<div style="margin:14px 0"><a href="#" onclick="closeReviewDecisionModal();return false" style="font-size:13px">Close and view full print preview →</a></div>'+
    '<label style="font-size:13px;font-weight:600;color:var(--gray-500);display:block;margin-bottom:6px">Comment (optional on approve, required if requesting changes)</label>'+
    '<textarea id="reviewComment" class="iinput" style="width:100%;min-height:80px;border:1.5px solid var(--gray-200);border-radius:8px;padding:10px;box-sizing:border-box"></textarea>'+
    (isAssigned?('<div class="modal-actions">'+
      '<button class="btn" onclick="closeReviewDecisionModal()">Cancel</button>'+
      '<button class="btn btn-red" onclick="decideReview(\''+qid+'\',\''+vid+'\',false)">Request changes</button>'+
      '<button class="btn btn-navy" onclick="decideReview(\''+qid+'\',\''+vid+'\',true)">Approve</button>'+
    '</div>'):(isAdmin?'':'<div class="modal-actions"><button class="btn" onclick="closeReviewDecisionModal()">Close</button></div>'))+
    adminActionsHTML+
    '</div></div>');
}
function closeReviewDecisionModal(){const el=document.getElementById('rdOverlay');if(el)el.remove();}
async function decideReview(qid,vid,approve){
  const comment=(document.getElementById('reviewComment')?.value||'').trim();
  if(!approve&&!comment){alert('Please add a comment explaining what needs to change.');return;}
  const path='/api/quotes/'+qid+'/versions/'+vid+'/'+(approve?'approve':'request-changes');
  const r=await api('POST',path,{comment});
  if(r.error){alert(r.error);return;}
  closeReviewDecisionModal();
  exitReviewMode();
}
async function adminDecide(qid,vid,decision){
  const comment=(document.getElementById('reviewComment')?.value||'').trim();
  if(decision==='changes_requested'&&!comment){alert('Please add a comment explaining what needs to change.');return;}
  const r=await api('POST','/api/quotes/'+qid+'/versions/'+vid+'/admin-decide',{decision,comment});
  if(r.error){alert(r.error);return;}
  closeReviewDecisionModal();
  exitReviewMode();
}
async function adminCancelReview(qid,vid){
  if(!confirm('Cancel this review submission? The quote goes back to an editable state.'))return;
  const comment=(document.getElementById('reviewComment')?.value||'').trim();
  const r=await api('POST','/api/quotes/'+qid+'/versions/'+vid+'/cancel-review',{comment});
  if(r.error){alert(r.error);return;}
  closeReviewDecisionModal();
  exitReviewMode();
}
async function adminReassignReviewers(qid,vid){
  const r=await api('GET','/api/quotes/reviewer-candidates');
  if(r.error){alert(r.error);return;}
  showReassignReviewersModal(qid,vid,r.users||[]);
}
function showReassignReviewersModal(qid,vid,users){
  document.body.insertAdjacentHTML('beforeend','<div class="modal-overlay" id="reassignOverlay" onclick="if(event.target===this)closeReassignReviewersModal()">'+
    '<div class="modal" style="max-width:480px;max-height:80vh;overflow-y:auto">'+
    '<div class="modal-title">🔁 Reassign reviewers</div>'+
    '<div class="modal-sub">Undecided assignments will be replaced. Anyone who already responded stays on record.</div>'+
    (users.length?'<div style="margin-top:10px">'+users.map(u=>
      '<label style="display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--gray-100);cursor:pointer">'+
        '<input type="checkbox" value="'+u.id+'" class="reassignCb">'+
        '<span><div style="font-weight:600;font-size:14px">'+esc(u.name||u.email)+'</div><div style="font-size:12px;color:var(--gray-500)">'+esc(u.email||'')+'</div></span>'+
      '</label>'
    ).join('')+'</div>':'<div style="color:var(--gray-500);padding:10px 0">No one is flagged as a reviewer yet.</div>')+
    '<div id="reassignErr" class="auth-err" style="display:none;margin-top:10px"></div>'+
    '<div class="modal-actions"><button class="btn" onclick="closeReassignReviewersModal()">Cancel</button>'+(users.length?'<button class="btn btn-navy" onclick="confirmReassignReviewers(\''+qid+'\',\''+vid+'\')">Save</button>':'')+'</div>'+
    '</div></div>');
}
function closeReassignReviewersModal(){const el=document.getElementById('reassignOverlay');if(el)el.remove();}
async function confirmReassignReviewers(qid,vid){
  const ids=[...document.querySelectorAll('.reassignCb:checked')].map(cb=>cb.value);
  const errEl=document.getElementById('reassignErr');
  if(!ids.length){errEl.textContent='Select at least one reviewer.';errEl.style.display='block';return;}
  const r=await api('POST','/api/quotes/'+qid+'/versions/'+vid+'/reassign-reviewers',{reviewer_ids:ids});
  if(r.error){errEl.textContent=r.error;errEl.style.display='block';return;}
  closeReassignReviewersModal();
  closeReviewDecisionModal();
  alert('Reviewers updated.');
  if(A.page==='reviewQueue')loadReviewQueue();
}

async function sendQuoteEmail(){
  const from_email=(document.getElementById('emlFrom').value||'').trim();
  const to=(document.getElementById('emlTo').value||'').trim();
  const subject=(document.getElementById('emlSubject').value||'').trim();
  const message=(document.getElementById('emlMessage').value||'').trim();
  const errEl=document.getElementById('emlErr');errEl.style.display='none';
  if(!from_email){errEl.textContent='Your Microsoft 365 send-from email is required';errEl.style.display='block';return;}
  if(!to){errEl.textContent='Recipient email is required';errEl.style.display='block';return;}
  const btn=document.getElementById('emlSendBtn');btn.disabled=true;btn.textContent='Sending…';
  try{
    // Force a save first — autosave is debounced (schedSave), so a very
    // recent edit might not be in the DB yet. The snapshot stored for this
    // send is read server-side from the DB row, not from the HTML we're
    // about to email, so it must be current before we send. Check it
    // actually succeeded rather than silently emailing/snapshotting stale
    // content if the save failed.
    if(_st){clearTimeout(_st);_st=null;}
    const saved=await saveQuote();
    if(!saved){errEl.textContent='Could not save your latest changes ('+(A._lastSaveError||'unknown error')+') — not sending with a stale version. Please try again.';errEl.style.display='block';return;}
    const html=buildExportHTML();
    const r=await api('POST','/api/quotes/'+A.activeQuote.id+'/email',{to,subject,message,html,from_email});
    if(r.error){errEl.textContent=r.error;errEl.style.display='block';return;}
    if(A.user)A.user.ms365_email=from_email; // remember it for next time without a re-login
    if(A.activeQuote){
      if(!['awarded','lost'].includes(A.activeQuote.status))A.activeQuote.status='sent';
      A.activeQuote.customer_version=r.customer_version;
    }
    closeEmailQuoteModal();
    alert('Sent from '+r.sent_from+' (v'+r.customer_version+')');
  }catch(e){errEl.textContent='Could not reach the email service.';errEl.style.display='block';}
  finally{btn.disabled=false;btn.textContent='Send';}
}

// Reorder within a section only — swaps two entries of sec(si).items, the
// same array delItem/addItem already operate on, so an item can never cross
// into another section. No item is copied or recreated: only array position
// changes, so vendor/model/brand/price/image/etc. on the moved item are
// untouched. Uses the existing autosave path (schedSave), same as any field edit.
function moveItemUp(si,ii){
  const its=sec(si).items; if(ii<=0||ii>=its.length)return;
  [its[ii-1],its[ii]]=[its[ii],its[ii-1]];
  schedSave();draw();
}
function moveItemDown(si,ii){
  const its=sec(si).items; if(ii<0||ii>=its.length-1)return;
  [its[ii],its[ii+1]]=[its[ii+1],its[ii]];
  schedSave();draw();
}

// ── Drag-to-reorder (same section only, standard "drop above/below the
// hovered row's midpoint" convention used by Trello/Notion/etc.). Only the
// small ⠿ handle is draggable — not the row itself — so dragging text inside
// the Vendor/Model/Brand/Description fields to select it still works normally.
// Native HTML5 drag-and-drop does not work on touch devices; the ▲/▼ buttons
// above remain the accessible/touch/keyboard-friendly fallback.
let IDRAG={si:-1,ii:-1};
function dragStartItem(e,si,ii){
  IDRAG={si,ii};
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain','item'); // Firefox requires setData to allow the drag to start
  e.currentTarget.closest('.item-row')?.classList.add('drag-ghost');
}
function dragOverRow(e,si,ii){
  if(IDRAG.si!==si||IDRAG.si===-1)return; // different/unknown section — leave native "no-drop" cursor
  e.preventDefault();
  const row=e.currentTarget;
  const before=(e.clientY-row.getBoundingClientRect().top) < row.getBoundingClientRect().height/2;
  row.classList.toggle('drag-over-top',before);
  row.classList.toggle('drag-over-bottom',!before);
}
function dragLeaveRow(e){e.currentTarget.classList.remove('drag-over-top','drag-over-bottom');}
function dropRow(e,si,ii){
  e.preventDefault();
  const row=e.currentTarget;
  const before=row.classList.contains('drag-over-top');
  row.classList.remove('drag-over-top','drag-over-bottom');
  if(IDRAG.si!==si||IDRAG.si===-1){IDRAG={si:-1,ii:-1};return;} // guard: cannot cross sections
  const its=sec(si).items;
  let target=ii+(before?0:1);
  const moved=its[IDRAG.ii];
  its.splice(IDRAG.ii,1);
  if(IDRAG.ii<target)target-=1; // account for the shift left caused by removing the source row
  its.splice(target,0,moved);
  IDRAG={si:-1,ii:-1};
  schedSave();draw();
}
function dragEndRow(){
  document.querySelectorAll('.drag-ghost,.drag-over-top,.drag-over-bottom')
    .forEach(el=>el.classList.remove('drag-ghost','drag-over-top','drag-over-bottom'));
  IDRAG={si:-1,ii:-1};
}

// ── Draw ──────────────────────────────────────────────────────────────────────
// The item grid can be wider than the screen (Vendor/Model/Brand/pricing
// columns), scrollable via the native horizontal scrollbar — but on many
// Windows laptops, a plain mouse wheel or trackpad only produces vertical
// scroll deltas with no easy horizontal gesture, so the table can look
// "stuck" even though the scrollbar works fine with a direct drag. This
// redirects ordinary vertical scroll input into horizontal movement while
// hovering the table, and steps out of the way at either edge so normal
// page scrolling still works once the table can't scroll further that way.
function gridWheelScroll(e,el){
  if(el.scrollWidth<=el.clientWidth)return;
  const goingRight=e.deltaY>0;
  const atRightEdge=el.scrollLeft+el.clientWidth>=el.scrollWidth-1;
  const atLeftEdge=el.scrollLeft<=0;
  if((goingRight&&atRightEdge)||(!goingRight&&atLeftEdge))return;
  e.preventDefault();
  el.scrollLeft+=e.deltaY;
}

  return`<div class="auth-shell"><div class="auth-card">

    <div id="${isReg?'regErr':'loginErr'}" class="auth-err" style="display:none"></div>
    <form onsubmit="${isReg?'doRegister':'doLogin'}(event)">
      ${isReg?`<div class="field-grid g2" style="margin-bottom:14px">
        <div class="fld"><label>Your name</label><input id="rName" required placeholder="Nishant"></div>
        <div class="fld"><label>Company</label><input id="rCo" required placeholder="Sysconic Technologies"></div>
      </div>
      <div class="fld"><label>Work email</label><input id="rEmail" type="email" required placeholder="you@company.com"></div>
      <div class="fld"><label>Password</label><input id="rPass" type="password" required placeholder="Min 8 characters"></div>`
      :`<div class="fld"><label>Email address</label><input id="lEmail" type="email" required placeholder="you@company.com"></div>
      <div class="fld"><label>Password</label><input id="lPass" type="password" required placeholder="••••••••"></div>`}
      <button class="auth-btn" type="submit">${isReg?'Create account →':'Sign in →'}</button>
