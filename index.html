// ── Accept invite (arrived via ?invite=TOKEN) ────────────────────────────────
async function loadInviteDetails(){
  INV.loading=true;INV.error='';draw();
  const r=await api('GET','/api/auth/invite-details?token='+encodeURIComponent(INV.token));
  INV.loading=false;
  if(r.error){INV.error=r.error;}
  else{INV.email=r.email;INV.role=r.role;INV.company_name=r.company_name;}
  draw();
}
async function submitAcceptInvite(e){
  e.preventDefault();
  if(INV.busy)return;
  const err=document.getElementById('invErr');if(err)err.style.display='none';
  const name=document.getElementById('invName').value;
  const password=document.getElementById('invPass').value;
  const confirm=document.getElementById('invPass2').value;
  if(password!==confirm){if(err){err.textContent='Passwords do not match';err.style.display='block';}return;}
  INV.busy=true;const btn=document.getElementById('invBtn');if(btn){btn.disabled=true;btn.textContent='Joining…';}
  const r=await api('POST','/api/auth/accept-invite',{token:INV.token,name,password});
  INV.busy=false;if(btn){btn.disabled=false;btn.textContent='Join workspace →';}
  if(r.error){if(err){err.textContent=r.error;err.style.display='block';}return;}
  setAuth(r);
  history.replaceState(null,'',window.location.pathname);
  await loadQuotes();A.page='dashboard';draw();
}
function acceptInviteHTML(){
  if(INV.loading)return`<div class="auth-shell"><div class="auth-card"><div class="auth-desc">Loading invite…</div></div></div>`;
  if(INV.error)return`<div class="auth-shell"><div class="auth-card">
    <div class="auth-title">Invite not valid</div>
    <div class="auth-err" style="display:block">${esc(INV.error)}</div>
    <div class="auth-link"><a onclick="history.replaceState(null,'',window.location.pathname);A.screen='login';draw()">Go to sign in</a></div>
  </div></div>`;
  return`<div class="auth-shell"><div class="auth-card">
    <img src="${QTCAL_LOGO_SRC}" class="auth-logo" alt="QTcal AI">
    <div class="auth-title">Join ${esc(INV.company_name)}</div>
    <div class="auth-desc">${esc(INV.email)} · invited as ${esc(INV.role)}</div>
    <div id="invErr" class="auth-err" style="display:none"></div>
    <form onsubmit="submitAcceptInvite(event)">
      <div class="fld"><label>Your name</label><input id="invName" required placeholder="Your full name"></div>
      <div class="fld"><label>Set a password</label><input id="invPass" type="password" required minlength="8" placeholder="Min 8 characters"></div>
      <div class="fld"><label>Confirm password</label><input id="invPass2" type="password" required minlength="8" placeholder="Re-enter password"></div>
      <button class="auth-btn" type="submit" id="invBtn">Join workspace →</button>
    </form>
  </div></div>`;
}

// ── Forgot password ───────────────────────────────────────────────────────────
async function submitForgotPassword(e){
  e.preventDefault();
  if(RST.busy)return;
  RST.busy=true;const btn=document.getElementById('fpBtn');if(btn){btn.disabled=true;btn.textContent='Sending…';}
  const email=document.getElementById('fpEmail').value;
  let r;
  try{r=await api('POST','/api/auth/forgot-password',{email});}
  catch(err){RST.busy=false;if(btn){btn.disabled=false;btn.textContent='Send reset link →';}alert('Could not reach the server. Please try again.');return;}
  RST.busy=false;if(btn){btn.disabled=false;btn.textContent='Send reset link →';}
  if(r.error){alert('❌ '+r.error);return;}
  RST.done=true;draw();
}
function forgotPasswordHTML(){
  if(RST.done)return`<div class="auth-shell"><div class="auth-card">
    <div class="auth-title">Check your email</div>
    <div class="auth-desc">If that email is registered, we've sent a link to reset your password. It expires in 1 hour.</div>
    <div class="auth-link"><a onclick="RST.done=false;A.screen='login';draw()">Back to sign in</a></div>
  </div></div>`;
  return`<div class="auth-shell"><div class="auth-card">
    <img src="${QTCAL_LOGO_SRC}" class="auth-logo" alt="QTcal AI">
    <div class="auth-title">Forgot your password?</div>
    <div class="auth-desc">Enter your email and we'll send you a reset link</div>
    <form onsubmit="submitForgotPassword(event)">
      <div class="fld"><label>Email address</label><input id="fpEmail" type="email" required placeholder="you@company.com"></div>
      <button class="auth-btn" type="submit" id="fpBtn">Send reset link →</button>
    </form>
    <div class="auth-link"><a onclick="A.screen='login';draw()">Back to sign in</a></div>
  </div></div>`;
}

// ── Reset password (arrived via ?reset=TOKEN) ────────────────────────────────
async function submitResetPassword(e){
  e.preventDefault();
  if(RST.busy)return;
  const err=document.getElementById('rpErr');if(err)err.style.display='none';
  const password=document.getElementById('rpPass').value;
  const confirm=document.getElementById('rpPass2').value;
  if(password!==confirm){if(err){err.textContent='Passwords do not match';err.style.display='block';}return;}
  RST.busy=true;const btn=document.getElementById('rpBtn');if(btn){btn.disabled=true;btn.textContent='Updating…';}
  const r=await api('POST','/api/auth/reset-password',{token:RST.token,password});
  RST.busy=false;if(btn){btn.disabled=false;btn.textContent='Update password →';}
  if(r.error){if(err){err.textContent=r.error;err.style.display='block';}return;}
  RST.done=true;
  history.replaceState(null,'',window.location.pathname);
  draw();
}

    <div id="rpErr" class="auth-err" style="display:none"></div>

  </div></div>`;
}

// used everywhere else (nav, PAGE_TITLES, buildTopbarRight) so the drawer
// always shows help for whatever the user is actually looking at, with zero
// extra mapping logic. Doubles as a jump-to-topic index for browsing any
// other section's help without leaving the current page.
const HELP_CONTENT={
  dashboard:{title:'Quotes',body:`
    <p>This is your home page — every quote your company has created, in one list.</p>
    <h4>Metrics</h4>
    <p><strong>Total quotes</strong>, <strong>Pipeline value</strong> (sum of every quote's grand total), <strong>Total GP</strong> and <strong>Win rate</strong> (Awarded ÷ Total).</p>
    <h4>Working the list</h4>
    <ul>
      <li>Search by title or customer, filter by status (Draft / Sent / Awarded / Lost), switch between grid and list view.</li>
      <li>Each quote card has ✏️ Edit, ⧉ Copy (duplicate as a new editable quote) and — admins only — 🗑 Delete.</li>
      <li><strong>+ New quote</strong> (top right) starts a blank one.</li>
    </ul>
    <div class="help-tip">💡 Duplicating a similar past quote is usually faster than starting from scratch.</div>
  `},
  editor:{title:'Quote Editor',body:`
    <p>Where a quote actually gets built: customer details, one or more pricing <strong>options</strong>, and the item sections inside each option.</p>
    <h4>Quote details</h4>
    <p>Title, Customer (type freely or search your Zoho Books customers), Option label, Quote ref, Date, Prepared by, Title/Role.</p>
    <h4>Options</h4>
    <p>The pill tabs above the details card. Use these when you want to offer the customer real alternatives (e.g. "Standard" vs "Premium") priced side by side — see them compared on the <strong>Summary</strong> tab. Most quotes only need one.</p>
    <h4>Sections &amp; items</h4>
    <p>Group items under a section (e.g. "LED Screen", "Installation"). Add/remove items, drag the ⠿ handle or use ▲▼ to reorder.</p>
    <h4>Internal vs Client view</h4>
    <p>Toggle top-right. <strong>Internal</strong> shows your cost, discount, markup/margin % and vendor — for your team only. <strong>Client</strong> shows only what a customer would see. This is a screen-only toggle; the actual Print/PDF output is controlled separately from the Print tab.</p>
    <h4>Pricing</h4>
    <p>Set Currency, Rate to AED, and Pricing method (Markup or Margin) in the strip above the tabs. Unit Price is editable directly — typing a price back-calculates the markup/margin automatically. VAT is enabled and rated per option, shown in the totals strip at the bottom.</p>
    <h4>Toolbar</h4>
    <ul>
      <li><strong>💾 Save</strong> — autosaves as you type too, this just forces it immediately.</li>
      <li><strong>📤 Send to Review</strong> — snapshot this quote and route it to chosen reviewers before it goes to a customer.</li>
      <li><strong>📑 Generate Proposal</strong> — AI drafts a Technical/Commercial proposal document from this quote.</li>
      <li><strong>🔍 AI Review</strong> — an advisory completeness check (missing pricing, thin descriptions, etc.); nothing is changed automatically.</li>
      <li><strong>✨ Auto-BOM</strong> — describe a project in plain language and AI suggests a bill of materials, matching your Product Catalog where it can.</li>
      <li><strong>📄 Template / 📥 Import Excel</strong> — download a blank item template or bulk-import items from a spreadsheet.</li>
      <li><strong>⋯ More</strong> — 📜 History (past review submissions), 🔍 Compare (diff any two saved versions), 🖼 Images toggle (product photos + catalog assist), ⧉ Duplicate quote, ⬇ Export PDF.</li>
    </ul>
    <div class="help-tip">💡 An Awarded or Sent quote locks editing — use "Unlock — set to Draft" at the top if you need to change it.</div>
  `},
  terms:{title:'Terms & Conditions',body:`
    <p>The T&amp;C list that prints at the end of this quotation — payment terms, delivery, warranty, exclusions, whatever applies.</p>
    <ul>
      <li><strong>+ Add term</strong> adds a new numbered line; edit any line directly; remove ones you don't need.</li>
      <li>These are per-quote, so you can tailor them each time rather than being stuck with one fixed set of boilerplate.</li>
    </ul>
  `},
  summary:{title:'Summary',body:`
    <p>A read-only rollup of the numbers — useful for a final sanity check before sending.</p>
    <ul>
      <li>If the quote has more than one <strong>option</strong>, an Options Comparison card shows Subtotal / Total GP / Margin / VAT / Grand Total side by side.</li>
      <li>Below that, one detail card per option with the same figures plus Total Cost.</li>
    </ul>
  `},
  vendor:{title:'Vendor Payments',body:`
    <p>Internal tracking for what you owe your suppliers on this quote — separate from what the customer sees.</p>
    <ul>
      <li>Top metrics: PO Value incl. VAT (this quote's grand total), Total Vendor Payable, and the resulting Net Profit.</li>
      <li><strong>Vendor payment tracker</strong>: add each vendor, their payable amount (VAT at 5% is calculated automatically), two payment installments, a date and a status (pending / partial / paid).</li>

  print:{title:'Print / PDF',body:`

    <h4>Getting it out</h4>
    <ul>
      <li><strong>⬇ PDF</strong> — server-rendered so it matches this on-screen preview exactly, including a repeating footer with page numbers from page 2 onward.</li>
      <li><strong>✉️ Email to Customer</strong> — sends from your own Microsoft 365 mailbox with the quote attached as a PDF; automatically moves the quote to "Sent" and logs a customer-facing version.</li>

  log:{title:'Activity Log',body:`
    <p>A timeline of everything that's happened to this quote: created, status changes, sent for review, approved / changes requested, admin overrides, emailed to customer — each with who did it and when.</p>
    <div class="help-tip">🔍 Compare versions lets you diff any two saved snapshots side by side, not just consecutive ones.</div>
  `},
  reviewQueue:{title:'Review Queue',body:`
    <p>The internal approval workflow that sits between "building a quote" and "sending it to a customer."</p>
    <ul>
      <li>From the editor, <strong>📤 Send to Review</strong> snapshots the quote and assigns it to chosen reviewers.</li>

  products:{title:'Product Catalog',body:`
    <p>Your company-wide item master — brand, model, SKU, category, description, specs, default cost (with currency) and default margin %, linked vendor + their part number, lead time, and a datasheet link, plus a product image.</p>
    <ul>
      <li>Search, download the Excel <strong>Template</strong>, or <strong>Import Excel</strong> to bulk-load products.</li>
      <li><strong>+ Add product</strong> to create one manually.</li>
      <li>Mark a product inactive instead of deleting it if you don't want it showing up in search/quoting anymore but want to keep the history.</li>
    </ul>
    <div class="help-tip">💡 New brand/model combos typed straight into a quote get added to the catalog automatically — but keeping cost and margin current here is what makes reuse on future quotes fast and consistent.</div>
  `},
  customers:{title:'Customer Master',body:`
    <p>The contact list a quote's Customer field pulls from (or you can always just type a new one directly on a quote).</p>
    <ul>
      <li>Name, Company, Email, Phone, Address, TRN.</li>
      <li>Search, Excel Template/Import, or add/edit/delete manually.</li>
      <li>Admins can <strong>🔄 Sync</strong> to pull contacts from whatever integration is connected in Settings → Integrations, instead of entering them by hand.</li>
      <li>The <strong>Source</strong> column shows Manual vs. the integration a contact synced from.</li>
    </ul>
  `},
  vendorMaster:{title:'Vendor Master',body:`
    <p>The supplier equivalent of the Customer Master — name, category, contact/email, phone. Feeds the Vendor field on both the item editor (Internal view) and the Product Catalog.</p>
    <ul>
      <li>Search, Excel Template/Import, manual add/edit/delete.</li>
      <li>Admins can <strong>🔄 Sync</strong> from a connected integration, same as customers.</li>
    </ul>
  `},
  projects:{title:'Projects',body:`
    <p>A lightweight, manually-maintained project register — name, customer, site/location, PO number, and status (active / on hold / completed / cancelled).</p>
    <p>Each project can optionally be linked to a Zoho Books project.</p>
    <div class="help-tip">This is a simple list, not the financial tracking module — see <strong>Project Performance</strong> for margin, cost and cash tracking, which is created automatically when a quote is Awarded.</div>
  `},
  projectPerformance:{title:'Project Performance',body:`
    <p>Financial tracking for every Awarded quote — a project row appears here automatically the moment a quote's status is set to Awarded. Nothing to create manually.</p>
    <h4>Portfolio metrics</h4>
    <p>Active Projects, Total Active Value, Portfolio Forecast GP%, Projects At Risk, Critical Projects, Total Unbilled, Outstanding Receivables, Cash Exposure.</p>
    <h4>The table</h4>
    <p>Hover any column header for its exact definition — each one has a built-in tooltip (e.g. Erosion = Original GP% − Forecast GP%; EAC = Actual + Committed + Forecast Remaining cost). Use <strong>Columns ▾</strong> to show/hide columns, and the search/health/status/date filters to narrow the list.</p>
    <h4>Syncing from Zoho</h4>
    <ul>
      <li><strong>🔄 Sync Now</strong> — refreshes actuals (bills, invoices, POs) for the whole portfolio.</li>
      <li><strong>Sync Selected</strong> / <strong>Sync Range</strong> — target specific Zoho Project IDs or a Project No range, useful for testing or a quick refresh of one project.</li>
    </ul>
    <p>Click any row to open the full project detail.</p>
  `},
  projectPerformanceDetail:{title:'Project Detail',body:`
    <p>Five tabs for one project:</p>
    <ul>
      <li><strong>Overview</strong> — KPI cards, the Health Score breakdown, and open alerts.</li>
      <li><strong>Financial Performance</strong> — original vs. current profitability, plus a margin trend table that builds up with every sync.</li>
      <li><strong>Cost Control</strong> — cost by category (Actual / Committed / Forecast Remaining / EAC), and your own manually-added Forecast Remaining Cost entries.</li>
      <li><strong>Billing &amp; Collection</strong> — Invoice % and Collection %, plus the invoice list.</li>
      <li><strong>Cash Position</strong> — cash received from the customer vs. paid to vendors/expenses, and the net position.</li>
    </ul>
    <h4>Actions</h4>
    <ul>
      <li><strong>Update Completion %</strong> — manually record progress with an optional comment.</li>
      <li><strong>+ Forecast Cost</strong> — add an expected future cost that isn't in Zoho yet.</li>
      <li><strong>🔄 Sync Now</strong> — refreshes this project only.</li>
    </ul>
    <p>The <strong>Health Score</strong> (0–100) is a weighted average of margin, cost control, billing, collection, cash and commitment-exposure health, and drives the Healthy / At Risk / Critical badge.</p>
  `},
  team:{title:'Team & Settings',body:`
    <p>Admin only. Your company's users and their roles.</p>
    <p><strong>+ Invite member</strong> sends an email invite — the person sets their own password via the link, nothing to configure on their behalf beyond the invite itself.</p>
  `},
  integrations:{title:'Integrations',body:`
    <p>Admin only. Connect an accounting/CRM system (e.g. Zoho Books) so Customers and Vendors sync in automatically instead of manual entry, and so Zoho Projects, Bills and Invoices feed the Project Performance module.</p>
    <p>Each company's credentials are kept completely separate — nothing here is shared with other companies on this platform.</p>
    <p><strong>Sync configuration</strong> lets you choose which connected integration feeds each data type, and whether it should also sync automatically once a day.</p>
  `},
  companyProfile:{title:'Company Profile',body:`
    <p>Admin only. The branding shown on every Quotation PDF and generated proposal: logo, legal company name, address, TRN, phone, website, and bank details (used in the payment section).</p>
    <div class="help-tip">💡 Saving here updates the Print tab immediately — no reload needed, and no separate step to "apply" it to existing quotes.</div>
  `},
  platform:{title:'All Companies',body:`
    <p>Platform-admin only. Every company using this SaaS instance in one list.</p>
    <p><strong>+ Onboard company</strong> creates a new tenant. Suspending a company blocks that team from logging in (existing sessions may remain valid briefly) until it's reactivated.</p>
  `},
};
const HELP_ORDER=['dashboard','editor','terms','summary','vendor','print','log','reviewQueue','products','customers','vendorMaster','projects','projectPerformance','projectPerformanceDetail','team','integrations','companyProfile','platform'];
function currentHelpKey(){
  if(A.helpViewTopic&&HELP_CONTENT[A.helpViewTopic])return A.helpViewTopic;
  return HELP_CONTENT[A.page]?A.page:'dashboard';
}
function toggleHelp(){A.helpOpen=!A.helpOpen;if(!A.helpOpen)A.helpViewTopic=null;draw();}
function setHelpTopic(key){A.helpViewTopic=key;draw();}
function helpFabHTML(){
  return `<button class="help-fab" onclick="toggleHelp()" title="Help for this section">?</button>`;
}
function helpDrawerHTML(){
  if(!A.helpOpen)return'';
  const key=currentHelpKey();
  const h=HELP_CONTENT[key]||{title:'Help',body:'<p>No help available for this section yet.</p>'};
  return `<div class="help-overlay" onclick="if(event.target===this)toggleHelp()">
    <div class="help-drawer">
      <div class="help-drawer-hd">
        <div>
          <div class="help-drawer-eyebrow">Help</div>
          <div class="help-drawer-title">${esc(h.title)}</div>
        </div>
        <button class="help-close" onclick="toggleHelp()" aria-label="Close">✕</button>
      </div>
      <div class="help-drawer-jump">
        <label>Jump to topic</label>
        <select onchange="setHelpTopic(this.value)">
          ${HELP_ORDER.map(k=>`<option value="${k}" ${k===key?'selected':''}>${esc(HELP_CONTENT[k].title)}</option>`).join('')}
        </select>
        ${A.helpViewTopic?`<button class="help-follow-btn" onclick="A.helpViewTopic=null;draw()" title="Follow whatever page you're on">↺ Current page</button>`:''}
      </div>
      <div class="help-drawer-body">${h.body}</div>
    </div>
  </div>`;
}

// ── App shell ─────────────────────────────────────────────────────────────────
function appHTML(){
  const init=(A.user?.name||'U').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  const PAGE_TITLES={dashboard:'Dashboard',editor:'Quotation',terms:'Terms & Conditions',summary:'Summary',vendor:'Vendor Payments',print:'Print / PDF',log:'Activity Log',team:'Team & Settings',products:'Product Catalog',customers:'Customer Master',vendorMaster:'Vendor Master',integrations:'Integrations',platform:'All Companies',companyProfile:'Company Profile',reviewQueue:'Review Queue',projectPerformance:'Project Performance',projectPerformanceDetail:'Project Detail'};
  const inEditor=['editor','terms','summary','vendor','print','log'].includes(A.page);

  const nav=(page,cb)=>`A.page='${page}';${cb||''}closeSidebar();draw()`;
  const sidebar=`<div class="sidebar${A.sbOpen?' open':''}">
    <div class="sb-brand">
      <img src="${LOGO_SRC}" class="sb-logo" alt="Sysconic">
      <div><div class="sb-co">${esc(A.company?.name||'')}</div></div>
    </div>
    <nav class="sb-nav">
      ${A.user?.is_platform_admin?'':`
      <div class="sb-sec">Workspace</div>
      <div class="sb-item ${A.page==='dashboard'?'active':''}" onclick="${nav('dashboard')}"><span class="sb-icon">🏠</span>Quotes</div>
      <div class="sb-item ${A.page==='products'?'active':''}" onclick="${nav('products')}"><span class="sb-icon">📦</span>Products</div>
      <div class="sb-item ${A.page==='customers'?'active':''}" onclick="${nav('customers')}"><span class="sb-icon">👤</span>Customers</div>
      <div class="sb-item ${A.page==='vendorMaster'?'active':''}" onclick="${nav('vendorMaster')}"><span class="sb-icon">🏭</span>Vendors</div>
      ${hasFeature('projects')?`<div class="sb-item ${A.page==='projects'?'active':''}" onclick="${nav('projects')}"><span class="sb-icon">📁</span>Projects</div>`:''}
      ${hasFeature('project_performance')?`<div class="sb-item ${(A.page==='projectPerformance'||A.page==='projectPerformanceDetail')?'active':''}" onclick="${nav('projectPerformance')}"><span class="sb-icon">📊</span>Project Performance</div>`:''}
      <div class="sb-item ${A.page==='reviewQueue'?'active':''}" onclick="${nav('reviewQueue')}"><span class="sb-icon">📝</span>Review Queue${A.reviewQueueCount?` <span class="sb-badge">${A.reviewQueueCount}</span>`:''}</div>       ${hasFeature('testimonials')?`<div class="sb-item ${A.page==='testimonials'?'active':''}" onclick="${nav('testimonials')}"><span class="sb-icon">⭐</span>Testimonials</div>`:''}       ${A.activeQuote?`<div class="sb-item ${inEditor&&A.page!=='team'?'active':''}" onclick="${nav('editor')}"><span class="sb-icon">📄</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(A.activeQuote.title||'Quote')}</span></div>`:''}`}       ${(A.user?.role==='admin'&&!A.user?.is_platform_admin)?`<div class="sb-sec">Settings</div>
      <div class="sb-item ${A.page==='team'?'active':''}" onclick="${nav('team')}"><span class="sb-icon">👥</span>Team</div>
      <div class="sb-item ${A.page==='integrations'?'active':''}" onclick="${nav('integrations')}"><span class="sb-icon">🔌</span>Integrations</div>
      <div class="sb-item ${A.page==='companyProfile'?'active':''}" onclick="${nav('companyProfile')}"><span class="sb-icon">🏢</span>Company Profile</div>`:''}
      ${A.user?.is_platform_admin?`<div class="sb-sec">Platform</div><div class="sb-item ${A.page==='platform'?'active':''}" onclick="${nav('platform')}"><span class="sb-icon">🌐</span>All Companies</div>`:''}
    </nav>
    <div class="sb-foot">
      <div class="sb-user">
        <div class="sb-avatar">${init}</div>
        <div><div class="sb-uname">${esc(A.user?.name||'')}</div><div class="sb-urole">${A.user?.role||''}</div></div>
      </div>
      <button class="sb-logout" onclick="doLogout()">Sign out</button>
      <div class="sb-poweredby">Powered by <span class="sb-poweredby-name">QTcal AI</span></div>
      <div id="saveStatus"></div>
    </div>
  </div>`;
  const sbOverlay=`<div class="sb-overlay${A.sbOpen?' open':''}" onclick="closeSidebar()"></div>`;

  const topbarRight=buildTopbarRight();
  const cstrip=(inEditor&&!A.reviewMode)?buildCstrip():'';

  let pageContent='';
  if(A.page==='dashboard')pageContent=dashHTML();
  else if(A.page==='editor')pageContent=editorHTML();
  else if(A.page==='terms')pageContent=termsHTML();
  else if(A.page==='summary')pageContent=summaryHTML();
  else if(A.page==='vendor')pageContent=vendorHTML();
  else if(A.page==='print')pageContent=printHTML();
  else if(A.page==='log')pageContent=logHTML();
  else if(A.page==='products')pageContent=productsHTML();
  else if(A.page==='customers')pageContent=customersHTML();
  else if(A.page==='projects')pageContent=projectsHTML();
  else if(A.page==='projectPerformance')pageContent=portfolioHTML();
  else if(A.page==='projectPerformanceDetail')pageContent=projectPerformanceDetailHTML();
  else if(A.page==='vendorMaster')pageContent=vendorsMasterHTML();
  else if(A.page==='team')pageContent=teamHTML();
  else if(A.page==='integrations')pageContent=integrationsHTML();
  else if(A.page==='platform')pageContent=platformHTML();
  else if(A.page==='companyProfile')pageContent=companyProfileHTML();
  else if(A.page==='reviewQueue')pageContent=reviewQueueHTML();
  else if(A.page==='testimonials')pageContent=testimonialsHTML();

  if(['editor','terms','vendor'].includes(A.page)&&isQuoteLocked()&&!A.reviewMode){
    pageContent=`<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:14px 18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div><div style="font-weight:700;color:#9a3412">🔒 This quote is locked (status: ${esc(STATUS_LABELS[A.activeQuote.status]||A.activeQuote.status)})</div>
      <div style="font-size:13px;color:#9a3412">Set the status back to Draft to make changes.</div></div>
      <button class="btn btn-navy" onclick="unlockForEditing()">Unlock — set to Draft</button>
    </div><div style="pointer-events:none;opacity:.55;user-select:none">${pageContent}</div>`;
  }

  return`<div class="shell">${sidebar}${sbOverlay}${helpFabHTML()}${helpDrawerHTML()}<div class="main">
    <div class="topbar"><div style="display:flex;align-items:center;gap:6px;min-width:0"><button class="sb-toggle" onclick="toggleSidebar()" aria-label="Menu">☰</button><div class="topbar-title">${PAGE_TITLES[A.page]||''}</div></div><div class="topbar-right">${topbarRight}</div></div>
    ${cstrip}
    <div class="content">${pageContent}</div>
  </div></div>`;
}

function buildTopbarRight(){
  if(A.page==='dashboard')return`<button class="btn btn-navy" onclick="newQuote()">+ New quote</button>`;
  if(A.page==='editor')return`
    <div class="vtoggle">
      <button class="vtbtn ${A.view==='internal'?'active':''}" onclick="A.view='internal';draw()">Internal</button>
      <button class="vtbtn ${A.view==='client'?'active':''}" onclick="A.view='client';draw()">Client</button>
    </div>
    <button class="btn" onclick="A.page='dashboard';draw()">← Back</button>
    <span class="tb-sep"></span>
    ${!isQuoteLocked()?`<button class="btn btn-navy" onclick="saveQuote()">💾 Save</button>`:`<button class="btn btn-navy" onclick="unlockForEditing()">🔓 Unlock to edit</button>`}
    ${!isQuoteLocked()?`<button class="btn" onclick="submitForReview()" title="Snapshot this quote and send it for internal approval before it goes to the customer">📤 Send to Review</button>`:''}
    <button class="btn" onclick="openProposalModal()" title="Generate a technical/commercial proposal document from this quote using AI">📑 Generate Proposal</button>
    ${reviewStatusBadgeHTML()}
    <span class="tb-sep"></span>
    <button class="btn" onclick="reviewQuote()">🔍 AI Review</button>
    ${!isQuoteLocked()?`<button class="btn" onclick="openBomModal()" title="Generate a bill of materials from a project description using AI">✨ Auto-BOM</button>`:''}
    <button class="btn" onclick="openPriceCheckModal()" title="Sum cost x qty by vendor per option, to cross-check against distributor pricing">Price Check</button>
    <span class="tb-sep"></span>
    <button class="btn" onclick="downloadTemplate()" title="Download Excel template">📄 Template</button>
    ${!isQuoteLocked()?`<label class="btn" style="cursor:pointer" title="Import from Excel">📥 Import Excel<input type="file" accept=".xlsx,.xls" style="display:none" onchange="importExcel(event)"></label>`:''}
    <button class="btn" onclick="A.page='print';draw()" title="Open the print view">🖨 Print</button>
    <div class="more-wrap" id="moreMenuWrap">
      <button class="btn" onclick="toggleMoreMenu(event)">⋯ More</button>
      <div class="more-panel" id="moreMenuPanel">
        <button onclick="closeMoreMenu();showVersionHistoryModal()" title="View past review submissions">📜 History</button>
        <button onclick="closeMoreMenu();showCompareModal()" title="Compare any two saved versions (review submissions or customer sends)">🔍 Compare</button>
        <button onclick="toggleImgOn()" title="Toggle product images & catalog assist for this quote">🖼 Images ${imgOn()?'ON':'OFF'}</button>
        <div class="mp-divider"></div>
        <button onclick="duplicateCurrentQuote()" title="Create an editable copy of this quote">⧉ Duplicate quote</button>
        <button onclick="closeMoreMenu();downloadPDF()" title="Export this quote as a PDF">⬇ Export PDF</button>
      </div>
    </div>`;
  if(A.page==='products')return`
    <button class="btn" onclick="downloadProdTemplate()">⬇ Template</button>
    <label class="btn" style="cursor:pointer" title="Import products from Excel">📥 Import Excel<input type="file" accept=".xlsx,.xls" style="display:none" onchange="importProducts(event)"></label>
    <button class="btn btn-navy" onclick="showProdModal()">+ Add product</button>`;
  if(A.page==='customers')return`

    <button class="btn" onclick="downloadCustTemplate()">⬇ Template</button>

    <button class="btn btn-navy" onclick="showCustModal()">+ Add customer</button>`;
  if(A.page==='vendorMaster')return`
    ${A.user?.role==='admin'?`<button class="btn" onclick="syncIntegrationVendors()" id="syncVendBtn" title="Pull contacts from your configured integration (Settings → Integrations)">🔄 Sync</button>`:''}
    <button class="btn" onclick="downloadVendTemplate()">⬇ Template</button>
    <label class="btn" style="cursor:pointer" title="Import vendors from Excel">📥 Import Excel<input type="file" accept=".xlsx,.xls" style="display:none" onchange="importVendorsMaster(event)"></label>
    <button class="btn btn-navy" onclick="showVendModal()">+ Add vendor</button>`;
  if(A.page==='print')return`
    ${!A.reviewMode?`<button class="btn btn-navy" onclick="downloadPDF()" title="Download this quotation as a PDF file">⬇ PDF</button>`:''}
    <select id="pSel" onchange="draw()" style="padding:6px 12px;font-size:14px;border:1.5px solid var(--gray-200);border-radius:var(--radius)">
      ${(()=>{const w=printWhich();return (A.activeQuote?.quote_data||[]).map((o,i)=>`<option value="${i}" ${w===String(i)?'selected':''}>${esc(o.label)}</option>`).join('')+`<option value="all" ${w==='all'?'selected':''}>All options</option>`;})()}
    </select>
    ${A.reviewMode?`
    <span style="background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px">🔍 Reviewing v${A.reviewMode.vnum} — read only</span>
    <button class="btn btn-navy" onclick="showReviewDecisionModal('${A.reviewMode.qid}','${A.reviewMode.vid}',${A.reviewMode.vnum})">✅ Review Decision</button>
    <button class="btn" onclick="exitReviewMode()">✕ Exit Review</button>`:`
    <button class="btn btn-navy" onclick="showEmailQuoteModal()" title="Email this quote to the customer from your own mailbox">✉️ Email to Customer</button>
    <button class="btn btn-navy print-controls" onclick="window.print()">🖨️ Print / PDF</button>`}`;
  if(A.page==='team')return A.user?.role==='admin'?`<button class="btn btn-navy" onclick="showInviteModal()">+ Invite member</button>`:'';
  if(A.page==='platform')return A.user?.is_platform_admin?`<button class="btn btn-navy" onclick="showAddCompanyModal()">+ Onboard company</button>`:'';
  return'';
}

    <span style="color:var(--gray-300)">|</span>

// ── Dashboard ─────────────────────────────────────────────────────────────────
function dashHTML(){
  const qs=A.quotes;
  const awarded=qs.filter(q=>q.status==='awarded').length;
  const totalVal=qs.reduce((s,q)=>s+(q.total_sell||0),0);
  const totalGp=qs.reduce((s,q)=>s+(q.total_gp||0),0);
  const filtered=qs.filter(q=>{
    const ms=!A.searchQ||q.title.toLowerCase().includes(A.searchQ.toLowerCase())||(q.customer||'').toLowerCase().includes(A.searchQ.toLowerCase());
    const mf=A.filterStatus==='all'||q.status===A.filterStatus;
    return ms&&mf;
  });
  let html=`<div class="dash-metrics">
    <div class="mcard"><div class="mcard-label">Total quotes</div><div class="mcard-val navy">${qs.length}</div><div class="mcard-sub">${awarded} awarded</div></div>
    <div class="mcard"><div class="mcard-label">Pipeline value</div><div class="mcard-val navy">AED ${fmt(totalVal)}</div></div>
    <div class="mcard"><div class="mcard-label">Total GP</div><div class="mcard-val green">AED ${fmt(totalGp)}</div></div>
    <div class="mcard"><div class="mcard-label">Win rate</div><div class="mcard-val amber">${qs.length>0?Math.round(awarded/qs.length*100):0}%</div></div>
  </div>
  <div class="filter-bar">
    <input class="search-inp" placeholder="🔍 Search quotes..." value="${esc(A.searchQ)}" oninput="A.searchQ=this.value;draw()">
    <select class="filter-sel" onchange="A.filterStatus=this.value;draw()">
      <option value="all">All status</option>
      ${['draft','sent','awarded','lost'].map(s=>`<option value="${s}" ${A.filterStatus===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join('')}
    </select>
    <div class="view-toggle">
      <button class="${(A.dashView||'grid')==='grid'?'active':''}" title="Grid view" onclick="A.dashView='grid';draw()">▦</button>
      <button class="${A.dashView==='list'?'active':''}" title="List view" onclick="A.dashView='list';draw()">☰</button>
    </div>
  </div>`;
  if(!filtered.length){
    html+=`<div class="empty-state"><div class="empty-icon">📄</div><div class="empty-title">${qs.length?'No matches':'No quotes yet'}</div><div class="empty-sub">${qs.length?'Try adjusting filters':'Create your first quote'}</div>${!qs.length?`<button class="btn btn-navy" onclick="newQuote()">+ New quote</button>`:''}</div>`;
  } else if(A.dashView==='list'){
    html+=`<div class="quote-list">
      <div class="qlist-hd"><div>Title</div><div>Customer</div><div>Status</div><div>Date</div><div>Currency</div><div>Total value</div><div>Gross profit</div><div>Actions</div></div>`;
    filtered.forEach(q=>{
      const date=new Date(q.updated_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
      html+=`<div class="qlist-row" onclick="openQuote({id:'${q.id}'})">
        <div class="qlist-title">${esc(q.title)}</div>
        <div class="qlist-cust">${esc(q.customer||'No customer')}</div>
        <div><span class="sbadge s-${q.status}">${STATUS_LABELS[q.status]}</span></div>
        <div>${date}</div>
        <div>${q.currency||'AED'}</div>
        <div class="qlist-total">${q.currency||'AED'} ${fmt(q.total_sell||0)}</div>
        <div class="qlist-gp">${q.currency||'AED'} ${fmt(q.total_gp||0)}</div>
        <div class="qlist-actions" onclick="event.stopPropagation()">
          <button class="btn btn-sm" onclick="openQuote({id:'${q.id}'})">✏️</button>
          <button class="btn btn-sm" onclick="duplicateQuote('${q.id}',event)">⧉</button>
          ${A.user?.role==='admin'?`<button class="btn btn-sm btn-red" onclick="deleteQuote('${q.id}',event)">🗑</button>`:''}
        </div>
      </div>`;
    });
    html+=`</div>`;
  } else {
    html+=`<div class="quote-grid">`;
    filtered.forEach(q=>{
      const date=new Date(q.updated_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
      html+=`<div class="qcard" onclick="openQuote({id:'${q.id}'})">
        <div class="qcard-header"><div class="qcard-title">${esc(q.title)}</div><span class="sbadge s-${q.status}">${STATUS_LABELS[q.status]}</span></div>
        <div class="qcard-customer">${esc(q.customer||'No customer')}</div>
        <div class="qcard-meta"><span>📅 ${date}</span><span>💱 ${q.currency||'AED'}</span></div>
        <div class="qcard-totals">
          <div><div class="qcard-total-label">Total value</div><div class="qcard-total-val">${q.currency||'AED'} ${fmt(q.total_sell||0)}</div></div>
          <div style="text-align:right"><div class="qcard-total-label">Gross profit</div><div class="qcard-total-val" style="color:var(--green)">${q.currency||'AED'} ${fmt(q.total_gp||0)}</div></div>
        </div>
        <div class="qcard-actions" onclick="event.stopPropagation()">
          <button class="btn btn-sm" onclick="openQuote({id:'${q.id}'})">✏️ Edit</button>
          <button class="btn btn-sm" onclick="duplicateQuote('${q.id}',event)">⧉ Copy</button>
          ${A.user?.role==='admin'?`<button class="btn btn-sm btn-red" onclick="deleteQuote('${q.id}',event)">🗑 Delete</button>`:''}
        </div>
      </div>`;
    });
    html+=`</div>`;
  }
  return html;
}

// ── Print ─────────────────────────────────────────────────────────────────────
// Builds a standalone HTML document from the exact same printHTML() markup
// shown on screen (minus the theme-picker/tip-banner UI, which don't belong
// in the PDF) plus the page's own CSS, so the PDF-rendering service produces
// a byte-for-byte match of what the user actually sees — instead of a
// separately hand-built PDF template that can only ever approximate it.
function buildExportHTML(){
  const css=document.querySelector('style')?.textContent||'';
  const body=printHTML(true);
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><style>${css}
  body{background:#fff;margin:0;padding:0}
  .print-doc{box-shadow:none;max-width:100%}
  </style></head><body>${body}</body></html>`;
}
// Repeating per-page footer for the downloaded PDF only (PDFShift renders
// header/footer independently of the document, on every page from
// `start_at` onward -- something a browser's own print/Ctrl+P can't do,
// since Chromium only supports its native URL/date header-footer, not
// custom repeating content). Page 1 already carries the full letterhead,
// so this starts at page 2 as a lightweight "which company sent this"
// reminder in case pages get separated after printing.
function pdfFooterHTML(){
  const q=A.activeQuote;
  const ref=q?.quote_data?.[0]?.ref||q?.title||'';
  const web=PRINTCO?.website||'';
  const left=[ref,web].filter(Boolean).join(' · ');
  const dark=getPrintTheme().dark;
  return `<div style="width:100%;box-sizing:border-box;padding:6px 24px 0;border-top:1px solid #d8dce3;display:flex;justify-content:space-between;align-items:center;font-family:Arial,Helvetica,sans-serif;font-size:9px;color:${dark}">
    <span>${esc(left)}</span>
    <span>Page {{page}} of {{total}}</span>
  </div>`;
}
async function downloadPDF(){
  const q=A.activeQuote;if(!q)return;
  const btns=document.querySelectorAll('button');let b=null;btns.forEach(x=>{if(x.textContent.includes('PDF'))b=x;});
  if(b){b.disabled=true;b.textContent='⏳ Generating…';}
  try{
    const html=buildExportHTML();
    const r=await fetch('/api/pdf/render',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+A.token},
      body:JSON.stringify({html, filename:'Quotation-'+(q.quote_data?.[0]?.ref||q.title||'quote').replace(/[^\w\-]+/g,'-')+'.pdf', footer_html:pdfFooterHTML(), footer_start_at:2})});
    if(!r.ok){const e=await r.json().catch(()=>({}));alert(e.error||'PDF generation failed');return;}
    const blob=await r.blob();
    const cd=r.headers.get('Content-Disposition')||'';
    const m=cd.match(/filename="?([^";]+)"?/);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=m?m[1]:('Quotation-'+(q.title||'quote').replace(/[^\w\-]+/g,'-')+'.pdf');
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  }catch(e){alert('Could not reach the PDF service.');}
  finally{if(b){b.disabled=false;b.textContent='⬇ PDF';}}
}

let PRODS={list:[],total:0,search:'',t:null};

function thumbCell(si,ii,it){
  const id=`pthumb-${si}-${ii}`;
  if(it.img)return`<div class="prod-thumb" id="${id}" title="Change image" onclick="openRowImage(${si},${ii})"><img src="${esc(it.img)}"></div>`;
  if(A.view==='internal'&&((it.brand||'').trim()||(it.model||'').trim()))return`<div class="prod-thumb empty" id="${id}" title="Pick product image" onclick="openRowImage(${si},${ii})">📷</div>`;
  return`<div id="${id}"></div>`;
}
function updThumb(si,ii){const el=document.getElementById(`pthumb-${si}-${ii}`);const it=sec(si)?.items?.[ii];if(el&&it)el.outerHTML=thumbCell(si,ii,it);}

async function captureProduct(si,ii){
  if(!imgOn())return;
  const it=sec(si)?.items?.[ii];if(!it)return;
  const brand=(it.brand||'').trim(),model=(it.model||'').trim();
  if(!brand&&!model)return;
  const key=(brand+'|'+model).toLowerCase();
  if(it._pk===key&&it.product_id)return;
  it._pk=key;
  try{
    const r=await api('GET','/api/products?limit=10&search='+encodeURIComponent(model||brand));
    const hit=(r.products||[]).find(p=>(p.model||'').trim().toLowerCase()===model.toLowerCase()&&(!brand||!(p.brand||'').trim()||(p.brand||'').trim().toLowerCase()===brand.toLowerCase()));
    if(hit){
      it.product_id=hit.id;
      let fill=false;
      if(hit.image_url&&it.img!==hit.image_url){it.img=hit.image_url;fill=true;}
      if(!it.desc&&hit.description){it.desc=hit.description;fill=true;}
      if((!it.cost||+it.cost===0)&&+hit.default_cost>0){it.cost=+hit.default_cost;fill=true;}
      schedSave();
      if(fill&&document.activeElement===document.body)draw();else updThumb(si,ii);
      return;
    }
    const cr=await api('POST','/api/products',{brand,model,description:it.desc||'',default_cost:+it.cost||0,default_margin:+it.margin||0.2});
    if(cr.product){it.product_id=cr.product.id;schedSave();updThumb(si,ii);}
  }catch(e){}
}

// Pushes a quote line's cost back to the product it's linked to, if that
// product's catalog cost is still 0/missing. Needed because captureProduct()
// above links/creates the product the moment Brand or Model is blurred --
// almost always before the user has typed a cost yet -- so without this, a
// product created from a quote line permanently keeps a 0 catalog cost even
// after the real cost is entered.
async function syncProductCost(si,ii){
  const it=sec(si)?.items?.[ii];
  if(!it||!it.product_id||!(+it.cost>0))return;
  try{ await api('POST',`/api/products/${it.product_id}/sync-cost`,{cost:+it.cost}); }catch(e){}
}

// ── Vendor-field live search (Vendor Master autocomplete; manual values allowed) ──
// NOT gated behind the Images/catalog toggle — vendor lookup is independent of
// catalog assist. Picking a suggestion fills the item's vendor (and vendor_id);
// free-typed values are kept as-is and are never auto-added to the Vendor Master.
let VDD={si:-1,ii:-1,t:null,last:'',matches:[]};
function vdSearchInput(si,ii,val){
  clearTimeout(VDD.t);
  const q=(val||'').trim();
  if(q.length<1){hideVdDrop();return;}
  VDD.t=setTimeout(async()=>{
    VDD.last=q;
    let r;
    try{r=await api('GET','/api/vendors?limit=8&search='+encodeURIComponent(q));}catch(e){return;}
    if(VDD.last!==q)return; // stale response
    VDD.si=si;VDD.ii=ii;VDD.matches=r.vendors||[];
    showVdDrop(si,ii,VDD.matches);
  },300);
}
function showVdDrop(si,ii,matches){
  const inp=document.getElementById(`vdInput-${si}-${ii}`);if(!inp)return;
  if(!matches.length){hideVdDrop();return;}
  let el=document.getElementById('vdDrop');
  if(!el){el=document.createElement('div');el.id='vdDrop';el.className='pm-drop';document.body.appendChild(el);}
  const rect=inp.getBoundingClientRect();
  el.style.left=Math.round(rect.left)+'px';
  el.style.top=Math.round(rect.bottom+4)+'px';
  el.style.width=Math.max(Math.round(rect.width),220)+'px';
  el.innerHTML=matches.map((v,idx)=>`<div class="pm-opt" onmousedown="vdPick(${idx})">
    <div class="pm-txt"><div class="pm-model">${esc(v.name||'')}</div><div class="pm-sub">${esc(v.category||'')}${v.contact_person?' · '+esc(v.contact_person):''}</div></div>
  </div>`).join('');
  el.style.display='block';
}
function hideVdDrop(){const el=document.getElementById('vdDrop');if(el)el.style.display='none';}
function vdPick(idx){
  const v=VDD.matches[idx];if(!v)return;
  const it=sec(VDD.si)?.items?.[VDD.ii];if(!it)return;
  it.vendor=v.name||'';
  it.vendor_id=v.id;
  hideVdDrop();
  const inp=document.getElementById(`vdInput-${VDD.si}-${VDD.ii}`);
  if(inp)inp.value=it.vendor; // update in place — no full redraw, keeps typing flow
  schedSave();
}

// ── Model-field live search (Product Master first, online search fallback) ────
// Gated behind the same "Images & catalog assist" toggle as captureProduct
// above, so it's a no-op (zero behavior change) for quotes that have it off.
let PMD={si:-1,ii:-1,t:null,last:'',matches:[]};
function pmSearchInput(si,ii,val){
  if(!imgOn())return;
  clearTimeout(PMD.t);
  const q=(val||'').trim();
  if(q.length<2){hidePmDrop();return;}
  PMD.t=setTimeout(async()=>{
    PMD.last=q;
    let r;
    try{r=await api('GET','/api/products?limit=8&search='+encodeURIComponent(q));}catch(e){return;}
    if(PMD.last!==q)return; // stale response — a newer keystroke has since fired
    const matches=(r.products||[]).filter(p=>p.is_active!==false);
    PMD.si=si;PMD.ii=ii;PMD.matches=matches;
    showPmDrop(si,ii,q,matches);
  },300);
}
// Manual trigger for the 🔍 icon next to the Model field: skips the 300ms
// typing debounce so a click searches immediately, and — unlike the silent
// no-op that typing produces — explains itself when Images/catalog assist is
// off for this quote, since that's the most common reason search "does
// nothing" and it isn't obvious from the Model field alone.
function pmSearchIconClick(si,ii){
  if(!imgOn()){
    alert('Product search is off for this quote.\n\nTurn on "🖼 Images" in the toolbar above to search the Product Master and enable AI Model Lookup.');
    return;
  }
  const inp=document.getElementById(`pmInput-${si}-${ii}`);
  if(!inp)return;
  const q=(inp.value||'').trim();
  const it=sec(si)?.items?.[ii];
  const q2=q||(it?.brand||'').trim()||(it?.desc||'').trim();
  clearTimeout(PMD.t);
  hidePmDrop();
  showImagePicker(it?.product_id||'',q2,si,ii);
}
function showPmDrop(si,ii,query,matches){
  const inp=document.getElementById(`pmInput-${si}-${ii}`);if(!inp)return;
  let el=document.getElementById('pmDrop');
  if(!el){el=document.createElement('div');el.id='pmDrop';el.className='pm-drop';document.body.appendChild(el);}
  const rect=inp.getBoundingClientRect();
  el.style.left=Math.round(rect.left)+'px';
  el.style.top=Math.round(rect.bottom+4)+'px';
  el.style.width=Math.max(Math.round(rect.width),260)+'px';
  const rows=matches.map((p,idx)=>`<div class="pm-opt" onmousedown="pmPick(${idx})">
    ${p.image_url?`<img class="pm-thumb" src="${esc(p.image_url)}">`:`<div class="pm-thumb empty">📦</div>`}
    <div class="pm-txt"><div class="pm-model">${esc(p.model||p.brand||'(unnamed)')}</div><div class="pm-sub">${esc(p.brand||'')}${p.category?' · '+esc(p.category):''}${p.sku?' · '+esc(p.sku):''}</div></div>
  </div>`).join('');
  const noMatch=matches.length?'':`<div style="padding:10px 12px;font-size:12.5px;color:var(--gray-500)">No matches in your Product Master.</div>`;
  const onlineRow=`<div class="pm-online" onmousedown="pmOnlineSearch(${si},${ii})">🔍 ${matches.length?'Not the right one? ':''}Search online</div>`;
  el.innerHTML=rows+noMatch+onlineRow;
  el.style.display='block';
}
function hidePmDrop(){const el=document.getElementById('pmDrop');if(el)el.style.display='none';}
function pmPick(idx){
  const p=PMD.matches[idx];if(!p)return;
  const it=sec(PMD.si)?.items?.[PMD.ii];if(!it)return;
  it.brand=p.brand||'';it.model=p.model||'';
  if(p.description)it.desc=p.description;
  if(+p.default_cost>0)it.cost=+p.default_cost;
  if(p.default_margin!=null)it.margin=+p.default_margin;
  if(p.image_url)it.img=p.image_url;
  it.product_id=p.id;
  it._pk=((p.brand||'')+'|'+(p.model||'')).toLowerCase();
  hidePmDrop();
  schedSave();draw();
}

// ── Online search fallback (model not found in Product Master) ────────────────
let PMOS={si:-1,ii:-1,images:[],selectedImg:''};
function pmOnlineSearch(si,ii){
  hidePmDrop();
  const inp=document.getElementById(`pmInput-${si}-${ii}`);
  const query=((inp?inp.value:sec(si)?.items?.[ii]?.model)||'').trim();
  if(!query){alert('Type a model number first.');return;}

}
function pmManualFormHTML(query,brand,desc){
  return`<div class="fld"><label>Brand</label><input id="pmoBrand" value="${esc(brand)}" placeholder="Brand"></div>
  <div class="fld"><label>Model</label><input id="pmoModel" value="${esc(query)}" placeholder="Model"></div>
  <div class="fld"><label>Description</label><input id="pmoDesc" value="${esc(desc)}" placeholder="Short description"></div>`;
}
async function showPmOnlineModal(si,ii,query){
  closePmOnlineModal();
  PMOS={si,ii,images:[],selectedImg:''};
  document.body.insertAdjacentHTML('beforeend',`<div class="modal-overlay" id="pmOnlineOverlay" onclick="if(event.target===this)closePmOnlineModal()">
    <div class="modal" style="max-width:560px;max-height:85vh;overflow-y:auto">
      <div class="modal-title">🔍 Search online</div>
      <div class="modal-sub">"${esc(query)}"</div>
      <div id="pmOnlineBody"><div style="text-align:center;padding:26px;color:var(--gray-500)">Searching online…</div></div>
    </div></div>`);
  let r;

  catch(e){r={error:'Search failed. Check your connection and try again.'};}

  if(r.error){
    body.innerHTML=`<div class="auth-err">${esc(r.error)}</div><div style="font-size:13px;color:var(--gray-500);margin:10px 0">You can still add this item manually — it will be saved to your Product Master.</div>${pmManualFormHTML(query,'','')}<div class="modal-actions"><button class="btn" onclick="closePmOnlineModal()">Cancel</button><button class="btn" onclick="showPmOnlineModal(${si},${ii},document.getElementById('pmoModel')?.value||'${esc(query)}')">Search again</button><button class="btn btn-navy" onclick="pmOnlineConfirm(${si},${ii})">Confirm &amp; Add</button></div>`;

  }

    ${pmManualFormHTML(query,r.guessed_brand||'',top?(top.snippet||top.title||''):'')}
    <div class="fld"><label>Image</label>${(r.images||[]).length?`<div class="img-grid">${r.images.map((im,idx)=>`<div class="img-opt" id="pmImgOpt-${idx}" onclick="pmSelectImg(${idx})"><img src="${esc(im.thumb)}" loading="lazy" onerror="this.parentNode.style.display='none'"><div class="img-src">${esc((im.source||'').replace(/^https?:\/\/(www\.)?/,'').split('/')[0])}</div></div>`).join('')}</div><div style="font-size:11px;color:var(--gray-500);margin-top:4px">Click an image to select it (optional).</div>`:`<div style="font-size:12.5px;color:var(--gray-500)">No images found — you can add one later from the Products page.</div>`}</div>
    <div class="modal-actions">
      <button class="btn" onclick="closePmOnlineModal()">Cancel</button>
      <button class="btn" onclick="showPmOnlineModal(${si},${ii},document.getElementById('pmoModel')?.value||'${esc(query)}')">Search again</button>
      <button class="btn btn-navy" onclick="pmOnlineConfirm(${si},${ii})">Confirm &amp; Add</button>
    </div>`;
}
function pmSelectImg(idx){
  document.querySelectorAll('#pmOnlineBody .img-opt').forEach(e=>e.style.outline='');
  const el=document.getElementById('pmImgOpt-'+idx);if(el)el.style.outline='2.5px solid var(--navy)';
  PMOS.selectedImg=(PMOS.images[idx]||{}).url||'';
}
function closePmOnlineModal(){const el=document.getElementById('pmOnlineOverlay');if(el)el.remove();}
async function pmOnlineConfirm(si,ii){
  const brand=(document.getElementById('pmoBrand')?.value||'').trim();
  const model=(document.getElementById('pmoModel')?.value||'').trim();
  const desc=(document.getElementById('pmoDesc')?.value||'').trim();
  if(!brand&&!model){alert('Enter at least a brand or model.');return;}
  const cr=await api('POST','/api/products',{brand,model,description:desc,default_cost:0,default_margin:0.2});
  if(cr.error){alert(cr.error);return;}
  let product=cr.product;
  if(PMOS.selectedImg&&product?.id){
    const ir=await api('POST','/api/products/'+product.id+'/image',{url:PMOS.selectedImg});
    if(ir.product)product=ir.product;
  }
  const it=sec(si)?.items?.[ii];
  if(it){
    it.brand=brand;it.model=model;if(desc)it.desc=desc;
    if(product&&product.image_url)it.img=product.image_url;
    it.product_id=product?product.id:it.product_id;
    it._pk=(brand+'|'+model).toLowerCase();
  }
  closePmOnlineModal();
  schedSave();draw();
}

async function openRowImage(si,ii){
  const it=sec(si)?.items?.[ii];if(!it)return;
  const q=((it.brand||'')+' '+(it.model||'')).trim();
  if(!q){alert('Enter a brand or model first.');return;}
  if(!it.product_id)await captureProduct(si,ii);
  if(!it.product_id){alert('Could not save this product to the catalog. Check your connection and try again.');return;}
  showImagePicker(it.product_id,q,si,ii);
}

function showImagePicker(pid,query,si,ii){
  closeImgPicker();
  document.body.insertAdjacentHTML('beforeend',`<div class="modal-overlay" id="imgOverlay" onclick="if(event.target===this)closeImgPicker()">
    <div class="modal" style="max-width:640px;max-height:85vh;overflow-y:auto">
      <div class="modal-title">🖼 Product image</div>
      <div style="display:flex;gap:8px;margin:10px 0 14px">
        <input class="iinput" id="imgQ" type="text" placeholder="Model, brand or keywords" value="${esc(query)}" style="flex:1" onkeydown="if(event.key==='Enter')runImgSearch('${pid}',${si},${ii})">
        <button class="btn btn-navy" onclick="runImgSearch('${pid}',${si},${ii})">🔍 Search</button>
      </div>
      <div id="imgBody"><div style="text-align:center;padding:26px;color:var(--gray-500)">Type a search term above, or search runs automatically if a model was entered.</div></div>
      <div class="modal-actions" style="justify-content:space-between">
        <label class="btn" style="cursor:pointer">📤 Upload image<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none" onchange="uploadProdImage(event,'${pid}',${si},${ii})"></label>
        <button class="btn" onclick="closeImgPicker()">Cancel</button>
      </div>
    </div></div>`);
  if((query||'').trim())runImgSearch(pid,si,ii);
}

function runImgSearch(pid,si,ii){
  const q=(document.getElementById('imgQ')?.value||'').trim();
  if(!q)return;
  const el=document.getElementById('imgBody');
  if(el)el.innerHTML=`<div style="text-align:center;padding:26px;color:var(--gray-500)">Searching your vendor sites…</div>`;
  api('GET','/api/products/image-search?q='+encodeURIComponent(q)).then(r=>{
    const el=document.getElementById('imgBody');if(!el)return;
    if(r.error){el.innerHTML=`<div class="auth-err">${esc(r.error)}</div><div style="font-size:13px;color:var(--gray-500);margin-top:8px">You can still upload an image manually below.</div>`;return;}
    if(!(r.images||[]).length){el.innerHTML=`<div style="color:var(--gray-500);padding:14px">No images found for this search — try different keywords or upload one manually below.</div>`;return;}
    el.innerHTML=`<div class="img-grid">${r.images.map(im=>{
      const u=encodeURIComponent(im.url).replace(/'/g,'%27');
      const src=(im.source||'').replace(/^https?:\/\/(www\.)?/,'').split('/')[0];
      return`<div class="img-opt" onclick="pickProdImage('${pid}','${u}',${si},${ii})"><img src="${esc(im.thumb)}" loading="lazy" onerror="this.parentNode.style.display='none'"><div class="img-src">${esc(src)}</div></div>`;
    }).join('')}</div><div style="font-size:12px;color:var(--gray-500)">Click the correct image — it will be saved to your catalog.</div>`;
  });
}
function closeImgPicker(){const el=document.getElementById('imgOverlay');if(el)el.remove();}
async function pickProdImage(pid,encUrl,si,ii){
  const el=document.getElementById('imgBody');if(el)el.innerHTML='<div style="text-align:center;padding:26px;color:var(--gray-500)">Saving image…</div>';
  const r=await api('POST','/api/products/'+pid+'/image',{url:decodeURIComponent(encUrl)});
  if(r.error){if(el)el.innerHTML=`<div class="auth-err">${esc(r.error)}</div><div style="font-size:13px;color:var(--gray-500);margin-top:8px">Try another result or upload manually below.</div>`;return;}
  finishImage(pid,r.product.image_url,si,ii);
}
function uploadProdImage(event,pid,si,ii){
  const file=event.target.files[0];if(!file)return;event.target.value='';
  if(file.size>4*1024*1024){alert('Image must be under 4 MB.');return;}
  const el=document.getElementById('imgBody');if(el)el.innerHTML='<div style="text-align:center;padding:26px;color:var(--gray-500)">Uploading…</div>';
  const reader=new FileReader();
  reader.onload=async function(e){
    const r=await api('POST','/api/products/'+pid+'/image',{data:e.target.result,content_type:file.type});
    if(r.error){if(el)el.innerHTML=`<div class="auth-err">${esc(r.error)}</div>`;return;}
    finishImage(pid,r.product.image_url,si,ii);
  };
  reader.readAsDataURL(file);
}
function finishImage(pid,url,si,ii){
  closeImgPicker();
  let touched=false;
  if(A.activeQuote)opts().forEach(op=>(op.sections||[]).forEach(s=>(s.items||[]).forEach(it=>{if(it.product_id===pid){it.img=url;touched=true;}})));
  if(si>=0&&ii>=0){const it=sec(si)?.items?.[ii];if(it){it.img=url;it.product_id=pid;touched=true;}}
  if(touched&&A.activeQuote)schedSave();
  if(A.page==='editor')draw();
  if(A.page==='products')loadProducts();
}

// ── Products page ─────────────────────────────────────────────────────────────

function downloadProdTemplate(){
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet([['BRAND','MODEL','SKU','CATEGORY','DESCRIPTION','COST','MARGIN %'],['Infiled','IL-FISS-ORMV 3.9Pro','INF-FISS-39','LED display','SMD1818 black frame LED, 1000x1000mm cabinet',6299.25,20]]);
  ws['!cols']=[{wch:16},{wch:26},{wch:16},{wch:16},{wch:50},{wch:12},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws,'Products');

function importProducts(event){
  const file=event.target.files[0];if(!file)return;event.target.value='';
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      let hi=-1;
      for(let i=0;i<Math.min(rows.length,10);i++){const r=rows[i].map(x=>String(x).toUpperCase());if(r.some(x=>x.includes('MODEL'))){hi=i;break;}}
      if(hi===-1){alert('Could not find a MODEL column header in that file.');return;}
      const H=rows[hi].map(x=>String(x).toUpperCase().trim());
      const col={brand:H.findIndex(h=>h.includes('BRAND')),model:H.findIndex(h=>h.includes('MODEL')),sku:H.findIndex(h=>h.includes('SKU')),category:H.findIndex(h=>h.includes('CATEGORY')),desc:H.findIndex(h=>h.includes('DESC')),cost:H.findIndex(h=>h.includes('COST')||h.includes('MSRP')),margin:H.findIndex(h=>h.includes('MARGIN'))};
      const products=[];
      for(let i=hi+1;i<rows.length;i++){
        const row=rows[i];if(!row||row.every(x=>x===''||x===null))continue;
        const g=x=>x>=0?String(row[x]??'').trim():'';
        let m=parseFloat(g(col.margin))||0;if(m>1)m=m/100;
        products.push({brand:g(col.brand),model:g(col.model),sku:g(col.sku),category:g(col.category),description:g(col.desc),default_cost:parseFloat(g(col.cost))||0,default_margin:m||0.2});
      }
      if(!products.length){alert('No product rows found below the header.');return;}
      if(products.length>500){alert('Maximum 500 rows per import — please split the file.');return;}
      if(!confirm(`Import ${products.length} products into the catalog?`))return;
      const r=await api('POST','/api/products/bulk',{products});
      if(r.error){alert(r.error);return;}
      alert(`Imported ${r.imported} products${r.skipped?`, skipped ${r.skipped} rows without brand/model`:''}.`);
      loadProducts();
    }catch(err){alert('Could not read that Excel file.');}
  };
  reader.readAsBinaryString(file);
}

async function generateBom(){
  if(BOM.busy)return;
  const desc=(document.getElementById('bomDesc')?.value||'').trim();
  if(!desc){alert('Describe the project first.');return;}
  BOM.busy=true;
  const btn=document.getElementById('bomGenBtn');if(btn){btn.disabled=true;btn.textContent='Generating…';}
  const body=document.getElementById('bomBody');
  if(body)body.innerHTML='<div style="text-align:center;padding:26px;color:var(--gray-500)">⏳ Matching your catalog and drafting a BOM… this can take up to 30 seconds</div>';
  let r;
  try{r=await api('POST','/api/bom/generate',{description:desc,currency:A.cur});}
  catch(e){if(body)body.innerHTML='<div class="auth-err">Could not reach the BOM service. Please try again.</div>';BOM.busy=false;if(btn){btn.disabled=false;btn.textContent='Generate';}return;}
  BOM.busy=false;if(btn){btn.disabled=false;btn.textContent='Generate';}
  if(r.error){if(body)body.innerHTML=`<div class="auth-err">${esc(r.error)}</div>`;return;}
  BOM.sections=(r.sections||[]).map(s=>({name:s.name||'Suggested items',items:(s.items||[]).map(it=>({...it,_checked:true}))}));
  renderBom();
}
function renderBom(){
  const body=document.getElementById('bomBody');if(!body)return;
  if(!BOM.sections.length){body.innerHTML='<div style="color:var(--gray-500);padding:14px">No suggestions returned — try a more detailed description.</div>';return;}
  body.innerHTML=BOM.sections.map((s,si)=>`<div style="margin-top:14px">

    <div style="border:1.5px solid var(--gray-200);border-radius:8px;overflow:hidden">

        </div>
        <div style="width:60px"><input type="number" value="${it.qty||1}" min="1" style="width:100%;padding:6px;font-size:13px;border:1.5px solid var(--gray-200);border-radius:6px" onchange="BOM.sections[${si}].items[${ii}].qty=+this.value"></div>
        <div style="width:80px;text-align:right;font-size:13px;color:var(--gray-500)">${fmt(it.cost||0)}</div>
      </div>`).join('')}
    </div>
  </div>`).join('')+
  `<div style="margin-top:16px;display:flex;justify-content:flex-end"><button class="btn btn-navy" onclick="applyBom()">+ Add selected to quote</button></div>`;
}
function applyBom(){
  const o=opt();if(!o)return;
  let added=0;
  BOM.sections.forEach(s=>{
    const items=s.items.filter(it=>it._checked).map(it=>{
      const item=mkItem(it.brand||'',it.model||'',it.description||'',it.qty||1,+it.cost||0,0,+it.margin||0.2);
      if(it.product_id)item.product_id=it.product_id;
      return item;
    });
    if(items.length){o.sections.push({id:uid(),name:s.name||'Suggested items',items});added+=items.length;}
  });
  if(!added){alert('No items selected.');return;}
  schedSave();closeBomModal();draw();
}

async function draftProposal(){
  if(PROP.busy)return;
  const brief=(document.getElementById('propBrief')?.value ?? PROP.brief ?? '').trim();
  if(!brief&&!PROP.file){alert('Describe the project or attach a reference document first.');return;}
  PROP.brief=brief;
  const wasReview=PROP.step==='review';
  const btn=document.getElementById(wasReview?'propRedraftBtn':'propGenBtn');
  if(btn){btn.disabled=true;btn.textContent=wasReview?'Redrafting…':'Drafting…';}
  PROP.busy=true;
  const body=wasReview?null:document.getElementById('propBody');
  if(body)body.innerHTML='<div style="text-align:center;padding:26px;color:var(--gray-500)">⏳ Drafting proposal content… this can take up to a minute</div>';
  let r;
  try{
    r=await api('POST','/api/proposal/draft',{quote_id:A.activeQuote.id,brief,which:PROP.which,attachment:PROP.file,model:PROP.model});
  }catch(e){
    PROP.busy=false;
    if(wasReview){alert('Could not reach the proposal service. Please try again.');if(btn){btn.disabled=false;btn.textContent='🔄 Redraft with AI';}}
    else{if(body)body.innerHTML='<div class="auth-err">Could not reach the proposal service. Please try again.</div>';if(btn){btn.disabled=false;btn.textContent='Draft with AI ✨';}}
    return;
  }
  PROP.busy=false;
  if(r.error){
    if(wasReview){alert('Redraft failed: '+r.error);if(btn){btn.disabled=false;btn.textContent='🔄 Redraft with AI';}}
    else{if(body)body.innerHTML=`<div class="auth-err">${esc(r.error)}</div>`;if(btn){btn.disabled=false;btn.textContent='Draft with AI ✨';}}
    return;
  }
  PROP.content=r.content;
  PROP.step='review';
  renderProposalModal();
}

async function renderProposalKind(kind){
  if(PROP.busy)return;
  const idMap={technical:'propGenTech',commercial:'propGenComm',combined:'propGenComb'};
  const labelMap={technical:'📘 Technical (no pricing)',commercial:'💰 Commercial (priced)',combined:'📗 Combined (priced)'};
  PROP.busy=true;

  let r;
  try{
    r=await api('POST','/api/proposal/render',{quote_id:A.activeQuote.id,which:PROP.which,kind,content:PROP.content});
  }catch(e){
    PROP.busy=false;if(btn){btn.disabled=false;btn.textContent=labelMap[kind];}
    alert('Could not reach the proposal service. Please try again.');return;
  }

  ws['!cols']=[{wch:18},{wch:22},{wch:24},{wch:16},{wch:26},{wch:14}];

function importCustomers(event){
  const file=event.target.files[0];if(!file)return;event.target.value='';
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      let hi=-1;
      for(let i=0;i<Math.min(rows.length,10);i++){const r=rows[i].map(x=>String(x).toUpperCase());if(r.some(x=>x.includes('NAME'))){hi=i;break;}}
      if(hi===-1){alert('Could not find a NAME column header in that file.');return;}
      const H=rows[hi].map(x=>String(x).toUpperCase().trim());
      const col={name:H.findIndex(h=>h.includes('NAME')&&!h.includes('COMPANY')),company:H.findIndex(h=>h.includes('COMPANY')),email:H.findIndex(h=>h.includes('EMAIL')),phone:H.findIndex(h=>h.includes('PHONE')),address:H.findIndex(h=>h.includes('ADDRESS')),trn:H.findIndex(h=>h.includes('TRN'))};
      const customers=[];
      for(let i=hi+1;i<rows.length;i++){
        const row=rows[i];if(!row||row.every(x=>x===''||x===null))continue;
        const g=x=>x>=0?String(row[x]??'').trim():'';
        customers.push({name:g(col.name),company_name:g(col.company),email:g(col.email),phone:g(col.phone),address:g(col.address),trn:g(col.trn)});
      }
      if(!customers.length){alert('No customer rows found below the header.');return;}
      if(customers.length>1000){alert('Maximum 1000 rows per import — please split the file.');return;}
      if(!confirm(`Import ${customers.length} customers?`))return;
      const r=await api('POST','/api/customers/bulk',{customers});
      if(r.error){alert(r.error);return;}
      alert(`Imported ${r.imported} customers${r.skipped?`, skipped ${r.skipped} rows without a name`:''}.`);
      loadCustomersPage();
    }catch(err){alert('Could not read that Excel file.');}
  };
  reader.readAsBinaryString(file);
}

async function uploadCompanyLogo(event){
  const file=event.target.files[0];if(!file)return;event.target.value='';
  const reader=new FileReader();
  reader.onload=async function(e){
    const r=await api('POST','/api/auth/company-profile/logo',{data:e.target.result,content_type:file.type});
    if(r.error){alert(r.error);return;}
    CP.logo_url=r.logo_url;
    const el=document.getElementById('cpLogoPreview');
    if(el)el.innerHTML=`<img src="${esc(r.logo_url)}" style="max-width:100%;max-height:100%">`;
  };
  reader.readAsDataURL(file);
}

// ── Integrations (per-company; Zoho today, more providers can be added later) ─
let INTEGS={list:[]};
const FIELD_LABELS={client_id:'Client ID',client_secret:'Client Secret',refresh_token:'Refresh Token',org_id:'Organization ID'};
async function loadIntegrations(){
  const el=document.getElementById('integrationsList');if(!el)return;
  const r=await api('GET','/api/integrations');
  if(r.error){el.innerHTML=`<div class="auth-err">${esc(r.error)}</div>`;return;}
  INTEGS.list=r.integrations||[];
  if(!INTEGS.list.length){el.innerHTML='<div style="color:var(--gray-500)">No integrations available.</div>';return;}
  el.innerHTML=INTEGS.list.map(i=>{
    const statusColor={connected:'var(--green)',error:'var(--red)',disconnected:'var(--gray-500)'}[i.status]||'var(--gray-500)';
    const statusLabel={connected:'Connected',error:'Connection error',disconnected:'Not connected'}[i.status]||i.status;
    return`<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--gray-100)">
      <div>
        <div style="font-weight:600;font-size:14px">${esc(i.label)}</div>
        <div style="font-size:12px;color:${statusColor}">${statusLabel}${i.last_synced_at?` · last synced ${new Date(i.last_synced_at).toLocaleString()}`:''}</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm" onclick="showIntegrationModal('${i.provider}')">${i.status==='connected'?'Edit credentials':'Connect'}</button>
        ${i.status==='connected'?`<button class="btn btn-sm btn-red" onclick="disconnectIntegration('${i.provider}')">Disconnect</button>`:''}
      </div>
    </div>`;
  }).join('');
}
function showIntegrationModal(provider){
  const i=INTEGS.list.find(x=>x.provider===provider);if(!i)return;
  const fields=(i.required_fields||[]).map(f=>`
    <div class="fld"><label>${esc(FIELD_LABELS[f]||f)}</label><input id="intf-${f}" type="password" placeholder="${i.fields&&i.fields[f]?i.fields[f]+' (leave blank to keep)':''}"></div>
  `).join('');
  document.body.insertAdjacentHTML('beforeend',`<div class="modal-overlay" id="integOverlay" onclick="if(event.target===this)document.getElementById('integOverlay').remove()">
    <div class="modal">
      <div class="modal-title">Connect ${esc(i.label)}</div>
      <div class="modal-sub">These credentials are stored for your company only and never shared with other companies on this platform.</div>
      <div id="integErr" class="auth-err" style="display:none"></div>
      ${fields}
      <div class="modal-actions">
        <button class="btn" onclick="document.getElementById('integOverlay').remove()">Cancel</button>
        <button class="btn btn-navy" onclick="saveIntegration('${provider}')">Save & Test</button>
      </div>
    </div></div>`);
}
async function saveIntegration(provider){
  const i=INTEGS.list.find(x=>x.provider===provider);if(!i)return;
  const credentials={};
  (i.required_fields||[]).forEach(f=>{const el=document.getElementById(`intf-${f}`);if(el&&el.value)credentials[f]=el.value;});
  const r=await api('POST','/api/integrations/connect',{provider,credentials});
  if(r.error){const e=document.getElementById('integErr');e.textContent=r.error;e.style.display='block';return;}
  document.getElementById('integOverlay').remove();
  loadIntegrations();
  loadSyncConfig();
}
async function disconnectIntegration(provider){
  if(!confirm('Disconnect this integration? Synced records already in your Customer/Vendor Master will stay, but new syncs will stop working until you reconnect.'))return;
  await api('DELETE','/api/integrations/'+provider);
  loadIntegrations();
  loadSyncConfig();
}

// ── Sync configuration: admin picks which connected integration feeds each
// data type (explicit dropdown, not auto-detected) ────────────────────────────
async function loadSyncConfig(){
  const el=document.getElementById('syncConfigBox');if(!el)return;
  const r=await api('GET','/api/integrations/sync-config');
  if(r.error){el.innerHTML=`<div class="auth-err">${esc(r.error)}</div>`;return;}
  const opts=r.connected_providers||[];
  if(!opts.length){el.innerHTML='<div style="color:var(--gray-500);font-size:13px">Connect an integration above to enable sync.</div>';return;}
  const optHtml=(selected)=>'<option value="">— None —</option>'+opts.map(o=>`<option value="${esc(o.provider)}" ${selected===o.provider?'selected':''}>${esc(o.label)}</option>`).join('');
  el.innerHTML=`
    <div class="fld"><label>Customer sync source</label><select id="syncCfgCust" style="padding:8px 10px;font-size:14px;border:1.5px solid var(--gray-200);border-radius:var(--radius);font-family:inherit;width:100%;max-width:260px">${optHtml(r.customer_sync_provider)}</select></div>
    <div class="fld"><label>Vendor sync source</label><select id="syncCfgVend" style="padding:8px 10px;font-size:14px;border:1.5px solid var(--gray-200);border-radius:var(--radius);font-family:inherit;width:100%;max-width:260px">${optHtml(r.vendor_sync_provider)}</select></div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:12px 0;cursor:pointer"><input type="checkbox" id="syncCfgAuto" ${r.auto_sync_enabled?'checked':''}> Enable automatic daily sync (uses the sources selected above, runs once a day)</label>
    <button class="btn btn-navy btn-sm" onclick="saveSyncConfig()">Save</button>
  `;

// ── Excel import ──────────────────────────────────────────────────────────────
function importExcel(event){
  const file=event.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      let hi=-1;
      for(let i=0;i<Math.min(rows.length,15);i++){
        const r=rows[i].map(c=>String(c).toUpperCase().trim());
        if(r.some(c=>c.includes('BRAND')||c.includes('MODEL')||c.includes('DESC'))){hi=i;break;}
      }
      if(hi===-1){alert('Could not find column headers. Make sure the file has BRAND, MODEL, DESCRIPTION columns.');return;}
      const H=rows[hi].map(c=>String(c).toUpperCase().trim());
      const col={section:H.findIndex(h=>h.includes('SECTION')),brand:H.findIndex(h=>h.includes('BRAND')),model:H.findIndex(h=>h.includes('MODEL')),desc:H.findIndex(h=>h.includes('DESC')),unitPrice:H.findIndex(h=>h.includes('UNIT')||h.includes('SELL')),qty:H.findIndex(h=>h==='QTY'||h.includes('QUANT')),margin:H.findIndex(h=>h.includes('MARGIN')),cost:H.findIndex(h=>h.includes('MSRP')||h.includes('COST')),disc:H.findIndex(h=>h.includes('DISC'))};
      const hasSec=col.section>=0;
      const sections=[];const smap={};let curSec=null;
      for(let i=hi+1;i<rows.length;i++){
        const row=rows[i];
        if(!row||row.every(c=>c===''||c===null))continue;
        const secN=hasSec&&col.section>=0?String(row[col.section]||'').trim():'';
        const brand=col.brand>=0?String(row[col.brand]||'').trim():'';
        const model=col.model>=0?String(row[col.model]||'').trim():'';
        const desc=col.desc>=0?String(row[col.desc]||'').trim():'';
        const up=col.unitPrice>=0?parseFloat(row[col.unitPrice])||0:0;
        const qty=col.qty>=0?parseFloat(row[col.qty])||1:1;
        const mr=col.margin>=0?parseFloat(row[col.margin])||0.2:0.2;
        const margin=mr>1?mr/100:mr;
        const costRaw=col.cost>=0?parseFloat(row[col.cost])||0:0;
        const disc=col.disc>=0?parseFloat(row[col.disc])||0:0;
        const rowTxt=(secN+brand+model+desc).toUpperCase();
        if(rowTxt.includes('TOTAL')||rowTxt.includes('GRAND')||rowTxt.includes('VAT'))continue;
        if(hasSec){
          if(!brand&&!model&&!desc)continue;
          const sn=secN||'General';
          if(!smap[sn]){const ns={id:uid(),name:sn,items:[]};sections.push(ns);smap[sn]=ns;}
          curSec=smap[sn];
        } else {
          const isSec=(!brand&&!model&&up===0)&&(desc.length>2||String(row[0]||'').trim().length>2);
          if(isSec){const sn=desc||String(row[0]||'').trim();if(sn&&!sn.toUpperCase().includes('TOTAL')){if(!smap[sn]){const ns={id:uid(),name:sn,items:[]};sections.push(ns);smap[sn]=ns;}curSec=smap[sn];}continue;}
          if(!brand&&!model&&!desc)continue;
          if(!curSec){curSec={id:uid(),name:'Imported Items',items:[]};sections.push(curSec);smap['Imported Items']=curSec;}
        }
        let cost=costRaw;
        if(!cost&&up&&margin)cost=up*(1-margin);
        curSec.items.push({id:uid(),brand,model,desc,qty:qty||1,cost:Math.round(cost),disc:disc>1?disc:disc*100,margin:margin||0.2});
      }
      if(!sections.length){alert('No items found. Check your file format.');return;}
      if(!A.activeQuote.quote_data)A.activeQuote.quote_data=[];
      if(!A.activeQuote.quote_data[A.activeOpt])A.activeQuote.quote_data[A.activeOpt]=mkOption('Option 1');
      A.activeQuote.quote_data[A.activeOpt].sections=sections;
      if(!A.activeQuote.customer)A.activeQuote.customer=file.name.replace(/\.xlsx?$/i,'').replace(/_/g,' ');
      schedSave();draw();
      const total=sections.reduce((s,sec)=>s+sec.items.length,0);
      setTimeout(()=>alert(`✅ Import successful!\n\n${sections.length} sections · ${total} line items`),100);
    }catch(err){console.error(err);alert('Error reading file: '+err.message);}
  };
  reader.readAsBinaryString(file);
  event.target.value='';
}

// ── Public client feedback form (no login required) ─────────────────────────
const FB={loading:true,error:null,token:null,project_name:null,company_name:null,submitted:false,rating:0,busy:false};

async function loadFeedbackDetails(){
  let r;
  try{r=await api('GET','/api/testimonials/verify?token='+encodeURIComponent(FB.token));}
  catch(err){FB.loading=false;FB.error='Could not reach the server. Please try again.';draw();return;}
  FB.loading=false;
  if(r.error){FB.error=r.error;}
  else{FB.project_name=r.project_name;FB.company_name=r.company_name;}
  draw();
}

function fbSetRating(n){FB.rating=n;draw();}

async function submitFeedbackForm(e){
  e.preventDefault();
  if(FB.busy)return;
  if(!FB.rating){alert('Please select a star rating.');return;}
  const testimonial=(document.getElementById('fbText')?.value||'').trim();
  if(!testimonial){alert('Please write a short testimonial.');return;}
  FB.busy=true;
  const btn=document.getElementById('fbBtn');if(btn){btn.disabled=true;btn.textContent='Submitting…';}
  const body={
    token:FB.token,
    rating:FB.rating,
    testimonial,
    client_name:(document.getElementById('fbName')?.value||'').trim(),
    client_title:(document.getElementById('fbTitle')?.value||'').trim(),
    consent_to_publish:!!document.getElementById('fbConsent')?.checked,
  };
  let r;
  try{r=await api('POST','/api/testimonials/submit',body);}
  catch(err){FB.busy=false;if(btn){btn.disabled=false;btn.textContent='Submit feedback →';}alert('Could not reach the server. Please try again.');return;}
  FB.busy=false;
  if(r.error){if(btn){btn.disabled=false;btn.textContent='Submit feedback →';}alert('❌ '+r.error);return;}
  FB.submitted=true;draw();
}

function feedbackStarsHTML(){
  let out='<div style="display:flex;gap:6px;margin:6px 0 2px;font-size:32px;line-height:1">';
  for(let i=1;i<=5;i++){
    out+=`<span style="cursor:pointer;color:${i<=FB.rating?'#f4b400':'#e2e6eb'}" onclick="fbSetRating(${i})">★</span>`;
  }
  return out+'</div>';
}

  if(FB.loading)return`<div class="auth-shell"><div class="auth-card"><div class="auth-desc">Loading…</div></div></div>`;
  if(FB.error)return`<div class="auth-shell"><div class="auth-card">

  return`<div class="auth-shell"><div class="auth-card">

      <div class="fld"><label>Your name (optional)</label><input id="fbName" placeholder="Your name"></div>

      <div class="fld" style="display:flex;align-items:flex-start;gap:8px;margin-top:4px">
        <input type="checkbox" id="fbConsent" style="margin-top:3px">
        <label style="font-weight:400;font-size:13px" for="fbConsent">I agree that Sysconic Technologies may publish this feedback publicly (e.g. on their website), optionally with my name and title.</label>
      </div>
      <button class="auth-btn" type="submit" id="fbBtn">Submit feedback →</button>
    </form>
  </div></div>`;
}

    A.screen='acceptInvite';INV.token=inviteToken;draw();loadInviteDetails();
  }else if(resetToken){
    A.screen='resetPassword';RST.token=resetToken;draw();
  }else{

  }
})();
